[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "omnicontext-workspace"
version = "0.1.0"
description = "Repo-local control plane for AI coding assistant context."
readme = "README.md"
requires-python = ">=3.11"

[project.scripts]
omni = "make_ai:main"

[tool.setuptools]
py-modules = ["make_ai"]
