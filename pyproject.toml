[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "omniengineering-workspace"
version = "0.1.0"
description = "Repo-local software engineering workspace for AI-assisted delivery."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"

[project.scripts]
omni = "make_ai:main"

[project.optional-dependencies]
graph = [
    "tree-sitter>=0.23,<1.0",
    "tree-sitter-python>=0.23,<1.0",
    "tree-sitter-javascript>=0.23,<1.0",
    "tree-sitter-typescript>=0.23,<1.0",
]

[tool.setuptools]
py-modules = ["make_ai", "omni_graph"]
