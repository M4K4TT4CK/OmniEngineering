<svg width="1100" height="620" viewBox="0 0 1100 620" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">OmniEngineering data model diagram</title>
  <desc id="desc">The relationship between workspace context, structured rules, requirements, schemas, assistant entrypoints, docs, and validation.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1100" y2="620" gradientUnits="userSpaceOnUse">
      <stop stop-color="#171614"/>
      <stop offset="0.58" stop-color="#252829"/>
      <stop offset="1" stop-color="#2D312A"/>
    </linearGradient>
    <linearGradient id="hub" x1="410" y1="116" x2="690" y2="422" gradientUnits="userSpaceOnUse">
      <stop stop-color="#D88C2D"/>
      <stop offset="1" stop-color="#18A999"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FFFFFF" stop-opacity="0.17"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.08"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#020817" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="1100" height="620" rx="28" fill="url(#bg)"/>
  <text x="550" y="58" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="800" fill="#F4EFE4">Data Model</text>
  <text x="550" y="92" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" fill="#B9C5BE">Human-readable context and structured JSON records work together as a repo-local control plane.</text>

  <g filter="url(#shadow)">
    <rect x="392" y="144" width="316" height="300" rx="30" fill="url(#hub)"/>
    <rect x="420" y="172" width="260" height="244" rx="22" fill="#171614" fill-opacity="0.94"/>
    <text x="550" y="222" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="800" fill="#F4EFE4">.ai/</text>
    <text x="550" y="254" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#18A999">workspace memory</text>
    <rect x="456" y="292" width="188" height="32" rx="8" fill="#F4EFE4" fill-opacity="0.12"/>
    <text x="550" y="314" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" fill="#F4EFE4">core context</text>
    <rect x="456" y="334" width="188" height="32" rx="8" fill="#F4EFE4" fill-opacity="0.12"/>
    <text x="550" y="356" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" fill="#F4EFE4">project config</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="70" y="142" width="238" height="86" rx="16" fill="url(#card)" stroke="#D88C2D" stroke-opacity="0.3"/>
    <text x="189" y="177" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="800" fill="#F4EFE4">rulepacks</text>
    <text x="189" y="203" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" fill="#18A999">.ai/rules/*.json</text>
    <rect x="70" y="266" width="238" height="86" rx="16" fill="url(#card)" stroke="#D88C2D" stroke-opacity="0.3"/>
    <text x="189" y="301" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="800" fill="#F4EFE4">requirements</text>
    <text x="189" y="327" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" fill="#18A999">REQ-### registry</text>
    <rect x="70" y="390" width="238" height="86" rx="16" fill="url(#card)" stroke="#D88C2D" stroke-opacity="0.3"/>
    <text x="189" y="425" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="800" fill="#F4EFE4">schemas</text>
    <text x="189" y="451" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" fill="#18A999">shape contracts</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="792" y="142" width="238" height="86" rx="16" fill="url(#card)" stroke="#18A999" stroke-opacity="0.34"/>
    <text x="911" y="177" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="800" fill="#F4EFE4">entrypoints</text>
    <text x="911" y="203" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" fill="#18A999">assistant files</text>
    <rect x="792" y="266" width="238" height="86" rx="16" fill="url(#card)" stroke="#18A999" stroke-opacity="0.34"/>
    <text x="911" y="301" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="800" fill="#F4EFE4">docs</text>
    <text x="911" y="327" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" fill="#18A999">README and design</text>
    <rect x="792" y="390" width="238" height="86" rx="16" fill="url(#card)" stroke="#18A999" stroke-opacity="0.34"/>
    <text x="911" y="425" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="800" fill="#F4EFE4">doctor</text>
    <text x="911" y="451" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" fill="#18A999">validation</text>
  </g>

  <g stroke="#D88C2D" stroke-width="4" stroke-linecap="round" stroke-opacity="0.74">
    <path d="M308 185H392"/>
    <path d="M308 309H392"/>
    <path d="M308 433H392"/>
  </g>
  <g stroke="#18A999" stroke-width="4" stroke-linecap="round" stroke-opacity="0.74">
    <path d="M708 185H792"/>
    <path d="M708 309H792"/>
    <path d="M708 433H792"/>
  </g>
  <g fill="#D88C2D" fill-opacity="0.84">
    <path d="M390 185L374 176V194L390 185Z"/>
    <path d="M390 309L374 300V318L390 309Z"/>
    <path d="M390 433L374 424V442L390 433Z"/>
  </g>
  <g fill="#18A999" fill-opacity="0.84">
    <path d="M790 185L774 176V194L790 185Z"/>
    <path d="M790 309L774 300V318L790 309Z"/>
    <path d="M790 433L774 424V442L790 433Z"/>
  </g>

  <text x="550" y="542" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" fill="#B9C5BE">Markdown explains intent. JSON carries enforceable structure. The CLI checks for drift.</text>
</svg>
