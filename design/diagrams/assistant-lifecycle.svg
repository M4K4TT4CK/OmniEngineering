<svg width="1100" height="520" viewBox="0 0 1100 520" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">OmniEngineering assistant lifecycle</title>
  <desc id="desc">The controlled assistant workflow from requirement ID through validation and completion reporting.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1100" y2="520" gradientUnits="userSpaceOnUse">
      <stop stop-color="#171614"/>
      <stop offset="0.58" stop-color="#252829"/>
      <stop offset="1" stop-color="#2D312A"/>
    </linearGradient>
    <linearGradient id="step" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FFFFFF" stop-opacity="0.17"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.08"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#020817" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="1100" height="520" rx="28" fill="url(#bg)"/>
  <text x="550" y="56" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="800" fill="#F4EFE4">Assistant Lifecycle</text>
  <text x="550" y="88" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" fill="#B9C5BE">Every change moves through requirement traceability, bounded access, implementation, documentation, and validation.</text>

  <g filter="url(#shadow)">
    <rect x="54" y="170" width="148" height="122" rx="18" fill="url(#step)" stroke="#D88C2D" stroke-opacity="0.32"/>
    <text x="128" y="212" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800" fill="#F4EFE4">REQ ID</text>
    <text x="128" y="242" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#18A999">confirm or</text>
    <text x="128" y="262" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#18A999">create</text>

    <rect x="222" y="170" width="148" height="122" rx="18" fill="url(#step)" stroke="#D88C2D" stroke-opacity="0.32"/>
    <text x="296" y="212" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800" fill="#F4EFE4">Scope</text>
    <text x="296" y="242" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#18A999">minimum</text>
    <text x="296" y="262" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#18A999">access</text>

    <rect x="390" y="170" width="148" height="122" rx="18" fill="url(#step)" stroke="#D88C2D" stroke-opacity="0.32"/>
    <text x="464" y="212" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800" fill="#F4EFE4">Inspect</text>
    <text x="464" y="242" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#18A999">only relevant</text>
    <text x="464" y="262" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#18A999">files</text>

    <rect x="558" y="170" width="148" height="122" rx="18" fill="url(#step)" stroke="#18A999" stroke-opacity="0.36"/>
    <text x="632" y="212" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800" fill="#F4EFE4">Change</text>
    <text x="632" y="242" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#18A999">small safe</text>
    <text x="632" y="262" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#18A999">edit</text>

    <rect x="726" y="170" width="148" height="122" rx="18" fill="url(#step)" stroke="#18A999" stroke-opacity="0.36"/>
    <text x="800" y="212" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800" fill="#F4EFE4">Docs</text>
    <text x="800" y="242" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#18A999">readme</text>
    <text x="800" y="262" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#18A999">changelog</text>

    <rect x="894" y="170" width="148" height="122" rx="18" fill="url(#step)" stroke="#18A999" stroke-opacity="0.36"/>
    <text x="968" y="212" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800" fill="#F4EFE4">Validate</text>
    <text x="968" y="242" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#18A999">doctor</text>
    <text x="968" y="262" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#18A999">report</text>
  </g>

  <path d="M128 338C250 426 474 432 632 338C787 247 910 317 968 338" stroke="#D88C2D" stroke-opacity="0.2" stroke-width="4" stroke-linecap="round"/>
  <text x="550" y="390" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="800" fill="#F4EFE4">Completion gate</text>
  <text x="550" y="422" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" fill="#B9C5BE">No task is complete until docs, traceability, validation, and final reporting are handled.</text>

  <g stroke="#D88C2D" stroke-width="4" stroke-linecap="round" opacity="0.72">
    <path d="M202 231H222"/>
    <path d="M370 231H390"/>
    <path d="M538 231H558"/>
  </g>
  <g stroke="#18A999" stroke-width="4" stroke-linecap="round" opacity="0.72">
    <path d="M706 231H726"/>
    <path d="M874 231H894"/>
  </g>
  <g fill="#D88C2D" opacity="0.82">
    <path d="M220 231L208 224V238L220 231Z"/>
    <path d="M388 231L376 224V238L388 231Z"/>
    <path d="M556 231L544 224V238L556 231Z"/>
  </g>
  <g fill="#18A999" opacity="0.82">
    <path d="M724 231L712 224V238L724 231Z"/>
    <path d="M892 231L880 224V238L892 231Z"/>
  </g>
</svg>
