<svg width="1100" height="560" viewBox="0 0 1100 560" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">OmniEngineering context routing diagram</title>
  <desc id="desc">Assistant entrypoints and universal adapters route Codex, Claude, Cursor, GitHub Copilot, Kiro, local models, and hosted models into the shared .ai source of truth.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1100" y2="560" gradientUnits="userSpaceOnUse">
      <stop stop-color="#171614"/>
      <stop offset="0.58" stop-color="#252829"/>
      <stop offset="1" stop-color="#2D312A"/>
    </linearGradient>
    <linearGradient id="core" x1="420" y1="110" x2="730" y2="430" gradientUnits="userSpaceOnUse">
      <stop stop-color="#D88C2D"/>
      <stop offset="1" stop-color="#18A999"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#020817" flood-opacity="0.32"/>
    </filter>
  </defs>

  <rect width="1100" height="560" rx="28" fill="url(#bg)"/>
  <text x="550" y="58" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="800" fill="#F4EFE4">Context Routing</text>
  <text x="550" y="92" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" fill="#B9C5BE">Native entrypoints and adapter prompts route every model to one source of truth.</text>

  <g filter="url(#shadow)">
    <rect x="420" y="142" width="260" height="276" rx="28" fill="url(#core)"/>
    <rect x="444" y="166" width="212" height="228" rx="20" fill="#171614" fill-opacity="0.94"/>
    <text x="550" y="218" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="44" font-weight="800" fill="#F4EFE4">.ai/</text>
    <text x="550" y="251" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#18A999">source of truth</text>
    <rect x="478" y="286" width="144" height="32" rx="8" fill="#F4EFE4" fill-opacity="0.12"/>
    <text x="550" y="308" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" fill="#F4EFE4">rules</text>
    <rect x="478" y="326" width="144" height="32" rx="8" fill="#F4EFE4" fill-opacity="0.12"/>
    <text x="550" y="348" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" fill="#F4EFE4">requirements</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="70" y="116" width="230" height="66" rx="16" fill="#FFFFFF" fill-opacity="0.1" stroke="#D88C2D" stroke-opacity="0.28"/>
    <text x="185" y="144" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="800" fill="#F4EFE4">AGENTS.md</text>
    <text x="185" y="165" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#18A999">Codex</text>
    <rect x="70" y="204" width="230" height="66" rx="16" fill="#FFFFFF" fill-opacity="0.1" stroke="#D88C2D" stroke-opacity="0.28"/>
    <text x="185" y="232" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="800" fill="#F4EFE4">CLAUDE.md</text>
    <text x="185" y="253" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#18A999">Claude Code</text>
    <rect x="70" y="292" width="230" height="66" rx="16" fill="#FFFFFF" fill-opacity="0.1" stroke="#D88C2D" stroke-opacity="0.28"/>
    <text x="185" y="320" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="800" fill="#F4EFE4">.cursorrules</text>
    <text x="185" y="341" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#18A999">Cursor</text>
    <rect x="70" y="380" width="230" height="66" rx="16" fill="#FFFFFF" fill-opacity="0.1" stroke="#D88C2D" stroke-opacity="0.28"/>
    <text x="185" y="408" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="800" fill="#F4EFE4">copilot</text>
    <text x="185" y="429" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#18A999">GitHub Copilot</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="800" y="116" width="230" height="66" rx="16" fill="#FFFFFF" fill-opacity="0.1" stroke="#18A999" stroke-opacity="0.32"/>
    <text x="915" y="144" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800" fill="#F4EFE4">LLM_CONTEXT</text>
    <text x="915" y="165" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#18A999">universal handoff</text>
    <rect x="800" y="204" width="230" height="66" rx="16" fill="#FFFFFF" fill-opacity="0.1" stroke="#18A999" stroke-opacity="0.32"/>
    <text x="915" y="232" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800" fill="#F4EFE4">Kiro steering</text>
    <text x="915" y="253" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#18A999">.kiro/steering</text>
    <rect x="800" y="292" width="230" height="66" rx="16" fill="#FFFFFF" fill-opacity="0.1" stroke="#18A999" stroke-opacity="0.32"/>
    <text x="915" y="320" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800" fill="#F4EFE4">Adapters</text>
    <text x="915" y="341" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#18A999">local and DeepSeek</text>
    <rect x="800" y="380" width="230" height="66" rx="16" fill="#FFFFFF" fill-opacity="0.1" stroke="#18A999" stroke-opacity="0.32"/>
    <text x="915" y="408" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800" fill="#F4EFE4">Same workflow</text>
    <text x="915" y="429" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#18A999">rules and validation</text>
  </g>

  <g stroke="#D88C2D" stroke-width="4" stroke-linecap="round" stroke-opacity="0.78">
    <path d="M300 149H420"/>
    <path d="M300 237H420"/>
    <path d="M300 325H420"/>
    <path d="M300 413H420"/>
  </g>
  <g stroke="#18A999" stroke-width="4" stroke-linecap="round" stroke-opacity="0.78">
    <path d="M680 149H800"/>
    <path d="M680 237H800"/>
    <path d="M680 325H800"/>
    <path d="M680 413H800"/>
  </g>
  <g fill="#D88C2D" fill-opacity="0.82">
    <path d="M418 149L402 139V159L418 149Z"/>
    <path d="M418 237L402 227V247L418 237Z"/>
    <path d="M418 325L402 315V335L418 325Z"/>
    <path d="M418 413L402 403V423L418 413Z"/>
  </g>
  <g fill="#18A999" fill-opacity="0.82">
    <path d="M798 149L782 139V159L798 149Z"/>
    <path d="M798 237L782 227V247L798 237Z"/>
    <path d="M798 325L782 315V335L798 325Z"/>
    <path d="M798 413L782 403V423L798 413Z"/>
  </g>
</svg>
