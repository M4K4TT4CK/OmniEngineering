# Rules coded in Python: metadata only (src/arbiter/rule_meta.py). The logic
# lives in the probes; this file says what each rule id traces to.
#
#   requirements  the ARB ids the rule was built or fixed under (ARB-064),
#                 proposed by tools/rule_requirements.py and reviewed by hand
#   tier          verified | advisory (default advisory: on probation until the
#                 precision ledger admits it; see docs/precision.md)
#   note          optional free text; it never stands in for `requirements`
#
# Every rule has at least one requirement. Rules shipped before the registry
# existed (2026-09-12/13) trace to the group requirements ARB-084..ARB-090.
#
# tests/test_rule_requirements.py holds this list to the rule ids the source
# can emit, in both directions.
