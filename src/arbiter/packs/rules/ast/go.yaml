      ((source_file (comment) @c . (function_declaration name: (identifier) @n body: (block (statement_list (return_statement) @hit) @sl))) (#match? @c "(?i)\\bTODO\\b|\\bFIXME\\b|\\bXXX\\b|\\bstub\\b|not (yet )?implemented|placeholder|implement (this|me|later)") (#match? @sl "^return\\b[^\\n]*$") (#match? @hit "^return\\s+(nil|true|false|0|\"\")(,\\s*nil)?$") (#match? @n "(?i)verif|auth|check|valid|permi|allow|authori|sign|token|login|passw|access|secur|encrypt|decrypt|sanitiz|escape|csrf|guard"))
      ((method_declaration name: (field_identifier) @n body: (block (comment) @c (statement_list (return_statement) @hit) @sl)) (#match? @c "(?i)\\bTODO\\b|\\bFIXME\\b|\\bXXX\\b|\\bstub\\b|not (yet )?implemented|placeholder|implement (this|me|later)") (#match? @sl "^return\\b[^\\n]*$") (#match? @hit "^return\\s+(nil|true|false|0|\"\")(,\\s*nil)?$") (#match? @n "(?i)verif|auth|check|valid|permi|allow|authori|sign|token|login|passw|access|secur|encrypt|decrypt|sanitiz|escape|csrf|guard"))
      ((source_file (comment) @c . (method_declaration name: (field_identifier) @n body: (block (statement_list (return_statement) @hit) @sl))) (#match? @c "(?i)\\bTODO\\b|\\bFIXME\\b|\\bXXX\\b|\\bstub\\b|not (yet )?implemented|placeholder|implement (this|me|later)") (#match? @sl "^return\\b[^\\n]*$") (#match? @hit "^return\\s+(nil|true|false|0|\"\")(,\\s*nil)?$") (#match? @n "(?i)verif|auth|check|valid|permi|allow|authori|sign|token|login|passw|access|secur|encrypt|decrypt|sanitiz|escape|csrf|guard"))
    description: >-
      A function named like an authentication, authorisation or validation
      step has no implementation: it panics, or returns a constant under a
      TODO. If anything calls it, the check either crashes the request or
      -- worse -- passes everything. Model-drafted code produces these
      when the hard part is deferred and the caller is wired up anyway.
    remediation: "Implement the check before anything depends on it, or make the stub fail closed (return an error / false) and block the merge until it is real."

