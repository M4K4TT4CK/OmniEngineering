  # ---------------------------------------------------------------------
  # Randomness
  # ---------------------------------------------------------------------
  - id: insecure-random-token
    title: "`{text}` builds a secret from math/rand, which is predictable"
    severity: high
    confidence: high
    dimension: security
    cwe: [CWE-338]
    controls: [NIST-800-218:PW.5, NIST-800-53r5:SC-13]
    tags: [randomness, crypto]
    # The file imports math/rand (and not crypto/rand), and the value or
    # function is named like a secret.
    query: |
      ((short_var_declaration
        left: (expression_list (identifier) @n)
        right: (expression_list (_) @v)) @hit
        (#match? @n "(?i)token|secret|passw|nonce|session|salt|api_?key|otp|csrf|signing_?key|secret_?key|private_?key")
        (#not-match? @n "(?i)tokeni[sz]")
        (#match? @v "\\b(rand|rng|rnd|mrand|mathrand)\\.(Intn?|Int31n?|Int63n?|Uint32|Uint64|Read|Perm|Shuffle|Float32|Float64|IntN|Int32N|Int64N|UintN|N)\\("))
      ((assignment_statement
        left: (expression_list [(identifier) (selector_expression)] @n)
        right: (expression_list (_) @v)) @hit
        (#match? @n "(?i)token|secret|passw|nonce|session|salt|api_?key|otp|csrf|signing_?key|secret_?key|private_?key")
        (#not-match? @n "(?i)tokeni[sz]")
        (#match? @v "\\b(rand|rng|rnd|mrand|mathrand)\\.(Intn?|Int31n?|Int63n?|Uint32|Uint64|Read|Perm|Shuffle|Float32|Float64|IntN|Int32N|Int64N|UintN|N)\\("))
      ((var_declaration (var_spec name: (identifier) @n value: (expression_list (_) @v))) @hit
        (#match? @n "(?i)token|secret|passw|nonce|session|salt|api_?key|otp|csrf|signing_?key|secret_?key|private_?key")
        (#not-match? @n "(?i)tokeni[sz]")
        (#match? @v "\\b(rand|rng|rnd|mrand|mathrand)\\.(Intn?|Int31n?|Int63n?|Uint32|Uint64|Read|Perm|Shuffle|Float32|Float64|IntN|Int32N|Int64N|UintN|N)\\("))
      ((function_declaration name: (identifier) @n body: (block) @v) @hit
        (#match? @n "(?i)token|secret|passw|nonce|session|salt|api_?key|otp|csrf|signing_?key|secret_?key|private_?key")
        (#not-match? @n "(?i)tokeni[sz]|pars|valid|verif|check|decode|read|load|lookup|get|find|has|is[A-Z]|revoke|delete|expire|refresh")
        (#match? @v "\\b(rand|rng|rnd|mrand|mathrand)\\.(Intn?|Int31n?|Int63n?|Uint32|Uint64|Read|Perm|Shuffle|Float32|Float64|IntN|Int32N|Int64N|UintN|N)\\("))
      ((method_declaration name: (field_identifier) @n body: (block) @v) @hit
        (#match? @n "(?i)token|secret|passw|nonce|session|salt|api_?key|otp|csrf|signing_?key|secret_?key|private_?key")
        (#not-match? @n "(?i)tokeni[sz]|pars|valid|verif|check|decode|read|load|lookup|get|find|has|is[A-Z]|revoke|delete|expire|refresh")
        (#match? @v "\\b(rand|rng|rnd|mrand|mathrand)\\.(Intn?|Int31n?|Int63n?|Uint32|Uint64|Read|Perm|Shuffle|Float32|Float64|IntN|Int32N|Int64N|UintN|N)\\("))
    requires_file: |
      ((import_spec path: (interpreted_string_literal) @p) (#match? @p "^\"math/rand(/v2)?\"$"))
    unless_in_file: |
      ((import_spec path: (interpreted_string_literal) @p) (#eq? @p "\"crypto/rand\""))
    description: >-
      math/rand is a deterministic generator: anyone who sees a few outputs
      (or guesses the seed, which is often the clock) can predict the rest.
      A session token, reset link or nonce built from it can be forged.
    remediation: "Use crypto/rand (rand.Read, or rand.Int with a big.Int bound) for anything an attacker must not guess."

  # ---------------------------------------------------------------------
  # Tests that cannot fail
  # ---------------------------------------------------------------------
  - id: test-skipped-unconditionally
    title: "`{text}` is the first statement of the test: it never runs"
    severity: low
    confidence: high
    dimension: assurance
    cwe: [CWE-1164]
    controls: [NIST-800-218:PW.8, NIST-800-53r5:SA-11]
    tags: [assurance, test]
    roles: [test]
    # The bare `t.Skip()` is already reported by assurance.permanently-
    # skipped-test; this is the reasoned skip (`t.Skip("flaky")`,
    # `t.Skipf(...)`) placed before anything else in a Test function.
    query: |
      ((function_declaration
        name: (identifier) @n
        parameters: (parameter_list (parameter_declaration type: (pointer_type (qualified_type) @t)))
        body: (block (statement_list . (expression_statement (call_expression
          function: (selector_expression) @f
          arguments: (argument_list (_))) @hit))))
        (#match? @n "^Test")
        (#eq? @t "testing.T")
        (#match? @f "^t\\.Skipf?$"))
    description: >-
      The skip has a reason but no condition, so the test is skipped on
      every machine, every time. It counts as a test and protects nothing;
      a skip behind `testing.Short()` or a platform check is a different
      thing and is not reported.
    remediation: "Fix the test or delete it; if it must be skipped somewhere, put the skip behind a condition."
