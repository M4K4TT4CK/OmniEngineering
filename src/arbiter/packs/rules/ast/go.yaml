      ((function_declaration name: (identifier) @n body: (block (statement_list (expression_statement (call_expression function: (identifier) @p arguments: (argument_list (interpreted_string_literal) @s))) @hit) @sl)) (#eq? @p "panic") (#match? @sl "^panic\\([^\\n]*$") (#match? @s "(?i)not (yet )?implemented|unimplemented|todo|implement me|stub") (#match? @n "(?i)verif|auth|check|valid|permi|allow|authori|sign|token|login|passw|access|secur|encrypt|decrypt|sanitiz|escape|csrf|guard"))
