      ((method_declaration name: (field_identifier) @n body: (block (comment) @c (statement_list (return_statement) @hit) @sl)) (#match? @c "(?i)\\bTODO\\b|\\bFIXME\\b|\\bXXX\\b|\\bstub\\b|not (yet )?implemented|placeholder|implement (this|me|later)") (#match? @sl "^return\\b[^\\n]*$") (#match? @hit "^return\\s+(nil|true|false|0|\"\")(,\\s*nil)?$") (#not-match? @n "(?i)verif|auth|check|valid|permi|allow|authori|sign|token|login|passw|access|secur|encrypt|decrypt|sanitiz|escape|csrf|guard"))
      ((source_file (comment) @c . (method_declaration name: (field_identifier) @n body: (block (statement_list (return_statement) @hit) @sl))) (#match? @c "(?i)\\bTODO\\b|\\bFIXME\\b|\\bXXX\\b|\\bstub\\b|not (yet )?implemented|placeholder|implement (this|me|later)") (#match? @sl "^return\\b[^\\n]*$") (#match? @hit "^return\\s+(nil|true|false|0|\"\")(,\\s*nil)?$") (#not-match? @n "(?i)verif|auth|check|valid|permi|allow|authori|sign|token|login|passw|access|secur|encrypt|decrypt|sanitiz|escape|csrf|guard"))
