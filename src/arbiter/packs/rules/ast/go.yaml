      2147483648 becomes -2147483648. A range check written after the
      conversion sees the wrapped value, so a limit, a page size or an
      allocation size is whatever the caller chose.
    remediation: "Parse at the width you store (strconv.ParseInt(s, 10, 32)), or compare against math.MaxInt32/MinInt32 before converting."


