  - id: argument-injection
    requirements: [ARB-062]
    title: "`{text}` passes a request value to a command with no `--` before it"
    severity: high
    confidence: medium
    dimension: security
    cwe: [CWE-77, CWE-88]
    controls: [NIST-800-218:PW.5, NIST-800-53r5:SI-10]
    tags: [injection, argument-injection]
    # No shell is involved (that is command-injection), but a value that
    # starts with `-` is an option: `--upload-pack=...` to git,
    # `-o ProxyCommand=...` to ssh, `-o /etc/x` to curl.
    query: |
