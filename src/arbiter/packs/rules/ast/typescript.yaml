       (#match? @f "(?s)((const|let|var)\\s+(?P<v>[A-Za-z_$][\\w$]*)\\s*(:[^=;]+)?=|(const|let|var)\\s*\\{[^}]*?(?<![\\w$.])(?P<w>[A-Za-z_$][\\w$]*)\\s*\\}\\s*(:[^=;]+)?=)\\s*(await\\s+)?(String\\(|decodeURIComponent\\()?\\s*(req|request|ctx)(\\.request)?\\.(query|body|params)\\b.*\\b(execFile|execFileSync|spawn|spawnSync|execa|execaSync)\\(\\s*[\"'`][^\"'`]*[\"'`]\\s*,\\s*\\[(?:[^\\]]*?,)?\\s*(String\\(|`\\$\\{\\s*)?((?P=v)|(?P=w))\\b|\\b(execFile|execFileSync|spawn|spawnSync|execa|execaSync)\\(\\s*[\"'`][^\"'`]*[\"'`]\\s*,\\s*\\[(?:[^\\]]*?,)?\\s*(String\\(|`\\$\\{\\s*)?(req|request|ctx)(\\.request)?\\.(query|body|params)\\b"))
      ((function_declaration) @f
       (#match? @f "(?s)((const|let|var)\\s+(?P<v>[A-Za-z_$][\\w$]*)\\s*(:[^=;]+)?=|(const|let|var)\\s*\\{[^}]*?(?<![\\w$.])(?P<w>[A-Za-z_$][\\w$]*)\\s*\\}\\s*(:[^=;]+)?=)\\s*(await\\s+)?(String\\(|decodeURIComponent\\()?\\s*(req|request|ctx)(\\.request)?\\.(query|body|params)\\b.*\\b(execFile|execFileSync|spawn|spawnSync|execa|execaSync)\\(\\s*[\"'`][^\"'`]*[\"'`]\\s*,\\s*\\[(?:[^\\]]*?,)?\\s*(String\\(|`\\$\\{\\s*)?((?P=v)|(?P=w))\\b|\\b(execFile|execFileSync|spawn|spawnSync|execa|execaSync)\\(\\s*[\"'`][^\"'`]*[\"'`]\\s*,\\s*\\[(?:[^\\]]*?,)?\\s*(String\\(|`\\$\\{\\s*)?(req|request|ctx)(\\.request)?\\.(query|body|params)\\b"))
      ((function_expression) @f
       (#match? @f "(?s)((const|let|var)\\s+(?P<v>[A-Za-z_$][\\w$]*)\\s*(:[^=;]+)?=|(const|let|var)\\s*\\{[^}]*?(?<![\\w$.])(?P<w>[A-Za-z_$][\\w$]*)\\s*\\}\\s*(:[^=;]+)?=)\\s*(await\\s+)?(String\\(|decodeURIComponent\\()?\\s*(req|request|ctx)(\\.request)?\\.(query|body|params)\\b.*\\b(execFile|execFileSync|spawn|spawnSync|execa|execaSync)\\(\\s*[\"'`][^\"'`]*[\"'`]\\s*,\\s*\\[(?:[^\\]]*?,)?\\s*(String\\(|`\\$\\{\\s*)?((?P=v)|(?P=w))\\b|\\b(execFile|execFileSync|spawn|spawnSync|execa|execaSync)\\(\\s*[\"'`][^\"'`]*[\"'`]\\s*,\\s*\\[(?:[^\\]]*?,)?\\s*(String\\(|`\\$\\{\\s*)?(req|request|ctx)(\\.request)?\\.(query|body|params)\\b"))
      ((method_definition) @f
       (#match? @f "(?s)((const|let|var)\\s+(?P<v>[A-Za-z_$][\\w$]*)\\s*(:[^=;]+)?=|(const|let|var)\\s*\\{[^}]*?(?<![\\w$.])(?P<w>[A-Za-z_$][\\w$]*)\\s*\\}\\s*(:[^=;]+)?=)\\s*(await\\s+)?(String\\(|decodeURIComponent\\()?\\s*(req|request|ctx)(\\.request)?\\.(query|body|params)\\b.*\\b(execFile|execFileSync|spawn|spawnSync|execa|execaSync)\\(\\s*[\"'`][^\"'`]*[\"'`]\\s*,\\s*\\[(?:[^\\]]*?,)?\\s*(String\\(|`\\$\\{\\s*)?((?P=v)|(?P=w))\\b|\\b(execFile|execFileSync|spawn|spawnSync|execa|execaSync)\\(\\s*[\"'`][^\"'`]*[\"'`]\\s*,\\s*\\[(?:[^\\]]*?,)?\\s*(String\\(|`\\$\\{\\s*)?(req|request|ctx)(\\.request)?\\.(query|body|params)\\b"))
