# Ruby rules. Owner: the Ruby agent. Schema: src/arbiter/lang_rules.py.
#
# Query notes (tree-sitter-ruby, py-tree-sitter 0.26):
# * Predicates belong to the top-level pattern they sit in, so two shapes that
#   need different `#match?` tests are written as two top-level patterns, never
#   as branches of one `[...]` alternation sharing a capture name.
# * A wildcard with children, `(_ (break))`, matches every node here, so every
#   nesting level is spelled out with its real node type.
# * Ruby's tree-sitter node for `x.y = z` is an `assignment` whose `left` is a
#   `call`; `#{}` is `(string (interpolation))`; backticks are `subshell`.
pack: ruby
languages: [ruby]
rules:
  # --- Concurrency -----------------------------------------------------------
  - id: check-then-act-unlocked
    title: "Check-then-act on a shared collection with no lock: `{text}`"
    severity: medium
    confidence: medium
    dimension: quality
    cwe: [CWE-362, CWE-366]
    controls: [NIST-800-218:PW.5]
    tags: [concurrency, race]
    requires_file: |
      (call receiver: (constant) @c method: (identifier) @m
        (#eq? @c "Thread") (#match? @m "^(new|start|fork)$")) @threads
      (scope_resolution scope: (constant) @c (#eq? @c "Concurrent")) @threads
      (call receiver: (constant) @c method: (identifier) @m
        (#match? @c "^(Queue|SizedQueue|Mutex|Monitor)$") (#eq? @m "new")) @threads
      (scope_resolution scope: (constant) @c name: (constant) @n
        (#eq? @c "Thread") (#match? @n "^(Queue|SizedQueue|Mutex)$")) @threads
    query: |
      ; `@jobs[id] = "running" if @jobs[id] == "queued"`
      ((if_modifier
         body: (assignment left: (element_reference object: (_) @a))
         condition: (binary left: (element_reference object: (_) @b)))
        @hit (#eq? @a @b) (#match? @a "^(@|[A-Z])"))
      ; `@jobs[id] = job unless @jobs[id]` / `... if @jobs[id].nil?`
      ((unless_modifier
         body: (assignment left: (element_reference object: (_) @a))
         condition: (element_reference object: (_) @b))
        @hit (#eq? @a @b) (#match? @a "^(@|[A-Z])"))
      ((if_modifier
         body: (assignment left: (element_reference object: (_) @a))
         condition: (call receiver: (element_reference object: (_) @b)))
        @hit (#eq? @a @b) (#match? @a "^(@|[A-Z])"))
      ; `@tasks.shift unless @tasks.empty?` / `@seen << k unless @seen.include?(k)`.
      ; The check must ask the collection about its contents (`include?`,
      ; `key?`, `empty?`, `size`, ...): `@io.flush unless @io.sync`,
      ; `x.freeze if x.is_a?(String)` and `respond_to?` probes are not a race
      ; on shared state, and the act must change it (`shift`, `delete`, `<<`):
      ; `hooks.each { ... } unless hooks.empty?` only reads (gold benchmark,
      ; ARB-065).
      ((unless_modifier
         body: (call receiver: (_) @a method: (identifier) @w)
         condition: (call receiver: (_) @b method: (identifier) @q))
        @hit (#eq? @a @b) (#match? @a "^(@|[A-Z])")
        (#match? @q "^(include\\?|key\\?|has_key\\?|member\\?|empty\\?|any\\?|none\\?|nil\\?|value\\?|has_value\\?|size|length|count|fetch|find|detect)$")
        (#match? @w "^(push|append|prepend|unshift|shift|pop|delete|delete_at|delete_if|reject!|select!|keep_if|store|insert|add|add\\?|clear|concat|merge!|update|replace|compact!|uniq!|transform_values!|compare_and_set)$"))
      ((unless_modifier
         body: (binary left: (_) @a)
         condition: (call receiver: (_) @b method: (identifier) @q))
        @hit (#eq? @a @b) (#match? @a "^(@|[A-Z])")
        (#match? @q "^(include\\?|key\\?|has_key\\?|member\\?|empty\\?|any\\?|none\\?|nil\\?|value\\?|has_value\\?|size|length|count|fetch|find|detect)$"))
      ((if_modifier
         body: (call receiver: (_) @a method: (identifier) @w)
         condition: (call receiver: (_) @b method: (identifier) @q))
        @hit (#eq? @a @b) (#match? @a "^(@|[A-Z])")
        (#match? @q "^(include\\?|key\\?|has_key\\?|member\\?|empty\\?|any\\?|none\\?|nil\\?|value\\?|has_value\\?|size|length|count|fetch|find|detect)$")
        (#match? @w "^(push|append|prepend|unshift|shift|pop|delete|delete_at|delete_if|reject!|select!|keep_if|store|insert|add|add\\?|clear|concat|merge!|update|replace|compact!|uniq!|transform_values!|compare_and_set)$"))
      ; the same shapes as block `if`/`unless`
      ((if
         condition: (binary left: (element_reference object: (_) @b))
         consequence: (then . (assignment left: (element_reference object: (_) @a))))
        @hit (#eq? @a @b) (#match? @a "^(@|[A-Z])"))
      ((if
         condition: (call receiver: (element_reference object: (_) @b))
         consequence: (then . (assignment left: (element_reference object: (_) @a))))
        @hit (#eq? @a @b) (#match? @a "^(@|[A-Z])"))
      ((unless
         condition: (element_reference object: (_) @b)
         consequence: (then . (assignment left: (element_reference object: (_) @a))))
        @hit (#eq? @a @b) (#match? @a "^(@|[A-Z])"))
      ((if
         condition: (call receiver: (_) @b method: (identifier) @q)
         consequence: (then . (call receiver: (_) @a method: (identifier) @w)))
        @hit (#eq? @a @b) (#match? @a "^(@|[A-Z])")
        (#match? @q "^(include\\?|key\\?|has_key\\?|member\\?|empty\\?|any\\?|none\\?|nil\\?|value\\?|has_value\\?|size|length|count|fetch|find|detect)$")
        (#match? @w "^(push|append|prepend|unshift|shift|pop|delete|delete_at|delete_if|reject!|select!|keep_if|store|insert|add|add\\?|clear|concat|merge!|update|replace|compact!|uniq!|transform_values!|compare_and_set)$"))
      ((unless
         condition: (call receiver: (_) @b method: (identifier) @q)
         consequence: (then . (call receiver: (_) @a method: (identifier) @w)))
        @hit (#eq? @a @b) (#match? @a "^(@|[A-Z])")
        (#match? @q "^(include\\?|key\\?|has_key\\?|member\\?|empty\\?|any\\?|none\\?|nil\\?|value\\?|has_value\\?|size|length|count|fetch|find|detect)$")
        (#match? @w "^(push|append|prepend|unshift|shift|pop|delete|delete_at|delete_if|reject!|select!|keep_if|store|insert|add|add\\?|clear|concat|merge!|update|replace|compact!|uniq!|transform_values!|compare_and_set)$"))
      ((unless
         condition: (call receiver: (_) @b method: (identifier) @q)
         consequence: (then . (binary left: (_) @a)))
        @hit (#eq? @a @b) (#match? @a "^(@|[A-Z])")
        (#match? @q "^(include\\?|key\\?|has_key\\?|member\\?|empty\\?|any\\?|none\\?|nil\\?|value\\?|has_value\\?|size|length|count|fetch|find|detect)$"))
      ; `CACHE[k] ||= compute(k)` on a module-level constant. The same on an
      ; instance variable (`@routes[verb] ||= []`) is nearly always class-body
      ; setup or request-scoped memoisation, so it is not reported.
      ; `CACHE[k] ||= compute(k)` on a module-level constant. ENV and the
      ; per-thread / per-fiber stores (`IsolatedExecutionState[:k] ||= []`,
      ; `Ractor[:k]`, `Fiber[:k]`) are not shared between threads this way.
      ((operator_assignment
        left: (element_reference object: (constant) @c)
        "||=") @hit
        (#not-match? @c "^(ENV|IsolatedExecutionState|Ractor|Fiber)$"))
    unless_inside: |
      (call method: (identifier) @m
        (#match? @m "^(synchronize|mon_synchronize|with_lock|with_write_lock|with_read_lock)$")
        block: [(do_block) (block)]) @lock
      ; Gold benchmark (ARB-065), Rails' quoting caches: the constant is a
      ; `Concurrent::Map` (or `Concurrent::Hash`) declared beside the methods
      ; that use it, so `QUOTED_COLUMN_NAMES[name] ||= ...` is thread-safe.
      ; A query cannot follow a name across the file, so the declaration must
      ; sit in the same class or module body as the method, or one nested
      ; module above it (`module ClassMethods`).
      (body_statement
        (assignment left: (constant) @k right: (call receiver: (scope_resolution scope: (constant) @cc name: (constant) @ct) method: (identifier) @new))
        [(method body: (body_statement (operator_assignment left: (element_reference object: (constant) @o) "||=") @safe))
         (singleton_method body: (body_statement (operator_assignment left: (element_reference object: (constant) @o) "||=") @safe))]
        (#eq? @cc "Concurrent") (#match? @ct "^(Map|Hash|Array)$") (#eq? @new "new") (#eq? @k @o))
      (body_statement
        (assignment left: (constant) @k right: (call receiver: (scope_resolution scope: (constant) @cc name: (constant) @ct) method: (identifier) @new))
        [(module body: (body_statement [(method body: (body_statement (operator_assignment left: (element_reference object: (constant) @o) "||=") @safe)) (singleton_method body: (body_statement (operator_assignment left: (element_reference object: (constant) @o) "||=") @safe))]))
         (class body: (body_statement [(method body: (body_statement (operator_assignment left: (element_reference object: (constant) @o) "||=") @safe)) (singleton_method body: (body_statement (operator_assignment left: (element_reference object: (constant) @o) "||=") @safe))]))]
        (#eq? @cc "Concurrent") (#match? @ct "^(Map|Hash|Array)$") (#eq? @new "new") (#eq? @k @o))
    description: >-
      The collection is read and then changed as two steps, in a file that
      runs threads, with no Mutex#synchronize around them. Two threads can
      both see "queued" and both start the job, or both see a missing key and
      both compute it; the single-threaded test passes.
    remediation: >-
      Wrap the check and the change in one `@mutex.synchronize do ... end`,
      or use a structure that does it atomically (Thread::Queue#pop,
      Concurrent::Map#compute_if_absent, Hash#delete with a check on the
      return).

  - id: unsynchronised-counter
    title: "`{text}` on a shared counter with no lock in a threaded file"
    severity: medium
    confidence: medium
    dimension: quality
    cwe: [CWE-362, CWE-366]
    controls: [NIST-800-218:PW.5]
    tags: [concurrency, race]
    requires_file: |
      (call receiver: (constant) @c method: (identifier) @m
        (#eq? @c "Thread") (#match? @m "^(new|start|fork)$")) @threads
      (scope_resolution scope: (constant) @c name: (constant) @n
        (#eq? @c "Concurrent") (#match? @n "^(FixedThreadPool|CachedThreadPool|ThreadPoolExecutor|Future|Promise|TimerTask)$")) @threads
    query: |
      (operator_assignment
        left: [(instance_variable) (class_variable)]
        ["+=" "-="]) @hit
    unless_inside: |
      (call method: (identifier) @m
        (#match? @m "^(synchronize|mon_synchronize|with_lock|with_write_lock|with_read_lock)$")
        block: [(do_block) (block)]) @lock
    description: >-
      `+=` on an instance or class variable is a read, an add and a write;
      with the GVL released between them (any I/O, any allocation) two
      threads lose updates. The file starts threads, and nothing synchronizes
      the counter.
    remediation: >-
      Hold a Mutex around the update, or use Concurrent::AtomicFixnum#increment.

  - id: endless-worker-loop
    title: "Thread runs `{text}` with no stop signal"
    severity: medium
    confidence: medium
    dimension: quality
    cwe: [CWE-835]
    controls: [NIST-800-218:PW.5]
    tags: [concurrency, shutdown]
    query: |
      ; Thread.new do loop do ... end end   (either block style, either loop form)
      ((call receiver: (constant) @t method: (identifier) @n (#eq? @t "Thread") (#match? @n "^(new|start|fork)$")
         block: (do_block body: (body_statement .
           (call method: (identifier) @l (#eq? @l "loop") block: (do_block) @body) @hit)))
        (#not-match? @body "\\b(break|return|exit|throw|stop|shut|running|done|quit|terminat|kill|abort)"))
      ((call receiver: (constant) @t method: (identifier) @n (#eq? @t "Thread") (#match? @n "^(new|start|fork)$")
         block: (do_block body: (body_statement .
           (call method: (identifier) @l (#eq? @l "loop") block: (block) @body) @hit)))
        (#not-match? @body "\\b(break|return|exit|throw|stop|shut|running|done|quit|terminat|kill|abort)"))
      ((call receiver: (constant) @t method: (identifier) @n (#eq? @t "Thread") (#match? @n "^(new|start|fork)$")
         block: (block body: (block_body .
           (call method: (identifier) @l (#eq? @l "loop") block: (block) @body) @hit)))
        (#not-match? @body "\\b(break|return|exit|throw|stop|shut|running|done|quit|terminat|kill|abort)"))
      ((call receiver: (constant) @t method: (identifier) @n (#eq? @t "Thread") (#match? @n "^(new|start|fork)$")
         block: (block body: (block_body .
           (call method: (identifier) @l (#eq? @l "loop") block: (do_block) @body) @hit)))
        (#not-match? @body "\\b(break|return|exit|throw|stop|shut|running|done|quit|terminat|kill|abort)"))
      ((call receiver: (constant) @t method: (identifier) @n (#eq? @t "Thread") (#match? @n "^(new|start|fork)$")
         block: (do_block body: (body_statement .
           (while condition: (true) body: (do) @body) @hit)))
        (#not-match? @body "\\b(break|return|exit|throw|stop|shut|running|done|quit|terminat|kill|abort)"))
      ((call receiver: (constant) @t method: (identifier) @n (#eq? @t "Thread") (#match? @n "^(new|start|fork)$")
         block: (block body: (block_body .
           (while condition: (true) body: (do) @body) @hit)))
        (#not-match? @body "\\b(break|return|exit|throw|stop|shut|running|done|quit|terminat|kill|abort)"))
    unless_in_file: |
      (call receiver: (_) @r method: (identifier) @m
        (#match? @r "(?i)thread|worker|@t$|\\bt$") (#match? @m "^(kill|exit|terminate|wakeup|raise)$")) @external
    description: >-
      The thread body is `loop do ... end` with nothing inside that can leave
      it, and nothing in the file kills the thread. It cannot be shut down
      cleanly: at exit the process either hangs on `join` or abandons the
      work in flight, and in tests the thread leaks across examples.
    remediation: >-
      Loop on a flag (`until @stopping`) or on `Queue#pop` returning a
      sentinel (`break if job == :stop`), and give the owner a `stop` method
      that sets the flag or pushes the sentinel and joins.

  # --- Outbound calls --------------------------------------------------------
  - id: http-no-timeout
    title: "`{text}` makes an outbound call with no timeout set"
    severity: medium
    confidence: medium
    dimension: quality
    cwe: [CWE-400]
    controls: [NIST-800-218:PW.5]
    tags: [timeout, reliability]
    query: |
      ; Net::HTTP convenience class methods: nothing can set a timeout on them
      (call receiver: (scope_resolution) @r method: (identifier) @m
        (#eq? @r "Net::HTTP") (#match? @m "^(get|get_response|get_print|post|post_form|put)$")) @hit
      ; Net::HTTP.start/new: the timeout is a keyword or an attribute set in the same scope
      (call receiver: (scope_resolution) @r method: (identifier) @m
        (#eq? @r "Net::HTTP") (#match? @m "^(start|new)$")) @hit
      ; HTTParty and Faraday: no default timeout at all
      (call receiver: (constant) @r method: (identifier) @m
        (#eq? @r "HTTParty") (#match? @m "^(get|post|put|patch|delete|head|options)$")) @hit
      (call receiver: (constant) @r method: (identifier) @m
        (#eq? @r "Faraday") (#eq? @m "new")) @hit
    unless_in_scope: |
      (pair key: (hash_key_symbol) @k (#match? @k "timeout$")) @t
      (pair key: (simple_symbol) @k (#match? @k "timeout$")) @t
      (call method: (identifier) @m
        (#match? @m "^(open_timeout|read_timeout|write_timeout|ssl_timeout|timeout|default_timeout|continue_timeout)$")) @t
      (call receiver: (constant) @c method: (identifier) @m (#eq? @c "Timeout") (#eq? @m "timeout")) @t
    unless_in_file: |
      (call method: (identifier) @m (#match? @m "^(default_timeout|default_options|request_options)$")
        !receiver) @cls
    description: >-
      Net::HTTP waits 60 seconds by default and HTTParty and Faraday wait
      forever; a slow upstream holds this thread (and the Puma worker it is
      on) for that long. Nothing in the enclosing method sets `open_timeout`,
      `read_timeout` or a `timeout:` option.
    remediation: >-
      Pass `open_timeout:`/`read_timeout:` to Net::HTTP.start, `timeout:` to
      HTTParty, or `request: { timeout:, open_timeout: }` to Faraday, sized
      to the caller's deadline.

  # --- Retries ---------------------------------------------------------------
  - id: retry-unbounded
    title: "`retry` with no attempt counter: retries forever"
    severity: medium
    confidence: high
    dimension: quality
    cwe: [CWE-834, CWE-400]
    controls: [NIST-800-218:PW.5]
    tags: [retry, reliability]
    query: |
      (retry) @hit
    unless_in_scope: |
      ; `retry if attempts < 3`, `raise if (tries += 1) > 3`, `retries -= 1 ... if retries.positive?`
      (binary (identifier) @v (#match? @v "(?i)attempt|retr|tries|count|budget|limit|max")) @cap
      (binary (instance_variable) @v (#match? @v "(?i)attempt|retr|tries|count|budget|limit|max")) @cap
      (binary (parenthesized_statements (operator_assignment left: (_) @v
        (#match? @v "(?i)attempt|retr|tries|count")))) @cap
      (call receiver: (_) @v method: (identifier) @m
        (#match? @v "(?i)attempt|retr|tries|count") (#match? @m "^(positive\\?|zero\\?|nonzero\\?|<|>|>=|<=)$")) @cap
      (if_modifier body: (retry) condition: (binary)) @cap
      (unless_modifier body: (retry) condition: (binary)) @cap
    unless_inside: |
      ; a one-shot retry: a literal flag set right before `retry` and tested on
      ; the way in (sidekiq capsule.rb `retryable = false; retry`,
      ; current_attributes.rb `retried = true; retry`) runs at most twice.
      ((then (assignment left: (identifier) right: [(true) (false)]) . (retry)) @once)
      ; repair-then-retry behind a guard that re-raises every other error
      ; (sidekiq scheduled.rb `raise unless e.message.start_with?("NOSCRIPT")`
      ; then `@sha = nil; retry`; web/helpers.rb re-encodes the text). The
      ; failure is local state the handler fixed, not a dependency outage.
      ((rescue body: (then . [(unless_modifier) (if_modifier)] @g (_) . (retry) .)) @repair
        (#match? @g "^raise\\b"))
    description: >-
      `retry` re-runs the begin block on every rescue, and nothing in this
      method counts attempts or compares them with a limit. A dependency that
      stays down keeps this loop spinning until the process is killed.
    remediation: >-
      Count attempts and stop: `retry if (attempts += 1) < 3`, then raise or
      return a failure the caller can see.

  - id: retry-without-backoff
    title: "`retry` with no sleep: hammers the failing dependency"
    severity: medium
    confidence: medium
    dimension: quality
    cwe: [CWE-400]
    controls: [NIST-800-218:PW.5]
    tags: [retry, reliability]
    query: |
      (retry) @hit
    unless_in_scope: |
      (call method: (identifier) @m (#match? @m "^(sleep|backoff|wait|delay|pause)$")) @sleep
      (call method: (identifier) @m (#match? @m "(backoff|_delay|_wait|jitter)")) @sleep
      ((identifier) @m (#match? @m "^(sleep|backoff)$"))
    unless_inside: |
      ; a one-shot retry: a literal flag set right before `retry` and tested on
      ; the way in (sidekiq capsule.rb `retryable = false; retry`,
      ; current_attributes.rb `retried = true; retry`) runs at most twice.
      ((then (assignment left: (identifier) right: [(true) (false)]) . (retry)) @once)
      ; repair-then-retry behind a guard that re-raises every other error
      ; (sidekiq scheduled.rb `raise unless e.message.start_with?("NOSCRIPT")`
      ; then `@sha = nil; retry`; web/helpers.rb re-encodes the text). The
      ; failure is local state the handler fixed, not a dependency outage.
      ((rescue body: (then . [(unless_modifier) (if_modifier)] @g (_) . (retry) .)) @repair
        (#match? @g "^raise\\b"))
    description: >-
      The retry fires again immediately. Against an overloaded or restarting
      dependency that is the worst possible timing: every client retries at
      once, and the dependency never gets room to recover.
    remediation: >-
      Sleep before `retry`, with exponential backoff and jitter:
      `sleep((2**attempts) * 0.1 * (0.5 + rand))`.

  # --- Error handling --------------------------------------------------------
  - id: swallowed-error
    title: "`{text}` swallows the error: empty rescue"
    severity: medium
    confidence: high
    dimension: quality
    cwe: [CWE-391, CWE-703]
    controls: [NIST-800-218:PW.5]
    tags: [error-handling]
    query: |
      ; bare `rescue`, `rescue => e`
      (rescue !exceptions !body) @hit
      ((rescue !exceptions body: (then . (nil)) @b) @hit (#match? @b "^\\s*nil(\\s*#[^\\n]*)?\\s*$"))
      ; `rescue StandardError`, `rescue Exception`, `rescue RuntimeError`: a class so
      ; broad that nothing specific was decided. A named class (`rescue LoadError`,
      ; `rescue Errno::ESRCH`) left empty is a decision about that failure and is not reported.
      ((rescue exceptions: (exceptions . (constant) @c .) !body) @hit
        (#match? @c "^(StandardError|Exception|RuntimeError)$"))
      ((rescue exceptions: (exceptions . (constant) @c .) body: (then . (nil)) @b) @hit
        (#match? @c "^(StandardError|Exception|RuntimeError)$") (#match? @b "^\\s*nil(\\s*#[^\\n]*)?\\s*$"))
    unless_inside: |
      ; `post_was = begin handle(req.POST) rescue StandardError; nil end`: a
      ; `nil` written as the value of an assigned begin is the fallback the
      ; caller then tests (rack-protection escaped_params.rb). An empty body
      ; there, and `x = foo rescue nil`, are still reported.
      (assignment right: (begin (rescue body: (then . (nil) .)) @fallback))
      (operator_assignment right: (begin (rescue body: (then . (nil) .)) @fallback))
      ; Gold benchmark (ARB-065): a comment in the empty rescue says why it is
      ; empty (`# Ignored`, `# the query already failed; keep its error`).
      ; RuboCop's Lint/SuppressedException allows the same by default. A
      ; TODO there is not a reason and is still reported, nor is a planted
      ; corpus marker (`# expect: ...`).
      ((rescue !body (comment) @c) @explained (#not-match? @c "(?i)\\b(todo|fixme|xxx)\\b|^#\\s*expect(-ext)?:"))
      ; `rescue => @setup_exception` keeps the error for later (Rails'
      ; parallel test worker reports it after the fork).
      (rescue (exception_variable (instance_variable))) @stored
    description: >-
      The rescue body is empty or `nil`, so the failure is dropped with no
      log, no metric and no re-raise. The caller sees `nil` where it expected
      a result, and the first symptom appears somewhere else.
    remediation: >-
      Rescue the specific class you can handle, log or record the error, and
      re-raise or return an explicit failure for anything else.

  - id: rescue-exception
    title: "`rescue Exception` catches interrupts, SystemExit and NoMemoryError"
    severity: medium
    confidence: high
    dimension: quality
    cwe: [CWE-396]
    controls: [NIST-800-218:PW.5]
    tags: [error-handling]
    query: |
      (rescue exceptions: (exceptions (constant) @c (#eq? @c "Exception"))) @hit
      (rescue exceptions: (exceptions (scope_resolution) @c (#eq? @c "::Exception"))) @hit
    unless_inside: |
      ; a handler that re-raises (even from inside a block) is observing, not swallowing
      ((rescue body: (then) @b) @reraise (#match? @b "\\braise\\b"))
      ; a Rack middleware's `call(env)` is the request boundary: it turns every
      ; failure into an error response (sinatra show_exceptions.rb). Interrupt
      ; and SystemExit are delivered to the main thread, not the request.
      ((method name: (identifier) @n parameters: (method_parameters . (identifier) @p .)) @boundary
        (#match? @n "^call!?$") (#eq? @p "env"))
      ; isolating one callback: the protected body is a single `x.call(...)`
      ; (sidekiq cli.rb chained signal handler, config.rb error handlers), so a
      ; broken plug-in cannot take the host down.
      (begin . (call method: (identifier) @c (#eq? @c "call")) . (rescue) @isolate)
      (do_block body: (body_statement . (call method: (identifier) @c (#eq? @c "call")) . (rescue) @isolate))
      ; the caught exception is handed to a supervisor hook, not dropped
      ; (sidekiq processor.rb `@callback.call(self, ex)`, job_retry.rb
      ; `handle_exception(e, ...)`). Only logging it (`logger.error(e)`) is
      ; still reported.
      ((rescue (exception_variable (identifier) @v)
         (then (call method: (identifier) @m arguments: (argument_list (identifier) @a)))) @handoff
        (#match? @m "^(call|handle_exception|handle_error|on_error|report_exception|notify)$")
        (#eq? @a @v))
      ; Gold benchmark (ARB-065), Puma and Rails: the exception goes to a
      ; method named for error handling (`@log_writer.unknown_error(e, ...)`),
      ; into a collection that is raised later (`exceptions << e`), or out
      ; wrapped (`WrappedException.new(e)`). A logger level call
      ; (`logger.error`, `warn`) or `STDERR.puts` is still reported.
      ((rescue (exception_variable (identifier) @v)
         (then (call method: (identifier) @m arguments: (argument_list . (identifier) @a)))) @handoff
        (#match? @m "(?i)(error|exception)") (#not-match? @m "^(error|warn|info|debug|fatal)$")
        (#eq? @a @v))
      ((rescue (exception_variable (identifier) @v)
         (then (binary operator: "<<" right: (identifier) @a))) @collected
        (#eq? @a @v))
      ((rescue (exception_variable (identifier) @v)
         (then . (call receiver: (_) method: (identifier) @n arguments: (argument_list . (identifier) @a .)) .)) @wrapped
        (#eq? @n "new") (#eq? @a @v))
      ; RuboCop's own cop disabled on the line, which a reviewer has accepted.
      ((rescue (comment) @c) @accepted (#match? @c "rubocop:(disable|todo)[^\\n]*Lint/RescueException"))
    description: >-
      Exception is the root of Interrupt, SignalException, SystemExit and
      NoMemoryError. Rescuing it makes Ctrl-C and `exit` no-ops inside this
      block, and a worker that cannot be stopped by its supervisor.
    remediation: >-
      Rescue StandardError (the default for a bare `rescue`), or the specific
      classes the code can handle.

  # --- Injection -------------------------------------------------------------
  - id: sql-injection
    title: "SQL built by string interpolation: `{text}`"
    severity: high
    confidence: high
    dimension: security
    cwe: [CWE-89]
    controls: [NIST-800-218:PW.5, NIST-800-53r5:SI-10]
    tags: [injection, sql]
    # An interpolation that quotes or escapes its value (`quote_table_name`,
    # `sanitize_sql`, `pg_conn.escape_identifier`, `escape_string`), converts
    # it to a number (`.to_i`, `Integer(...)`) or splices a constant or a
    # schema name is not reported; each raw interpolation in the string is
    # matched on its own, so one raw value beside escaped ones still is
    # (gold benchmark, ARB-065: Action Cable's PostgreSQL adapter).
    query: |
      ; where("name = '#{name}'"), find_by_sql("... #{id}"), db.execute("... #{id}")
      ((call method: (identifier) @m
         (#match? @m "^(where|rewhere|not|find_by_sql|count_by_sql|execute|exec_query|exec_update|exec_delete|exec_insert|select_all|select_one|select_value|select_values|select_rows|query|exec|exec_params|prepare|order|reorder|group|having|joins|select|pluck|update_all|delete_all|async_exec|exec_prepared|execute_batch)$")
         arguments: (argument_list . (string (interpolation) @i)))
        @hit (#not-match? @i "^#\\{[A-Z]|table_name|primary_key|quote|sanitize|escape|connection\\.|_column|arel|\\.to_i\\s*\\}$|\\.to_f\\s*\\}$|^#\\{\\s*(Integer|Float)\\("))
      ; where(<<~SQL) with an interpolation inside the heredoc body
      (((call method: (identifier) @m
          (#match? @m "^(where|find_by_sql|count_by_sql|execute|exec_query|select_all|select_one|select_value|select_values|query|exec|prepare|update_all|delete_all)$")
          arguments: (argument_list . (heredoc_beginning))) @hit
        (heredoc_body (interpolation) @i))
        (#not-match? @i "^#\\{[A-Z]|table_name|primary_key|quote|sanitize|escape|connection\\.|_column|arel|\\.to_i\\s*\\}$|\\.to_f\\s*\\}$|^#\\{\\s*(Integer|Float)\\("))
      ; order(params[:sort]), pluck(params[:field]): the column name comes straight from the request
      ((call method: (identifier) @m
         (#match? @m "^(order|reorder|group|select|pluck|joins|having|where|execute|query)$")
         arguments: (argument_list . (element_reference object: (identifier) @p)))
        @hit (#eq? @p "params"))
    description: >-
      The SQL text is assembled from a runtime value. Whoever controls that
      value controls the query: a quote in a name reads or deletes other
      rows. `order`/`pluck` with a request parameter is the same defect
      without the quote.
    remediation: >-
      Bind values: `where("name = ?", name)` or `where(name: name)`; whitelist
      column names for `order`; use prepared statements (`db.execute(sql,
      [id])`, `conn.exec_params`) for raw drivers.
    # One-hop data flow (Milestone 3): the interpolated SQL (same exclusions
    # as above) reaches the call through a local or a same-file helper, or
    # is concatenated with `+`.
    taint:
      sources: |
        ((string (interpolation) @i) @source
         (#not-match? @i "^#\\{[A-Z]|table_name|primary_key|quote|sanitize|escape|connection\\.|_column|arel|\\.to_i\\s*\\}$|\\.to_f\\s*\\}$|^#\\{\\s*(Integer|Float)\\("))
        ((heredoc_body (interpolation) @i) @source
         (#not-match? @i "^#\\{[A-Z]|table_name|primary_key|quote|sanitize|escape|connection\\.|_column|arel|\\.to_i\\s*\\}$|\\.to_f\\s*\\}$|^#\\{\\s*(Integer|Float)\\("))
        ((binary operator: "+") @source
         (#match? @source "^\\(*[\"'](?i:\\s*(select|insert|update|delete|notify|with|where|order|create|drop|alter)\\b)"))
      sinks: |
        ((call method: (identifier) @m arguments: (argument_list . (_) @sink)) @hit
         (#match? @m "^(where|rewhere|not|find_by_sql|count_by_sql|execute|exec_query|exec_update|exec_delete|exec_insert|select_all|select_one|select_value|select_values|select_rows|query|exec|exec_params|prepare|order|reorder|group|having|joins|update_all|delete_all)$")
         (#not-match? @hit "^(::)?(Kernel|Process|IO|Open3)\\."))
      sanitizers: |
        ((call method: (identifier) @m) @sanitizer
         (#match? @m "^(to_i|to_f|quote|quote_table_name|quote_column_name|sanitize_sql\\w*|escape_string|escape_literal)$"))

  - id: command-injection
    title: "Shell command built by string interpolation: `{text}`"
    severity: high
    confidence: high
    dimension: security
    cwe: [CWE-78]
    controls: [NIST-800-218:PW.5, NIST-800-53r5:SI-10]
    tags: [injection, shell]
    query: |
      ; `ls #{dir}` and %x(...). An interpolation of a pid or an `.to_i` is not
      ; injectable; the hit needs at least one other interpolation, so
      ; `cp #{name} bak#{Time.now.to_i}` is still reported (railsgoat benefits.rb).
      ((subshell (interpolation)) @hit
        (#not-match? @hit "Shellwords|shellescape|shelljoin|\\.escape\\(")
        (#match? @hit "#\\{(?![^}]*(\\.to_i|\\bpid)\\s*\\})"))
      ; system("ls #{dir}") / exec / spawn: one string goes through /bin/sh
      ((call !receiver method: (identifier) @m (#match? @m "^(system|exec|spawn)$")
         arguments: (argument_list . (string (interpolation)) @cmd (pair)* .))
        @hit (#not-match? @hit "Shellwords|shellescape|shelljoin|\\.escape\\(")
        (#match? @hit "#\\{(?![^}]*(\\.to_i|\\bpid)\\s*\\})"))
      ; Open3.capture2("ls #{dir}"), IO.popen("..."), Kernel.system, Process.spawn
      ((call receiver: (constant) @r method: (identifier) @m
         (#match? @r "^(Open3|IO|Kernel|Process)$")
         (#match? @m "^(capture2|capture2e|capture3|popen|popen2|popen2e|popen3|pipeline|pipeline_r|pipeline_w|system|spawn|exec)$")
         arguments: (argument_list . (string (interpolation)) @cmd (pair)* .))
        @hit (#not-match? @hit "Shellwords|shellescape|shelljoin|\\.escape\\(")
        (#match? @hit "#\\{(?![^}]*(\\.to_i|\\bpid)\\s*\\})"))
    description: >-
      A single command string with `#{}` in it is handed to /bin/sh, which
      interprets `;`, `|`, `$()` and backticks in the interpolated value.
      Anyone who influences that value runs their own command.
    remediation: >-
      Use the multi-argument form, which bypasses the shell:
      `system("ls", dir)`, `Open3.capture2("git", "log", path)`; or escape
      with `Shellwords.escape` if a single string is unavoidable.
    # One-hop data flow (Milestone 3): the interpolated command reaches the
    # shell call through a local or a helper, or is concatenated with `+`.
    taint:
      mode: nonconst
      sinks: |
        ((call !receiver method: (identifier) @m arguments: (argument_list . (_) @sink (pair)* .)) @hit
         (#match? @m "^(system|exec|spawn)$") (#not-match? @sink "^\\*"))
        ((call receiver: (constant) @r method: (identifier) @m arguments: (argument_list . (_) @sink (pair)* .)) @hit
         (#match? @r "^(Open3|IO|Kernel|Process)$")
         (#match? @m "^(capture2|capture2e|capture3|popen|popen2|popen2e|popen3|pipeline|pipeline_r|pipeline_w|system|spawn|exec)$")
         (#not-match? @sink "^\\*"))
      sanitizers: |
        ((call method: (identifier) @m) @sanitizer (#match? @m "^(shellescape|shelljoin|escape|to_i|to_f|pid)$"))
        ((call receiver: (constant) @c method: (identifier) @m) @sanitizer (#eq? @c "Shellwords"))
      value: [cmd]
      built: true

  - id: code-injection
    title: "Runtime value reaches `{text}`"
    severity: high
    confidence: high
    dimension: security
    cwe: [CWE-95, CWE-470]
    controls: [NIST-800-218:PW.5, NIST-800-53r5:SI-10]
    tags: [injection, eval]
    query: |
      ; eval(params[:expr]), send(params[:action]), instance_eval(params[:code]), const_get(params[:type])
      ((call method: (identifier) @m
         (#match? @m "^(eval|send|public_send|__send__|instance_eval|class_eval|module_eval|instance_variable_get|instance_variable_set|const_get|define_method|method)$")
         arguments: (argument_list) @a)
        @hit (#match? @a "\\bparams\\b|\\brequest\\.|\\bcookies\\b"))
      ; params[:klass].constantize, "Jobs::#{params[:type]}".constantize
      ((call receiver: (_) @r method: (identifier) @m
         (#match? @m "^(constantize|safe_constantize)$"))
        @hit (#match? @r "\\bparams\\b|\\brequest\\.|\\bcookies\\b"))
    description: >-
      `eval`, `send` and `constantize` turn a string into code, a method call
      or a class. When the string comes from the request, the caller chooses
      what runs: `send("destroy")`, `constantize` to any class with a
      dangerous `new`.
    remediation: >-
      Dispatch through an explicit allow-list (`HANDLERS.fetch(name)`,
      `%w[asc desc].include?(dir)`); never eval or send a value you did not
      write yourself.

  - id: dynamic-eval
    title: "`{text}` runs a string as code"
    severity: medium
    confidence: medium
    dimension: security
    cwe: [CWE-95]
    controls: [NIST-800-218:PW.5]
    tags: [injection, eval]
    query: |
      ; eval(code) with anything but a literal; request-sourced strings are code-injection
      (call !receiver method: (identifier) @m (#eq? @m "eval")
        arguments: (argument_list . [(identifier) (instance_variable) (element_reference) (call) (string (interpolation))])) @hit
      (call receiver: (constant) @r method: (identifier) @m (#eq? @r "Kernel") (#eq? @m "eval")
        arguments: (argument_list . [(identifier) (instance_variable) (element_reference) (call) (string (interpolation))])) @hit
    description: >-
      Whatever the string holds runs with the caller's privileges. Reading it
      from a file or building it at runtime is a code-loading mechanism
      (Rack::Builder does this for config.ru); if any part of it can be
      influenced from outside the process, it is remote code execution.
    remediation: >-
      Prefer `load`/`require` for files, `public_send` through an allow-list
      for dispatch, and a parser for expressions.

  # --- Deserialization -------------------------------------------------------
  - id: marshal-load
    title: "`Marshal.load` deserializes untrusted bytes"
    severity: high
    confidence: high
    dimension: security
    cwe: [CWE-502]
    controls: [NIST-800-218:PW.5]
    tags: [deserialization]
    query: |
      (call receiver: (constant) @r method: (identifier) @m
        (#eq? @r "Marshal") (#match? @m "^(load|restore)$")) @hit
    unless_inside: |
      ; `Marshal.load(Marshal.dump(obj))` is a deep copy of an object this
      ; process built (sidekiq redis_connection.rb); no foreign bytes involved.
      ((call receiver: (constant) @r method: (identifier) @m
         arguments: (argument_list . (call receiver: (constant) @r2 method: (identifier) @d) .)) @clone
        (#eq? @r "Marshal") (#eq? @r2 "Marshal") (#eq? @d "dump"))
    description: "Marshal.load can instantiate arbitrary objects chosen by whoever wrote the bytes."
    remediation: "Use JSON.parse, or YAML.safe_load with permitted classes."

  - id: yaml-unsafe-load
    title: "`{text}` can instantiate arbitrary classes from the document"
    severity: high
    confidence: medium
    dimension: security
    cwe: [CWE-502]
    controls: [NIST-800-218:PW.5]
    tags: [deserialization, yaml]
    query: |
      ((call receiver: (constant) @r method: (identifier) @m
         (#match? @r "^(YAML|Psych)$")
         (#match? @m "^(load|load_file|load_stream|unsafe_load|unsafe_load_file)$"))
        @hit (#not-match? @hit "permitted_classes|\\.safe_load"))
      ((call receiver: (constant) @r method: (identifier) @m (#eq? @r "Oj") (#eq? @m "load"))
        @hit (#not-match? @hit "mode:\\s*:(strict|null|compat|json|rails|wab)"))
    description: >-
      `YAML.unsafe_load` (and `YAML.load` on Psych 3, which Rubies before 3.1
      ship) builds whatever Ruby object the `!ruby/object` tag names; `Oj.load`
      in its default object mode does the same from `^o` keys. A document
      from a client or a file it can write is a remote code execution path.
    remediation: >-
      `YAML.safe_load(doc, permitted_classes: [...])`, `Oj.load(doc, mode:
      :strict)` or `Oj.strict_load`; `JSON.parse` when the format is yours
      to choose.

  # --- Stubs -----------------------------------------------------------------
  - id: stub-method
    title: "Method body is only `{text}`"
    severity: low
    confidence: medium
    dimension: quality
    cwe: [CWE-1164]
    controls: [NIST-800-218:PW.5]
    tags: [stub]
    query: |
      ; def x; raise NotImplementedError; end  -- bare, not the abstract-method idiom with a message
      ([(method body: (body_statement . (call method: (identifier) @r (#eq? @r "raise")) @hit))
        (singleton_method body: (body_statement . (call method: (identifier) @r (#eq? @r "raise")) @hit))] @meth
        (#match? @meth "^def [^\\n]*\\n\\s*raise NotImplementedError\\s*(#[^\\n]*)?\\n\\s*end$"))
      ; raise "TODO" / raise NotImplementedError, "TODO: later"
      ([(method body: (body_statement . (call method: (identifier) @r (#eq? @r "raise")) @hit))
        (singleton_method body: (body_statement . (call method: (identifier) @r (#eq? @r "raise")) @hit))] @meth
        (#match? @meth "(?i)^def [^\\n]*\\n\\s*raise ([\"'][^\"'\\n]*(todo|fixme|not (yet )?implemented|implement me|stub|later|placeholder)|NotImplementedError, [\"'][^\"'\\n]*(todo|fixme|not yet implemented|implement me|stub|later|placeholder))[^\"'\\n]*[\"']\\s*(#[^\\n]*)?\\n\\s*end$"))
      ; def x; nil # TODO; end  /  true # stub
      ([(method body: (body_statement . [(nil) (true) (false)] @hit))
        (singleton_method body: (body_statement . [(nil) (true) (false)] @hit))] @meth
        (#match? @meth "(?i)^def [^\\n]*\\n\\s*(nil|true|false)\\s*#\\s*(todo|fixme|stub|placeholder|for now|temporary|later)[^\\n]*\\n\\s*end$"))
    # Gold benchmark (ARB-065), Rails and RubyGems: the abstract-method
    # convention is mostly a bare `raise NotImplementedError`. Such a method
    # is an interface, not a stub, when (1) its class, module or `class <<
    # self` declares two or more of them (ActiveStorage::Service,
    # DatabaseConfig, Key, Gem::BasicSpecification), (2) it is a private
    # hook below `private` that a subclass overrides (StatementPool#dealloc),
    # or (3) its class is named for it (`AbstractRenderer`, `Base`). Only the
    # raising methods are captured, so a `nil # TODO` stub beside them is
    # still reported. `raise NotImplementedError, "rename_table is not
    # implemented"` says an adapter lacks a feature and is not reported;
    # "TODO" and "not yet implemented" still are. One bare raise in an
    # ordinary class is still reported.
    unless_inside: |
      (class body: (body_statement
        [(method) (singleton_method)] @a (#match? @a "^def [^\\n]*\\n\\s*raise NotImplementedError\\b")
          (#not-match? @a "(?i)todo|fixme|not yet implemented|implement me|placeholder")
        [(method) (singleton_method)] @b (#match? @b "^def [^\\n]*\\n\\s*raise NotImplementedError\\b")
          (#not-match? @b "(?i)todo|fixme|not yet implemented|implement me|placeholder")))
      (module body: (body_statement
        [(method) (singleton_method)] @a (#match? @a "^def [^\\n]*\\n\\s*raise NotImplementedError\\b")
          (#not-match? @a "(?i)todo|fixme|not yet implemented|implement me|placeholder")
        [(method) (singleton_method)] @b (#match? @b "^def [^\\n]*\\n\\s*raise NotImplementedError\\b")
          (#not-match? @b "(?i)todo|fixme|not yet implemented|implement me|placeholder")))
      (singleton_class body: (body_statement
        (method) @a (#match? @a "^def [^\\n]*\\n\\s*raise NotImplementedError\\b")
          (#not-match? @a "(?i)todo|fixme|not yet implemented|implement me|placeholder")
        (method) @b (#match? @b "^def [^\\n]*\\n\\s*raise NotImplementedError\\b")
          (#not-match? @b "(?i)todo|fixme|not yet implemented|implement me|placeholder")))
      (body_statement (identifier) @p (#match? @p "^(private|protected)$")
        (method) @hook (#match? @hook "^def [^\\n]*\\n\\s*raise NotImplementedError\\b"))
      (class name: (_) @n (#match? @n "(^|::)(Abstract|Base)[A-Z]|(Abstract|Base)$")
        body: (body_statement [(method) (singleton_method)] @m (#match? @m "^def [^\\n]*\\n\\s*raise NotImplementedError\\b")))
    description: >-
      The method does nothing but raise or return a constant marked
      temporary. In a scaffold that is fine; shipped, every caller is
      either broken or getting a placeholder answer. (The abstract-method
      idiom, `raise NotImplementedError, "subclasses must implement"`, is
      left alone.)
    remediation: "Implement it, or make the caller fail loudly with a message that says why."

  # --- Tests (spec/*_spec.rb) ------------------------------------------------
  - id: vacuous-spec
    title: "Example `{text}` has no expectation"
    severity: low
    confidence: medium
    dimension: assurance
    cwe: [CWE-1164]
    controls: [NIST-800-218:PW.8, NIST-800-53r5:SA-11]
    tags: [assurance, test, rspec]
    roles: [test]
    files: "*_spec.rb"
    # Gold benchmark (ARB-065), Bundler: a call to an assertion helper,
    # `should_be_ruby_version_incorrect`, `expect_no_output`,
    # `mock_confirm_message` (sets a message expectation), `check_commands!`
    # or `gem_skeleton_assertions`, is an assertion.
    query: |
      ((call method: (identifier) @m (#match? @m "^(it|specify|example|scenario)$")
         arguments: (argument_list)
         block: (do_block) @b)
        @hit (#not-match? @b "\\bexpect\\s*[({]|\\bexpect_any_instance_of\\b|\\bis_expected\\b|\\bshould\\b|\\bassert|\\.to\\b|\\.not_to\\b|\\.to_not\\b|\\bverify|raise_error|aggregate_failures|\\bpending\\b|\\bskip\\b|\\bflunk\\b|\\bfail\\b|\\b(should|expect|assert|verify|must|mock|check)_\\w+|\\w_assertions?\\b"))
      ((call method: (identifier) @m (#match? @m "^(it|specify|example|scenario)$")
         block: (block) @b)
        @hit (#not-match? @b "\\bexpect\\s*[({]|\\bexpect_any_instance_of\\b|\\bis_expected\\b|\\bshould\\b|\\bassert|\\.to\\b|\\.not_to\\b|\\.to_not\\b|\\bverify|raise_error|aggregate_failures|\\bpending\\b|\\bskip\\b|\\bflunk\\b|\\bfail\\b|\\b(should|expect|assert|verify|must|mock|check)_\\w+|\\w_assertions?\\b"))
    unless_inside: |
      ((call method: (identifier) @m (#match? @m "^(it|specify|example|scenario)$")
         block: (do_block body: (body_statement (call !receiver method: (identifier) @h) .)))
        @delegated
        (#not-match? @h "^(get|post|put|patch|delete|head|options|visit|click|fill_in|sleep|puts|p|pp|print|run|call|subject|described_class|send|request|follow_redirect!)$"))
      ; Gold benchmark (ARB-065), Bundler's specs: the helper call is followed
      ; by its heredoc (`install_gemfile <<-G ... G`, which raises on a
      ; failed install), or is a bare helper name (`should_not_resolve`,
      ; `gem_skeleton_assertions`).
      ((call method: (identifier) @m (#match? @m "^(it|specify|example|scenario)$")
         block: (do_block body: (body_statement (call !receiver method: (identifier) @h) . (heredoc_body) .)))
        @delegated
        (#not-match? @h "^(get|post|put|patch|delete|head|options|visit|click|fill_in|sleep|puts|p|pp|print|run|call|subject|described_class|send|request|follow_redirect!)$"))
      ((call method: (identifier) @m (#match? @m "^(it|specify|example|scenario)$")
         block: (do_block body: (body_statement (identifier) @h .)))
        @delegated
        (#not-match? @h "^(get|post|put|patch|delete|head|options|visit|click|fill_in|sleep|puts|p|pp|print|run|call|subject|described_class|send|request|follow_redirect!)$"))
      ; the example is named for not raising: "doesn't blow up when the config
      ; is empty", "does not raise". The body is the assertion.
      ((call method: (identifier) @m (#match? @m "^(it|specify|example|scenario)$")
         arguments: (argument_list . (string) @d))
        @no_raise
        (#match? @d "(?i)\\b(does not|doesn't|do not|don't|should not|shouldn't|will not|won't|never)\\s+(raise|blow up|explode|crash|error|hang|break)"))
      ; the group's `after { expect(...) }` / `after { stubs.verify_stubbed_calls }`
      ; asserts for every example in it (faraday connection_spec.rb)
      ((call method: (identifier) @g
         block: (do_block body: (body_statement (call !receiver method: (identifier) @a block: (_) @ab))))
        @checked_after
        (#match? @g "^(describe|context|feature|shared_examples|shared_examples_for|shared_context)$")
        (#eq? @a "after")
        (#match? @ab "\\bexpect\\s*[({]|\\bis_expected\\b|\\bshould\\b|\\bassert|\\bverify"))
    description: >-
      The example body contains no `expect`, `should`, `assert` or
      `is_expected`, so it passes whatever the code does, and counts toward
      coverage while proving nothing. A smoke test that only checks "does
      not raise" should say so with `expect { ... }.not_to raise_error`.
    remediation: "Assert the behaviour, or state the no-raise expectation explicitly."

  - id: skipped-spec
    title: "Example is skipped unconditionally: `{text}`"
    severity: low
    confidence: high
    dimension: assurance
    cwe: [CWE-1164]
    controls: [NIST-800-218:PW.8, NIST-800-53r5:SA-11]
    tags: [assurance, test, rspec]
    roles: [test]
    files: "*_spec.rb"
    query: |
      ; xit "..." do ... end, xdescribe, xcontext
      (call method: (identifier) @m (#match? @m "^(xit|xspecify|xexample|xdescribe|xcontext|xfeature|xscenario)$")) @hit
      ; a bare `skip` / `pending` with no receiver and no condition
      (call !receiver method: (identifier) @m (#match? @m "^(skip|pending)$")) @hit
      ((identifier) @hit (#match? @hit "^(skip|pending)$"))
      ; it "..." with no block is pending in RSpec
      (call method: (identifier) @m (#match? @m "^(it|specify|example)$")
        arguments: (argument_list . (string) .) !block) @hit
      ; it "...", skip: true / :pending
      (call method: (identifier) @m (#match? @m "^(it|specify|example|describe|context)$")
        arguments: (argument_list (pair key: (hash_key_symbol) @k (#match? @k "^(skip|pending)$") value: [(true) (string)]))) @hit
      (call method: (identifier) @m (#match? @m "^(it|specify|example|describe|context)$")
        arguments: (argument_list (simple_symbol) @k (#match? @k "^:(skip|pending)$"))) @hit
    unless_inside: |
      (if) @cond
      (unless) @cond
      (if_modifier) @cond
      (unless_modifier) @cond
      (conditional) @cond
      (case) @cond
      ; `rescue LoadError => e; skip e.message` is conditional on the failure
      (rescue) @cond
    description: >-
      An unconditionally skipped or pending example passes forever and
      protects nothing. A skip with a condition (a platform, a missing
      service) is a different thing and is not reported.
    remediation: "Fix it, delete it, or give the skip a condition and a reason."

  # --- TLS -------------------------------------------------------------------
  - id: tls-verify-off
    title: "TLS certificate verification disabled: `{text}`"
    severity: high
    confidence: high
    dimension: security
    cwe: [CWE-295]
    controls: [NIST-800-218:PW.5, NIST-800-53r5:SC-8]
    tags: [tls, security-check-disabled]
    query: |
      (scope_resolution name: (constant) @c (#eq? @c "VERIFY_NONE")) @hit
      (pair key: (hash_key_symbol) @k value: (false)
        (#match? @k "^(verify|verify_ssl|verify_peer|ssl_verify_peer|verify_ssl_certificate|verify_hostname|ssl_verify)$")) @hit
      (pair key: (simple_symbol) @k value: (false)
        (#match? @k "^:(verify|verify_ssl|verify_peer|ssl_verify_peer|verify_ssl_certificate|verify_hostname|ssl_verify)$")) @hit
    description: >-
      With verification off the client accepts any certificate, so anyone on
      the path can terminate the TLS session and read or rewrite the traffic.
      Written to get past a self-signed certificate in development; shipped
      because nothing complains afterwards.
    remediation: >-
      Leave `verify_mode` at VERIFY_PEER; for a private CA, set `ca_file`
      or add it to the cert store instead.

  # --- Randomness ------------------------------------------------------------
  - id: insecure-random
    title: "`{text}` uses the predictable Kernel#rand for a secret"
    severity: medium
    confidence: medium
    dimension: security
    cwe: [CWE-338]
    controls: [NIST-800-218:PW.5]
    tags: [randomness, crypto]
    query: |
      ; token = rand(36**8).to_s(36) / @session_id = Random.new.bytes(16) / code = DIGITS.sample
      ((assignment left: (_) @l right: (_) @r) @hit
        (#match? @l "(?i)token|secret|passw|nonce|session|salt|otp|api_key|apikey|csrf|reset_code|verif|activation|confirm")
        (#match? @r "\\brand\\(|\\brand\\b|\\bRandom\\.(new|rand|bytes)\\b|\\.(sample|shuffle)\\b"))
      ; def generate_token ... rand(...) ... end: a call in the body that reaches rand
      ((method name: (identifier) @n
         (#match? @n "(?i)token|secret|passw|nonce|session_id|salt|otp|api_key|apikey|csrf|reset_code|verification_code|activation|confirmation_code")
         body: (body_statement (call) @hit))
        (#match? @hit "\\brand\\(|\\bRandom\\.(new|rand|bytes)\\b|\\.(sample|shuffle)\\b"))
      ((method name: (identifier) @n
         (#match? @n "(?i)token|secret|passw|nonce|session_id|salt|otp|api_key|apikey|csrf|reset_code|verification_code|activation|confirmation_code")
         body: (body_statement (assignment right: (call) @hit)))
        (#match? @hit "\\brand\\(|\\bRandom\\.(new|rand|bytes)\\b|\\.(sample|shuffle)\\b"))
    description: >-
      Kernel#rand, Random.new and Array#sample draw from a Mersenne Twister
      seeded once per process: observe a few outputs and the rest are
      predictable. A token, session id or reset code built from it can be
      guessed.
    remediation: >-
      Use SecureRandom: `SecureRandom.hex(16)`, `SecureRandom.urlsafe_base64`,
      `SecureRandom.random_number(range)`, `SecureRandom.alphanumeric`.

  # --- Authentication, CSRF and error disclosure (CWE Top 25, ARB-062) ------
  - id: jwt-unverified-decode
    title: "JWT decoded without checking its signature: `{text}`"
    severity: high
    confidence: high
    dimension: security
    cwe: [CWE-287, CWE-347]
    controls: [NIST-800-53r5:IA-2, OWASP-ASVS:3.5.3]
    tags: [auth, jwt, security-check-disabled]
    # ruby-jwt's `JWT.decode(token, key, verify = true, options)`: a literal
    # `false` third argument skips the signature, and an algorithm list that
    # admits "none" accepts an unsigned token.
    query: |
      (call receiver: [(constant) (scope_resolution)] @r (#match? @r "^(::)?JWT$")
        method: (identifier) @m (#eq? @m "decode")
        arguments: (argument_list . (_) . (_) . (false))) @hit
      ((call receiver: [(constant) (scope_resolution)] @r (#match? @r "^(::)?JWT$")
         method: (identifier) @m (#eq? @m "decode")
         arguments: (argument_list (pair key: (hash_key_symbol) @k (#match? @k "^algorithms?$") value: (_) @v)))
        @hit (#match? @v "(?i)^\\[?\\s*[\"']none[\"']"))
    # Peek, then verify: a method that also calls `JWT.decode(..., true, ...)`
    # read an unverified claim (`iss`, `kid`) to choose the key.
    unless_in_scope: |
      ((call receiver: [(constant) (scope_resolution)] @r (#match? @r "^(::)?JWT$")
         method: (identifier) @m (#eq? @m "decode")
         arguments: (argument_list . (_) . (_) . (true))) @x
        (#not-match? @x "(?i)[\"']none[\"']"))
    description: >-
      The payload is trusted without checking that the issuer signed it.
      Anyone can write `{"sub": 1}`, base64 it and be that user. Model-drafted
      code reaches for this to "just read the user id" from a bearer token.
    remediation: >-
      `JWT.decode(token, ENV.fetch("JWT_SECRET"), true, algorithm: "HS256")`
      with a fixed algorithm, and `aud`/`iss` checks where the token has them.

  - id: jwt-literal-signing-key
    title: "JWT key is a string literal in the source: `{text}`"
    severity: high
    confidence: high
    dimension: security
    cwe: [CWE-798, CWE-321]
    controls: [NIST-800-53r5:IA-5, OWASP-ASVS:2.10.4]
    tags: [secrets, jwt, crypto]
    # The literal is the key argument of `JWT.encode(payload, key, alg)` or
    # `JWT.decode(token, key, ...)`, or a constant of the same class, module
    # or file that is passed there. The secrets probe misses both: the
    # literal sits in an argument, and `SIGNING_KEY` is not a
    # credential-shaped name. The hit is the call or the constant's name,
    # never the literal, so the key stays out of the report's evidence.
    query: |
      ((call receiver: [(constant) (scope_resolution)] @hit (#match? @hit "^(::)?JWT$")
         method: (identifier) @m (#match? @m "^(encode|decode)$")
         arguments: (argument_list . (_) . (string (string_content) @s)))
        (#not-match? @s "^(.{0,7}|(?i:.*(changeme|change[-_]me|your[-_]|placeholder|example|dummy|xxx|replace[-_]?me|not[-_]?(a[-_])?secret).*)|-----BEGIN.*)$"))
      ; `SIGNING_KEY = "..."` in a class or module body that passes it to
      ; JWT.encode/decode (the backreference ties the constant to the call).
      ((body_statement (assignment left: (constant) @hit (#match? @hit "^[A-Z][A-Z0-9_]*(KEY|SECRET)$")
          right: (string (string_content) @s)
          (#not-match? @s "^(.{0,7}|(?i:.*(changeme|change[-_]me|your[-_]|placeholder|example|dummy|xxx|replace[-_]?me|not[-_]?(a[-_])?secret).*)|-----BEGIN.*)$"))) @body
        (#match? @body "(?ms)^\\s*([A-Z][A-Z0-9_]*(KEY|SECRET))\\s*=\\s*[\"'](?!(?i:[^\"'\\n]*(changeme|change[-_]me|your[-_]|placeholder|example|dummy|xxx|replace[-_]?me|not[-_]?(a[-_])?secret)))[^\"'\\n]{8,}[\"'].*\\bJWT\\.(encode|decode)\\((?:[^()]|\\([^()]*\\))*?,\\s*\\1\\b"))
      ((program (assignment left: (constant) @hit (#match? @hit "^[A-Z][A-Z0-9_]*(KEY|SECRET)$")
          right: (string (string_content) @s)
          (#not-match? @s "^(.{0,7}|(?i:.*(changeme|change[-_]me|your[-_]|placeholder|example|dummy|xxx|replace[-_]?me|not[-_]?(a[-_])?secret).*)|-----BEGIN.*)$"))) @body
        (#match? @body "(?ms)^\\s*([A-Z][A-Z0-9_]*(KEY|SECRET))\\s*=\\s*[\"'](?!(?i:[^\"'\\n]*(changeme|change[-_]me|your[-_]|placeholder|example|dummy|xxx|replace[-_]?me|not[-_]?(a[-_])?secret)))[^\"'\\n]{8,}[\"'].*\\bJWT\\.(encode|decode)\\((?:[^()]|\\([^()]*\\))*?,\\s*\\1\\b"))
    description: >-
      Whoever can read the repository can mint a valid token for any user,
      and rotating the key means a code change and a deploy. A placeholder
      secret like this is the classic generated default that ships.
    remediation: "`ENV.fetch(\"JWT_SECRET\")` or `Rails.application.credentials.jwt_secret`, read once at boot."

  - id: csrf-protection-disabled
    title: "CSRF protection switched off: `{text}`"
    severity: high
    confidence: medium
    dimension: security
    cwe: [CWE-352]
    controls: [NIST-800-53r5:SC-23, OWASP-ASVS:4.2.2]
    tags: [csrf, rails, security-check-disabled]
    # `skip_before_action :verify_authenticity_token` and
    # `skip_forgery_protection` in a controller that has a state-changing
    # action of its own. Not reported:
    # * ActionController::API / Metal controllers, which have no CSRF check;
    # * GET-only controllers (Rails' WelcomeController and PwaController);
    # * an abstract base with no actions (ActionMailbox::BaseController);
    # * webhook and ingress endpoints, and controllers that authenticate the
    #   request itself (a signed token or URL, an HMAC signature, a bearer
    #   token): no ambient cookie authority, so nothing to forge
    #   (ActiveStorage::DiskController checks a signed token).
    # `protect_from_forgery with: :null_session` is not reported: it is a
    # protection strategy (an unverified request runs with no session and no
    # cookies), and Rails' own documentation recommends it for APIs.
    query: |
      (call !receiver method: (identifier) @m (#eq? @m "skip_before_action")
        arguments: (argument_list (simple_symbol) @s (#eq? @s ":verify_authenticity_token"))) @hit
      (call !receiver method: (identifier) @m (#eq? @m "skip_forgery_protection")) @hit
      ((identifier) @hit (#eq? @hit "skip_forgery_protection"))
    requires_file: |
      (method name: (identifier) @n
        (#match? @n "^(create|update|destroy|delete|remove|upload|import|submit|approve|reject|transfer|cancel|confirm|charge|pay|purchase|checkout|subscribe|unsubscribe|reset|change|save|publish|vote|follow|unfollow|invite|accept|decline|grant|revoke|enable|disable|archive|restore|send|post|toggle)(_\\w+)?$")) @x
    unless_in_file: |
      (class superclass: (superclass (scope_resolution) @s (#match? @s "^(::)?ActionController::(API|Metal)$"))) @x
      (class name: (_) @n (#match? @n "(?i)(webhook|ingress|inbound|callback|hook|notification|stripe|twilio|github|slack)")) @x
      ((call method: (identifier) @a) @x
        (#match? @a "^(authenticate_with_http_token|authenticate_or_request_with_http_token|secure_compare|construct_event|verify_signature|verify_webhook\\w*|valid_signature\\?|verified_request\\?|decode_verified_\\w+|doorkeeper_authorize!|authenticate_api\\w*)$"))
      ((scope_resolution) @x (#match? @x "^(::)?OpenSSL::HMAC$"))
      ; a helper called without arguments parses as a bare identifier:
      ; `if token = decode_verified_token` (ActiveStorage::DiskController)
      ((identifier) @x (#match? @x "^(decode_verified_\\w+|verified_request\\?|valid_signature\\?|verify_signature|verify_webhook\\w*|authenticate_api\\w*|doorkeeper_authorize!)$"))
    description: >-
      Rails checks an authenticity token on every non-GET request so that a
      page on another site cannot submit a form as the logged-in user. Turning
      the check off is the usual generated "fix" for an
      `InvalidAuthenticityToken` error on a form or fetch; it makes every
      state-changing action here forgeable from any website the user visits.
    remediation: >-
      Keep the check and send the token (`form_with` does; for fetch, read
      `csrf_meta_tags`'s value into an `X-CSRF-Token` header). An endpoint
      that is really an API should inherit ActionController::API and
      authenticate each request with a token, not a cookie.

  - id: csrf-protection-off-in-production
    title: "CSRF protection switched off in the production environment: `{text}`"
    severity: high
    confidence: high
    dimension: security
    cwe: [CWE-352]
    controls: [NIST-800-53r5:SC-23, OWASP-ASVS:4.2.2]
    tags: [csrf, rails, security-check-disabled, config]
    # `config.action_controller.allow_forgery_protection = false` turns the
    # authenticity-token check off for every controller. Rails' generated
    # config/environments/test.rb does exactly that, so only the production
    # environment file is read (`files:`); test.rb and development.rb are
    # never reported, nor `= true`.
    files: [config/environments/production.rb, "*/config/environments/production.rb"]
    query: |
      (assignment
        left: (call
          receiver: (call method: (identifier) @ac (#eq? @ac "action_controller"))
          method: (identifier) @m (#eq? @m "allow_forgery_protection"))
        right: (false)) @hit
    description: >-
      With `allow_forgery_protection = false` in production, no controller
      checks the authenticity token, whatever `protect_from_forgery` says:
      any site the user visits can submit a form or a fetch as the logged-in
      user. The line is the generated test-environment setting, copied or
      left behind when an `InvalidAuthenticityToken` error appeared.
    remediation: >-
      Delete the line (Rails defaults it to true outside the test
      environment) and send the token from forms and fetches instead. A
      token-authenticated API should inherit ActionController::API rather
      than turn the check off application-wide.

  - id: error-backtrace-to-client
    title: "Exception backtrace returned to the client: `{text}`"
    severity: medium
    confidence: high
    dimension: security
    cwe: [CWE-209, CWE-200]
    controls: [NIST-800-53r5:SI-11, OWASP-ASVS:7.4.1]
    tags: [error-handling, information-exposure]
    # A response sink whose arguments hold an exception's backtrace or
    # `full_message` (which includes it): `render json:/plain:/html:`,
    # Sinatra's `halt` and `body`, Grape's `error!`, or a Rack triple
    # `[500, headers, [e.full_message]]` returned from `call`.
    query: |
      ((call !receiver method: (identifier) @m (#match? @m "^(render|halt|body|json|error!|respond_with)$")
         arguments: (argument_list) @a) @hit
        (#match? @a "\\.(backtrace|full_message|backtrace_locations)\\b"))
      ((array . (integer) . (_) . (array) @b .) @hit
        (#match? @b "\\.(backtrace|full_message|backtrace_locations)\\b"))
    description: >-
      The client receives the stack: file paths, gem names and versions,
      the line that failed. It is a map of the application for whoever
      triggers the error, and Rails' own error pages hide it outside
      development for that reason.
    remediation: >-
      Log the backtrace with an incident id (`Rails.logger.error`) and return
      a generic message with that id; `rescue_from` in ApplicationController
      is the place to do it once.

  - id: error-message-to-client
    title: "Exception message returned to the client: `{text}`"
    severity: low
    confidence: medium
    dimension: security
    cwe: [CWE-209, CWE-200]
    controls: [NIST-800-53r5:SI-11, OWASP-ASVS:7.4.1]
    tags: [error-handling, information-exposure]
    # `e.message` in a response sink, where `e`
    # is the variable of a catch-all handler in the same method or block:
    # `rescue => e`, `rescue StandardError, Exception => e`, or
    # `rescue_from StandardError do |e|`. A backreference ties the rescued
    # variable to a `.message` in the handler. A handler for a specific class
    # (`rescue ActiveRecord::RecordInvalid => e`) is not reported: its
    # message is usually written for the user. A sink that also returns
    # the backtrace is error-backtrace-to-client's.
    query: |
      ((rescue (exception_variable) (then (call !receiver method: (identifier) @m (#match? @m "^(render|halt|body|json|error!|respond_with)$")
          arguments: (argument_list) @a) @hit)) @r
        (#match? @a "\\b\\w+\\.message\\b")
        (#match? @r "(?s)^rescue(\\s+(::)?(StandardError|Exception)(\\s*,\\s*(::)?(StandardError|Exception))*)?\\s*=>\\s*(?P<v>\\w+)\\b.*\\b(?P=v)\\.message\\b")
        (#not-match? @a "\\.(backtrace|full_message|backtrace_locations)\\b"))
      ((call !receiver method: (identifier) @rf (#eq? @rf "rescue_from")
         arguments: (argument_list . (_) @c (#match? @c "^(::)?(StandardError|Exception)$"))
         block: [(do_block body: (body_statement (call !receiver method: (identifier) @m (#match? @m "^(render|halt|body|json|error!|respond_with)$")
                                                  arguments: (argument_list) @a) @hit))
                 (block body: (block_body (call !receiver method: (identifier) @m (#match? @m "^(render|halt|body|json|error!|respond_with)$")
                                            arguments: (argument_list) @a) @hit))] @blk)
        (#match? @a "\\b\\w+\\.message\\b")
        (#match? @blk "(?s)^(do|\\{)\\s*\\|(?P<v>\\w+)\\|.*\\b(?P=v)\\.message\\b")
        (#not-match? @a "\\.(backtrace|full_message|backtrace_locations)\\b"))
    description: >-
      A catch-all handler hands whatever exception it caught back to the
      client. For a database, file or network error that text carries table
      and column names, paths, host names and sometimes the offending input,
      none of which was meant to leave the server.
    remediation: >-
      Return a fixed message (and an incident id you log alongside the
      exception); keep `e.message` for errors you raised for the user, and
      rescue those by their own class.

  # --- CWE Top 25 round 2 (ARB-062): request values reaching a sink --------
  # Same-method source to sink. The source is `params[...]`,
  # `params.require/fetch/dig(...)` or `request.params/query_parameters/...`,
  # written in the sink call or assigned to a local that a later sibling
  # statement passes to the sink (matched zero to five levels below it and
  # tied with #eq?). A value through `.to_i`, `Integer()` or `File.basename`
  # is not reported.

  - id: path-traversal-request
    title: "File path built from a request parameter: `{text}`"
    severity: high
    confidence: medium
    dimension: security
    cwe: [CWE-22]
    controls: [NIST-800-218:PW.5, NIST-800-53r5:SI-10]
    tags: [path-traversal, injection, rails]
    # A `.join` receiver is File, Rails.root, a Pathname, or a
    # *_DIR/*_ROOT/*_PATH constant or *_dir/_root/_path local (not an
    # Array). An upload's original_filename is upload-client-filename's.
    query: |
      ; send_file File.join(DIR, params[:name]), File.read(params[:path]), Rails.root.join("x", params[:f])
      ((call receiver: (_) @r method: (identifier) @m arguments: (argument_list) @a) @hit (#eq? @m "join") (#match? @r "^(?:::)?File$|^Rails\\.root$|^Pathname\\b|^[A-Z][A-Z0-9_]*(?:DIR|ROOT|PATH|PATHS|FOLDER)$|(?:_dir|_root|_path|_folder|^dir|^root|^base|^folder)$") (#match? @a "\\bparams\\s*(?:\\[|\\.(?:require|fetch|dig|values_at)\\b)|\\brequest\\.(?:params|query_parameters|request_parameters|GET|POST|query_string)\\b") (#not-match? @a "\\.original_filename\\b|\\[\\s*(?::filename|[\"']filename[\"'])\\s*\\]|\\.to_i\\b|Integer\\("))
      ((call receiver: (_) @r method: (identifier) @m arguments: (argument_list . (_) @a)) @hit (#match? @r "^(?:::)?(?:File|IO)$") (#match? @m "^(?:read|binread|readlines|foreach|open|new|delete|unlink|write|binwrite)$") (#match? @a "\\bparams\\s*(?:\\[|\\.(?:require|fetch|dig|values_at)\\b)|\\brequest\\.(?:params|query_parameters|request_parameters|GET|POST|query_string)\\b") (#not-match? @a "\\.join\\b") (#not-match? @a "\\.original_filename\\b|\\[\\s*(?::filename|[\"']filename[\"'])\\s*\\]|\\.to_i\\b|Integer\\("))
      ((call receiver: (_) @r method: (identifier) @m arguments: (argument_list . (_) @a)) @hit (#match? @r "^(::)?FileUtils$") (#match? @m "^(?:rm|rm_f|rm_r|rm_rf|remove|remove_file|cp|mv|copy|move)$") (#match? @a "\\bparams\\s*(?:\\[|\\.(?:require|fetch|dig|values_at)\\b)|\\brequest\\.(?:params|query_parameters|request_parameters|GET|POST|query_string)\\b") (#not-match? @a "\\.join\\b") (#not-match? @a "\\.original_filename\\b|\\[\\s*(?::filename|[\"']filename[\"'])\\s*\\]|\\.to_i\\b|Integer\\("))
      ((call !receiver method: (identifier) @m arguments: (argument_list . (_) @a)) @hit (#eq? @m "send_file") (#match? @a "\\bparams\\s*(?:\\[|\\.(?:require|fetch|dig|values_at)\\b)|\\brequest\\.(?:params|query_parameters|request_parameters|GET|POST|query_string)\\b") (#not-match? @a "\\.join\\b") (#not-match? @a "\\.original_filename\\b|\\[\\s*(?::filename|[\"']filename[\"'])\\s*\\]|\\.to_i\\b|Integer\\("))
      ((call !receiver method: (identifier) @m arguments: (argument_list (pair key: (hash_key_symbol) @k value: (_) @a))) @hit (#eq? @m "render") (#eq? @k "file") (#match? @a "\\bparams\\s*(?:\\[|\\.(?:require|fetch|dig|values_at)\\b)|\\brequest\\.(?:params|query_parameters|request_parameters|GET|POST|query_string)\\b"))
      ; name = params[:name] ... File.join(DIR, name), at up to five levels below the assignment's sibling
