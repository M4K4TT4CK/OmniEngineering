         (#match? @n "^(encodeForHTML|htmlEscape|escapeHtml\\w*|getString)$"))
      types:
        e: "(^|\\|)\\s*(java\\.lang\\.)?(Exception|RuntimeException|Throwable|Error|IOException|SQLException|\\w*SQL\\w*Exception|\\w*DataAccessException|NullPointerException|PersistenceException|HibernateException|NamingException|ReflectiveOperationException)\\s*($|\\|)"

  # ------------------------------------------------- CWE Top 25, round 2 --
  # ARB-062: the Java gaps left after round 1 (docs/cwe-top25.md): 79, 918,
  # 77/88, 190 and a native 434. Each is the same-method form: a value bound
  # from the request (`@RequestParam`, `@PathVariable`, JAX-RS `@QueryParam`
  # and friends, or `String x = request.getParameter(...)`) reaching the sink
  # in the method that binds it. The regexes are long because one
  # `#match?` on the whole method is the only way to tie the bound name to
  # its use at any nesting depth; a back-reference (\1 / \2) does the tying.

  - id: xss-unescaped-html
    requirements: [ARB-062]
    title: "Request value written into HTML without encoding: `{text}`"
    severity: high
    confidence: medium
    dimension: security
    cwe: [CWE-79]
    controls: [NIST-800-218:PW.5]
    tags: [injection, xss]
    query: |
      ; Spring: return "<h1>" + q + "</h1>";  ResponseEntity.ok(...).body("<p>" + name)
      ((return_statement (binary_expression) @v) @hit
        (#match? @v "\"[^\"\\n]*<(?:[a-zA-Z][\\w-]*|/[a-zA-Z])[^\"\\n]*\""))
      ((method_invocation name: (identifier) @n arguments: (argument_list . (binary_expression) @v .)) @hit
        (#match? @n "^(ok|body|bodyValue|send|write|append)$")
        (#match? @v "\"[^\"\\n]*<(?:[a-zA-Z][\\w-]*|/[a-zA-Z])[^\"\\n]*\""))
      ; servlet: response.getWriter().println(<non-constant>)
      ((method_invocation object: (method_invocation name: (identifier) @w)
          name: (identifier) @n arguments: (argument_list) @args) @hit
        (#eq? @w "getWriter") (#match? @n "^(print|println|write|append|printf|format)$")
        (#not-match? @args "^\\((?:\\s|,|\\+|\"(?:[^\"\\\\\\n]|\\\\.)*\"|'(?:[^'\\\\]|\\\\.)'|(?:[\\w.]*\\.)?[A-Z][A-Z0-9_]*\\b|\\d+|(?:java\\.util\\.)?Locale\\.[A-Z]+|true|false|null)*\\)$"))
      ; PrintWriter out = response.getWriter(); out.println(<non-constant>)
      ((method_invocation object: (identifier) @o name: (identifier) @n arguments: (argument_list) @args) @hit
        (#match? @o "^(out|writer|pw|printWriter|respWriter|responseWriter)$")
        (#match? @n "^(print|println|write|append|printf|format)$")
        (#not-match? @args "^\\((?:\\s|,|\\+|\"(?:[^\"\\\\\\n]|\\\\.)*\"|'(?:[^'\\\\]|\\\\.)'|(?:[\\w.]*\\.)?[A-Z][A-Z0-9_]*\\b|\\d+|(?:java\\.util\\.)?Locale\\.[A-Z]+|true|false|null)*\\)$"))
    # The Spring forms need the bound parameter itself spliced next to an
    # HTML literal; the servlet forms need a request read and an HTML page
    # (text/html content type or an HTML literal) in the same method.
    requires_in_scope: |
      ((method_declaration) @m (#match? @m "(?s)@(?:RequestParam|PathVariable|RequestHeader|CookieValue|MatrixVariable|QueryParam|PathParam|FormParam|HeaderParam|CookieParam)\\b(?:\\s*\\((?:[^()\"]|\"(?:[^\"\\\\\\n]|\\\\.)*\")*\\))?\\s+(?:final\\s+)?(?:@\\w+(?:\\([^()]*\\))?\\s+)*(?:java\\.lang\\.)?(?:String|String\\s*\\[\\s*\\]|(?:List|Optional|Set|Collection)\\s*<\\s*String\\s*>)\\s+(\\w+).*(?:\"[^\"\\n]*<(?:[a-zA-Z][\\w-]*|/[a-zA-Z])[^\"\\n]*\"[^;]*\\+\\s*\\1\\b(?!\\s*\\.\\s*(?:length|size|isEmpty|isBlank|hashCode|equals\\w*|compareTo\\w*|matches|startsWith|endsWith|contains|indexOf)\\s*\\()|\\b\\1\\s*\\+[^;]*\"[^\"\\n]*<(?:[a-zA-Z][\\w-]*|/[a-zA-Z])[^\"\\n]*\")"))
      ((method_declaration) @m (#match? @m "(?s)^(?=.*getWriter\\s*\\()(?=.*\\b(?:getParameter|getParameterValues|getParameterMap|getParameterNames|getHeader|getHeaders|getQueryString|getCookies|getPathInfo|getRequestURI|getRequestURL)\\s*\\()(?=.*(?:setContentType\\s*\\(\\s*\"text/html|\"[^\"\\n]*<(?:[a-zA-Z][\\w-]*|/[a-zA-Z])[^\"\\n]*\"))"))
    # An HTML encoder applied anywhere in the file: in the method, or in a
    # helper the value passes through (`bar = new Test().doSomething(param)`
    # whose body is `HtmlUtils.htmlEscape(param)`, OWASP Benchmark), which a
    # method-scoped check cannot follow. Test support is skipped too.
    unless_in_file: |
      ((program) @p (#match? @p "\\b(?:htmlEscape\\w*|escapeHtml\\w*|escapeXml\\w*|encodeForHTML\\w*|encodeForXML\\w*|forHtml\\w*|forXml\\w*|htmlEncode\\w*|encodeHtml\\w*|sanitize\\w*|HTMLFilter\\.filter|htmlElementContent|escapeHTML|Jsoup\\.clean|HtmlUtils\\.\\w+|Encode\\.for\\w+)\\s*\\("))
      ((import_declaration) @i
        (#match? @i "\\b(org\\.junit|junit\\.framework|org\\.testng|org\\.assertj|org\\.hamcrest|org\\.mockito|com\\.google\\.common\\.truth|com\\.google\\.common\\.testing|org\\.openjdk\\.jmh|com\\.code_intelligence\\.jazzer)\\."))
    description: >
      A value from the request is concatenated into an HTML response with
      no encoding, so `<script>` in a parameter runs in the victim's
      browser under this site's origin: session theft, actions as the user.
    remediation: >
      Render through a template engine that escapes by default (Thymeleaf
      `th:text`, JSP `<c:out>`), or encode every value with
      `HtmlUtils.htmlEscape` / OWASP `Encode.forHtml` before writing it.
      Return JSON from APIs instead of hand-built HTML.
    # One-hop data flow (Milestone 3): request input reaches the response
    # through a local or a same-file helper as a built string; a hit whose
    # values are provably constant (or derived only from constants in a
    # method that reads request input) is dropped.
    taint:
      inputs: *java_request_inputs
      sinks: |
        ((method_invocation name: (identifier) @n arguments: (argument_list . (_) @sink .)) @hit
         (#match? @n "^(ok|body|bodyValue|send)$"))
        ((method_invocation object: (method_invocation name: (identifier) @w)
            name: (identifier) @n arguments: (argument_list (_) @sink)) @hit
         (#eq? @w "getWriter") (#match? @n "^(print|println|write|append|printf|format)$"))
        ((return_statement (_) @sink) @hit)
      types: *java_request_types
      value: [v, args]
      kill: derived
      built: true
      requires: true

  - id: ssrf-request-url
    requirements: [ARB-062]
    title: "Server-side request to a URL taken from the request: `{text}`"
    severity: high
    confidence: medium
    dimension: security
    cwe: [CWE-918]
    controls: [NIST-800-218:PW.5]
    tags: [injection, ssrf]
    query: |
      ; new URL(u)  new URI(u)  new HttpGet(u)
      ((object_creation_expression type: (_) @t arguments: (argument_list . (_) @a)) @hit
        (#match? @t "^((java\\.net\\.)?(URL|URI)|Http(Get|Post|Put|Delete|Head|Patch|Options))$")
        (#match? @a "^(?:[a-z_]\\w*\\s*(?:\\+.*)?|\"(?:https?|ftp|gopher|file)?:?//\"\\s*\\+\\s*[a-z_].*)$"))
      ; URI.create(u)  Jsoup.connect(u)
      ((method_invocation object: (identifier) @o name: (identifier) @n arguments: (argument_list . (_) @a)) @hit
        (#match? @o "^(URI|Jsoup)$") (#match? @n "^(create|connect)$")
        (#match? @a "^(?:[a-z_]\\w*\\s*(?:\\+.*)?|\"(?:https?|ftp|gopher|file)?:?//\"\\s*\\+\\s*[a-z_].*)$"))
      ; RestTemplate / WebClient / OkHttp builders: rest.getForObject(u, ...)  .uri(u)  .url(u)
      ((method_invocation name: (identifier) @n arguments: (argument_list . (_) @a)) @hit
        (#match? @n "^(getForObject|getForEntity|postForObject|postForEntity|postForLocation|patchForObject|headForHeaders|exchange|uri|url)$")
        (#match? @a "^(?:[a-z_]\\w*\\s*(?:\\+.*)?|\"(?:https?|ftp|gopher|file)?:?//\"\\s*\\+\\s*[a-z_].*)$"))
    # The bound parameter itself (or "http://" + it) is the sink's URL, and
    # the method makes a request (a bare `URI.create` only parses).
    requires_in_scope: |
      ((method_declaration) @m (#match? @m "(?s)(?:@(?:RequestParam|PathVariable|RequestHeader|CookieValue|MatrixVariable|QueryParam|PathParam|FormParam|HeaderParam|CookieParam)\\b(?:\\s*\\((?:[^()\"]|\"(?:[^\"\\\\\\n]|\\\\.)*\")*\\))?\\s+(?:final\\s+)?(?:@\\w+(?:\\([^()]*\\))?\\s+)*(?:java\\.lang\\.)?(?:String|String\\s*\\[\\s*\\]|(?:List|Optional|Set|Collection)\\s*<\\s*String\\s*>)\\s+(\\w+)|\\bString\\s+(\\w+)\\s*=\\s*(?:\\w+\\.)*(?:getParameter|getHeader|getQueryString|getPathInfo|getRequestURI|getRequestURL)\\s*\\().*(?:\\bnew\\s+(?:java\\.net\\.)?(?:URL|URI)|\\bnew\\s+Http(?:Get|Post|Put|Delete|Head|Patch|Options)|\\bURI\\.create|\\bJsoup\\.connect|\\.(?:getForObject|getForEntity|postForObject|postForEntity|postForLocation|patchForObject|headForHeaders|exchange|uri|url))\\s*\\(\\s*(?:\"(?:https?|ftp|gopher|file)?:?//\"\\s*\\+\\s*)?(?:\\1|\\2)\\b(?!\\s*[.(\\[])") (#match? @m "(?s)\\.(?:send|sendAsync|openConnection|openStream|execute|executeOpen|retrieve|exchange|exchangeToMono|getForObject|getForEntity|postForObject|postForEntity|postForLocation|patchForObject|headForHeaders|newCall|getContent|get|post)\\s*\\(|\\bJsoup\\.connect\\s*\\(|\\bnew\\s+Http(?:Get|Post|Put|Delete|Head|Patch|Options)\\s*\\("))
    unless_in_scope: |
      ; the host is read back and checked, or an allowlist is consulted
      ((method_declaration) @m (#match? @m "\\.getHost\\s*\\(\\s*\\)|\\.getAuthority\\s*\\(\\s*\\)|(?i:allow(?:ed)?_?(?:hosts?|list|domains?|urls?)|white_?list|safe_?(?:hosts?|domains?))|\\bisAllowed\\w*\\s*\\(|\\bvalidate\\w*(?:Url|Uri|Host)\\w*\\s*\\(|\\bcheck\\w*(?:Url|Uri|Host)\\w*\\s*\\("))
    unless_in_file: *test_support
    description: >
      The server makes a request to a URL its caller chose. The caller
      reaches what only the server can: cloud metadata
      (169.254.169.254), admin consoles and databases on the internal
      network, `file:` URLs.
    remediation: >
      Do not take a URL from the caller. Take an id and look the URL up, or
      parse it, require https and check the host against an allowlist
      (resolve it and refuse private ranges), and turn redirects off.
    # One-hop data flow (Milestone 3): request input reaches the URL through
    # a local or a helper. A URL with a fixed scheme and host is the
    # sanitizer.
    taint:
      inputs: *java_request_inputs
      sinks: |
        ((object_creation_expression type: (_) @t arguments: (argument_list . (_) @sink)) @hit
         (#match? @t "^((java\\.net\\.)?URL|Http(Get|Post|Put|Delete|Head|Patch|Options))$"))
        ((method_invocation object: (identifier) @o name: (identifier) @n arguments: (argument_list . (_) @sink)) @hit
         (#match? @o "^(Jsoup|HttpRequest)$") (#match? @n "^(connect|newBuilder)$"))
        ((method_invocation name: (identifier) @n arguments: (argument_list . (_) @sink)) @hit
         (#match? @n "^(getForObject|getForEntity|postForObject|postForEntity|postForLocation|patchForObject|headForHeaders|exchange|uri|url)$"))
