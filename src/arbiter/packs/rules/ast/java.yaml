    unless_in_file: *test_support
    description: >
      The text of a generic or library exception was written for the
      developer: a SQL error quotes the table and column, an IOException
      the file path, a connection error the internal host. Sent to the
      client, it maps the system behind the endpoint.
    remediation: >
      Log the exception with an incident id and return a fixed message. Put
      caller-facing text in your own exception types and return only those.
    # One-hop data flow (Milestone 3): a broad exception's message reaches
    # the response through a local or a helper.
    taint:
      inputs: |
        ((method_invocation object: (identifier) @e name: (identifier) @m arguments: (argument_list) @none) @input
