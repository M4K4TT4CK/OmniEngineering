        (#match? @t "(^|\\|)\\s*(java\\.lang\\.)?(Exception|RuntimeException|Throwable|Error|IOException|SQLException|\\w*SQL\\w*Exception|\\w*DataAccessException|NullPointerException|PersistenceException|HibernateException|NamingException|ReflectiveOperationException)\\s*($|\\|)")
        (#match? @c "(?s)^catch\\s*\\([^)]*?(\\w+)\\s*\\)\\s*\\{.*\\b\\1\\.(getMessage|getLocalizedMessage|toString)\\s*\\(")
        (#match? @hit "(?s)^(new\\s+ResponseEntity\\b|.*\\b(body|bodyValue|ok|sendError|forStatusAndDetail|setDetail)\\s*\\(|.*\\b(getWriter|getOutputStream)\\s*\\(\\s*\\)\\s*\\.\\s*(print|println|write|append|printf|format)\\s*\\()")
