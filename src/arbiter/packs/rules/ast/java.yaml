  # -------------------------------------------------------------- CSRF ----
  # Spring Security's CSRF protection only matters when the browser sends
  # the credential by itself: a session cookie. A stateless API that reads a
  # bearer token from the Authorization header is not CSRF-able, and
  # switching the filter off there is the documented set-up. So the same
  # call is two findings: high severity, medium confidence where nothing in
  # the file says the app is stateless, and low/low where the file declares
  # SessionCreationPolicy.STATELESS (the token could still sit in a cookie).
  - id: csrf-disabled
    requirements: [ARB-062]
    title: "CSRF protection switched off: `{text}`"
    severity: high
    confidence: medium
    dimension: security
    cwe: [CWE-352]
    controls: [NIST-800-218:PW.5]
    tags: [csrf, spring]
    query: &csrf_disabled |
      ; @hit is the part that says "off", so two forms in one file stay two
      ; findings (the fingerprint is the hit text, not the line).
      ; http.csrf().disable()
      ((method_invocation object: (method_invocation name: (identifier) @c arguments: (argument_list) @a)
        name: (identifier) @hit)
        (#eq? @c "csrf") (#match? @a "^\\(\\s*\\)$") (#eq? @hit "disable"))
      ; http.csrf(c -> c.disable())   http.csrf(c -> { c.disable(); })
      (method_invocation name: (identifier) @c
        arguments: (argument_list . (lambda_expression body: (method_invocation name: (identifier) @n)) .) @hit
        (#eq? @c "csrf") (#eq? @n "disable"))
      (method_invocation name: (identifier) @c
        arguments: (argument_list . (lambda_expression body: (block . (expression_statement (method_invocation name: (identifier) @n)) .)) .) @hit
        (#eq? @c "csrf") (#eq? @n "disable"))
      ; http.csrf(AbstractHttpConfigurer::disable)  csrf(CsrfConfigurer::disable)
      (method_invocation name: (identifier) @c
        arguments: (argument_list . (method_reference) @hit .)
        (#eq? @c "csrf") (#match? @hit "::\\s*disable$"))
    requires_file: &spring_security |
      ((program) @p (#match? @p "\\borg\\.springframework\\.security\\b|\\bHttpSecurity\\b|\\bServerHttpSecurity\\b"))
    unless_in_file: &stateless |
      ((identifier) @s (#eq? @s "STATELESS"))
      ((import_declaration) @i
        (#match? @i "\\b(org\\.junit|junit\\.framework|org\\.testng|org\\.assertj|org\\.hamcrest|org\\.mockito|com\\.google\\.common\\.truth|com\\.google\\.common\\.testing|org\\.openjdk\\.jmh|com\\.code_intelligence\\.jazzer)\\."))
    description: >
      With the CSRF filter off, any page the user visits can submit a form or
      `fetch` to this app, and the browser attaches the session cookie: the
      transfer, password change or delete runs as the user. Turning it off is
      the usual quick fix for a 403 on POST.
    remediation: >
      Keep CSRF on. For a JavaScript client use
      `csrf(c -> c.csrfTokenRepository(CookieCsrfTokenRepository.withHttpOnlyFalse()))`;
      exempt only machine-to-machine paths with `ignoringRequestMatchers`.
      If the API really is stateless (bearer token in a header, no session
      cookie), declare `SessionCreationPolicy.STATELESS`.

  - id: csrf-disabled-stateless
    requirements: [ARB-062]
    title: "CSRF protection switched off in a stateless config: `{text}`"
    severity: low
    confidence: low
    dimension: security
    cwe: [CWE-352]
    controls: [NIST-800-218:PW.5]
    tags: [csrf, spring]
    query: *csrf_disabled
    requires_file: |
      ((program) @p
        (#match? @p "\\borg\\.springframework\\.security\\b|\\bHttpSecurity\\b|\\bServerHttpSecurity\\b")
        (#match? @p "\\bSTATELESS\\b"))
    unless_in_file: *test_support
    description: >
      The file declares `SessionCreationPolicy.STATELESS`, which is how an
      API that authenticates every request with a bearer header is set up,
      and CSRF does not apply to it. It does apply if the token is kept in a
      cookie, which browsers send cross-site like a session.
    remediation: >
      Confirm the token arrives only in the `Authorization` header. If it is
      in a cookie, keep CSRF on or make the cookie `SameSite=Strict`.

  # ------------------------------------------------ error detail (CWE-200) --
  - id: stack-trace-to-client
    requirements: [ARB-062]
    title: "Stack trace sent to the client: `{text}`"
    severity: medium
    confidence: high
    dimension: security
    cwe: [CWE-209, CWE-200]
    controls: [NIST-800-218:PW.5]
    tags: [error-handling, information-exposure]
    query: |
      ; e.printStackTrace(response.getWriter())
      ((method_invocation name: (identifier) @n arguments: (argument_list . (_) @a .)) @hit
        (#eq? @n "printStackTrace") (#match? @a "\\b(getWriter|getOutputStream)\\s*\\(\\s*\\)"))
      ; a response sink holding a trace: getStackTrace(), a StringWriter the
      ; trace was printed into, ExceptionUtils/Throwables helpers
      ((method_invocation name: (identifier) @n) @hit
        (#match? @n "^(body|bodyValue|ok|sendError|forStatusAndDetail|setDetail)$")
        (#match? @hit "(?s)\\((.*)(getStackTrace|StackTraceAsString|\\b\\w+\\.toString\\s*\\(\\s*\\))"))
      ((method_invocation object: (method_invocation name: (identifier) @w) name: (identifier) @n) @hit
        (#match? @w "^(getWriter|getOutputStream)$") (#match? @n "^(print|println|write|append|printf|format)$")
        (#match? @hit "(?s)(getStackTrace|StackTraceAsString|\\b\\w+\\.toString\\s*\\(\\s*\\))"))
      ((object_creation_expression type: (_) @t) @hit
        (#match? @t "^ResponseEntity\\b")
        (#match? @hit "(?s)(getStackTrace|StackTraceAsString|\\b\\w+\\.toString\\s*\\(\\s*\\))"))
    # The method must actually hold a trace: printed into the response, read
    # with getStackTrace(), or printed into a StringWriter whose text is used.
    # Hits in a lambda are skipped (the lambda is their scope): the
    # exception there is a parameter this rule cannot see.
    unless_in_scope: |
      ((method_declaration) @m
