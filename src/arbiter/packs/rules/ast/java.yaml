         (#eq? @n "command"))
      where:
        tool: "^\"(/usr/bin/|/bin/)?(git|hg|svn|curl|wget|ssh|scp|sftp|rsync|tar|zip|unzip|7z|find|xargs|grep|sed|docker|kubectl|helm|ffmpeg|convert|magick|gs|psql|mysql|mysqldump|pg_dump|openssl|gpg|sendmail|mail|tcpdump|nmap|ping|wkhtmltopdf)\"$"
      types: *java_request_types
      unless_element: "^--$"

  - id: parsed-number-narrowed
    requirements: [ARB-062]
    title: "Parsed number cast to a narrower type keeps only its low bits: `{text}`"
    severity: medium
    confidence: medium
    dimension: security
    cwe: [CWE-190, CWE-197]
    controls: [NIST-800-218:PW.5]
    tags: [integer-overflow]
    query: |
      ; (byte) Integer.parseInt(s)   (short) Integer.parseInt(s)   (int) Long.parseLong(s)
      ; A radix argument is the hex-byte idiom ("ff" -> (byte) 255) and is not reported.
      ((cast_expression type: (integral_type) @ty
          value: (method_invocation object: (_) @c name: (identifier) @m arguments: (argument_list . (_) .))) @hit
        (#match? @ty "^(byte|short)$") (#match? @c "^(java\\.lang\\.)?Integer$") (#eq? @m "parseInt"))
      ((cast_expression type: (integral_type) @ty
          value: (method_invocation object: (_) @c name: (identifier) @m arguments: (argument_list . (_) .))) @hit
        (#match? @ty "^(byte|short|int)$") (#match? @c "^(java\\.lang\\.)?Long$") (#eq? @m "parseLong"))
    # Number.intValue()/shortValue()/byteValue() narrow by contract (gson's
    # LazilyParsedNumber), and `buf[i] = (byte) Integer.parseInt(...)` fills a
    # byte array with 0-255 values on purpose (tomcat's drawboard colours).
    unless_inside: |
      ((method_declaration name: (identifier) @n) @m (#match? @n "^(intValue|shortValue|byteValue)$"))
      ((assignment_expression left: (array_access) right: (cast_expression type: (integral_type) @ty)) @a
        (#eq? @ty "byte"))
    unless_in_file: *test_support
    description: >
      A number parsed from text is cast to a narrower type, which silently
      keeps only the low bits: "300" as a byte is 44, "3000000000" as an
      int is negative. A limit, a port or a timeout read from input becomes
      a different, valid-looking value instead of an error.
    remediation: >
      Parse straight into the type you need (`Byte.parseByte`,
      `Short.parseShort`, `Integer.parseInt`), or convert with
      `Math.toIntExact`, so an out-of-range value throws.

  - id: parsed-count-overflow
    requirements: [ARB-062]
    title: "Allocation size multiplies a parsed count with no range check: `{text}`"
    severity: medium
    confidence: medium
    dimension: security
    cwe: [CWE-190]
    controls: [NIST-800-218:PW.5]
    tags: [integer-overflow]
    query: |
      ; new byte[count * SIZE]   ByteBuffer.allocate(n * k)
      ((array_creation_expression dimensions: (dimensions_expr (binary_expression operator: "*"))) @hit)
      ((array_creation_expression dimensions: (dimensions_expr (parenthesized_expression (binary_expression operator: "*")))) @hit)
      ((method_invocation name: (identifier) @n arguments: (argument_list . (binary_expression operator: "*") .)) @hit
        (#match? @n "^(allocate|allocateDirect)$"))
    # The multiplied count is parsed in this method (`int n = Integer.parseInt(...)`)
    # and never compared, clamped or checked before the multiply.
    requires_in_scope: |
      ((method_declaration) @m (#match? @m "(?s)\\b(?:int|long|var|Integer|Long)\\s+(\\w+)\\s*=\\s*(?:Integer\\.(?:parseInt|valueOf)|Long\\.(?:parseLong|valueOf)|Short\\.parseShort)\\s*\\(.*(?:\\bnew\\s+[\\w.]+\\s*\\[|\\ballocate(?:Direct)?\\s*\\()[^;\\]]*(?:\\b\\1\\s*\\*|\\*\\s*\\(?\\s*\\1\\b)"))
    unless_in_scope: |
      ((method_declaration) @m (#match? @m "(?s)\\b(?:int|long|var|Integer|Long)\\s+(\\w+)\\s*=\\s*(?:Integer\\.(?:parseInt|valueOf)|Long\\.(?:parseLong|valueOf)|Short\\.parseShort)\\s*\\(.*(?:\\b\\1\\s*(?:<=?|>=?)(?!<)|(?<![<>])(?:<=?|>=?)\\s*\\1\\b|Math\\.(?:min|max|clamp|multiplyExact|addExact|toIntExact)\\s*\\([^;]*\\b\\1\\b|checkIndex\\s*\\([^;]*\\b\\1\\b|checkArgument\\s*\\([^;]*\\b\\1\\b|Preconditions\\.\\w+\\s*\\([^;]*\\b\\1\\b)"))
    unless_in_file: *test_support
    description: >
      A count parsed from input is multiplied into an allocation size. Past
      `Integer.MAX_VALUE` the product wraps negative (an exception at best)
      or to a small positive number, so the buffer is far smaller than the
      count the rest of the code loops over.
    remediation: >
      Range-check the count before using it (`if (n < 0 || n > MAX)`), or
      compute the size with `Math.multiplyExact`.

  - id: upload-client-filename
    requirements: [ARB-062]
    title: "Upload stored under the client's file name: `{text}`"
    severity: high
    confidence: medium
    dimension: security
    cwe: [CWE-434]
    controls: [NIST-800-218:PW.5]
    tags: [upload, path]
    query: |
      ; file.transferTo(...)  Files.copy(in, ...)  dir.resolve(name)  Paths.get(dir, name)
      ; new File(dir, name)  new FileOutputStream(...): naming the client's file name
      ((method_invocation name: (identifier) @n) @hit
        (#match? @n "^(transferTo|resolve)$")
        (#match? @hit "(?s)\\((.*)(?:getOriginalFilename|getSubmittedFileName|(?<![\\w.])(?:[a-z]\\w*(?:File|Original|Upload|Submitted|Client)[Nn]ame|(?:file|original|upload|submitted|client)_?[Nn]ame|filename|fname|name)\\b(?!\\s*\\())"))
      ((method_invocation object: (_) @o name: (identifier) @n) @hit
        (#match? @o "^((java\\.nio\\.file\\.)?(Files|Paths|Path)|(org\\.apache\\.commons\\.io\\.)?FileUtils|FileCopyUtils)$")
        (#match? @n "^(copy|write|move|newOutputStream|createFile|get|of|copyInputStreamToFile|writeByteArrayToFile|copyToFile)$")
        (#match? @hit "(?s)\\((.*)(?:getOriginalFilename|getSubmittedFileName|(?<![\\w.])(?:[a-z]\\w*(?:File|Original|Upload|Submitted|Client)[Nn]ame|(?:file|original|upload|submitted|client)_?[Nn]ame|filename|fname|name)\\b(?!\\s*\\())"))
      ((object_creation_expression type: (_) @t) @hit
        (#match? @t "^((java\\.io\\.)?(File|FileOutputStream|FileWriter))$")
        (#match? @hit "(?s)\\((.*)(?:getOriginalFilename|getSubmittedFileName|(?<![\\w.])(?:[a-z]\\w*(?:File|Original|Upload|Submitted|Client)[Nn]ame|(?:file|original|upload|submitted|client)_?[Nn]ame|filename|fname|name)\\b(?!\\s*\\())"))
    # One finding per statement: a sink nested in another sink's arguments
    # (`transferTo(new File(dir, name))`) is the same write.
    unless_inside: |
      (method_invocation name: (identifier) @n arguments: (argument_list) @in
        (#match? @n "^(transferTo|resolve|copy|write|move|newOutputStream|createFile|get|of|copyInputStreamToFile|writeByteArrayToFile|copyToFile)$"))
      (object_creation_expression type: (_) @t arguments: (argument_list) @in
        (#match? @t "^((java\\.io\\.)?(File|FileOutputStream|FileWriter))$"))
      ; a path that is only logged (`log.debug("saved to {}", new File(dir, name))`)
      (method_invocation object: (identifier) @o arguments: (argument_list) @in
        (#match? @o "^(log|logger|LOG|LOGGER|Log|Logger)$"))
    requires_in_scope: |
      ((method_declaration) @m (#match? @m "(?s)(?:\\bString\\s+(\\w+)\\s*=\\s*[\\w.]*\\.(?:getOriginalFilename|getSubmittedFileName)\\s*\\(\\s*\\)\\s*;.*(?:transferTo|Files\\.(?:copy|write|move|newOutputStream|createFile)|new\\s+(?:java\\.io\\.)?(?:File|FileOutputStream|FileWriter)|Paths\\.get|Path\\.of|\\.resolve)\\s*\\([^;]*\\b\\1\\b|(?:transferTo|Files\\.(?:copy|write|move|newOutputStream|createFile)|new\\s+(?:java\\.io\\.)?(?:File|FileOutputStream|FileWriter)|Paths\\.get|Path\\.of|\\.resolve)\\s*\\([^;]*\\.(?:getOriginalFilename|getSubmittedFileName)\\s*\\(\\s*\\))") (#match? @m "(?s)\\btransferTo\\s*\\(|\\bFiles\\.(?:copy|write|move|newOutputStream)\\s*\\(|\\bnew\\s+(?:java\\.io\\.)?(?:FileOutputStream|FileWriter)\\s*\\(|\\.write\\s*\\("))
    unless_in_scope: |
      ((method_declaration) @m (#match? @m "(?s)FilenameUtils\\.(?:getName|getExtension|getBaseName)\\s*\\(|\\.getFileName\\s*\\(\\s*\\)|(?i:allowed_?(?:ext|types?|suffix)\\w*|white_?list)|\\.endsWith\\s*\\(|lastIndexOf\\s*\\(\\s*(?:\"\\.\"|'\\.')|\\bgetExtension\\s*\\("))
    unless_in_file: *test_support
    description: >
      The file is written under the name the client sent. `shell.jsp` (or
      `.php`, `.html`, `.svg`) in a served directory runs or renders as this
      site, and `../` in the name writes outside the upload directory.
    remediation: >
      Generate the stored name (`UUID.randomUUID()`), choose the extension
      from an allowlist of content types you checked, store outside the web
      root, and keep the client's name only as data.
    # One-hop data flow (Milestone 3): the client's file name reaches the
    # write through a local or a same-file helper.
    taint:
      inputs: |
        ((method_invocation name: (identifier) @m arguments: (argument_list) @none) @input
         (#match? @m "^(getOriginalFilename|getSubmittedFileName)$") (#eq? @none "()"))
      sinks: |
        ((method_invocation name: (identifier) @n arguments: (argument_list (_) @sink)) @hit
         (#match? @n "^(transferTo|resolve)$"))
        ((method_invocation object: (_) @o name: (identifier) @n arguments: (argument_list (_) @sink)) @hit
         (#match? @o "^((java\\.nio\\.file\\.)?(Files|Paths|Path)|(org\\.apache\\.commons\\.io\\.)?FileUtils|FileCopyUtils)$")
         (#match? @n "^(copy|write|move|newOutputStream|createFile|get|of|copyInputStreamToFile|writeByteArrayToFile|copyToFile)$"))
        ((object_creation_expression type: (_) @t arguments: (argument_list (_) @sink)) @hit
         (#match? @t "^((java\\.io\\.)?(File|FileOutputStream|FileWriter))$"))

  # ---------------------------------------------------------------------
  # Defect classes found in AI-written code (ARB-083)
  # ---------------------------------------------------------------------
  # Each shape below is one a reviewer labelled in model-written services
  # (fixtures/ai-corpus) that no earlier rule covered. All start advisory.
  - id: mail-starttls-not-required
    requirements: [ARB-083]
    title: "`{text}` lets Jakarta Mail fall back to plaintext"
    severity: medium
    confidence: medium
    dimension: security
    cwe: [CWE-319]
    controls: [NIST-800-218:PW.5, NIST-800-53r5:SC-8]
    tags: [tls, smtp, ai-code]
    # `starttls.enable` alone is opportunistic: STARTTLS is used only when
    # the server advertises it, so a MITM that strips the capability gets
    # the AUTH exchange in clear. `starttls.required` (anywhere in the
    # file) or implicit TLS (`mail.smtp.ssl.enable`) makes it mandatory.
    query: |
      (method_invocation
        name: (identifier) @m (#match? @m "^(put|setProperty)$")
        arguments: (argument_list . (string_literal) @k (#match? @k "^\"mail\\.smtps?\\.starttls\\.enable\"$"))) @hit
    unless_in_file: |
      ((string_literal) @k (#match? @k "^\"mail\\.smtps?\\.(starttls\\.required|ssl\\.enable)\"$"))
    description: >-
      With only `mail.smtp.starttls.enable`, Jakarta Mail upgrades to TLS
      when the server offers it and carries on in plaintext when it does
      not. An attacker on the path removes STARTTLS from the server's
      greeting and reads SMTP_USER and SMTP_PASSWORD from the AUTH command.
    remediation: "Also set `mail.smtp.starttls.required=true` (or use implicit TLS with `mail.smtp.ssl.enable=true` on port 465)."

  - id: mail-ssl-trust-all
    requirements: [ARB-083]
    title: "`{text}` trusts every mail server certificate"
    severity: high
    confidence: high
    dimension: security
    cwe: [CWE-295]
    controls: [NIST-800-218:PW.5, NIST-800-53r5:SC-8]
    tags: [tls, smtp, ai-code]
    query: |
      (method_invocation
        name: (identifier) @m (#match? @m "^(put|setProperty)$")
        arguments: (argument_list . (string_literal) @k (#match? @k "^\"mail\\.(smtps?|imaps?|pop3s?)\\.ssl\\.trust\"$")
                   . (string_literal) @v (#eq? @v "\"*\""))) @hit
      (method_invocation
        name: (identifier) @m (#match? @m "^(put|setProperty)$")
        arguments: (argument_list . (string_literal) @k (#match? @k "^\"mail\\.(smtps?|imaps?|pop3s?)\\.ssl\\.checkserveridentity\"$")
                   . (string_literal) @v (#eq? @v "\"false\""))) @hit
    # JavaMail reads `ssl.trust` only when no socket factory is given: with
    # `ssl.socketFactory` set in the same method (Keycloak's truststore
    # configurator) the factory's own trust store decides.
    unless_in_scope: |
      ((string_literal) @k (#match? @k "^\"mail\\.(smtps?|imaps?|pop3s?)\\.ssl\\.socketFactory\"$"))
    description: >-
      `mail.smtp.ssl.trust=*` accepts any certificate from any host, and
      `ssl.checkserveridentity=false` accepts a valid certificate issued
      for some other host. Either way the connection is encrypted to
      whoever answers, and the SMTP credentials go to them.
    remediation: "Remove the property; for a private CA, add it to the trust store or name the exact host in `mail.smtp.ssl.trust`."

  - id: retry-constant-delay
    requirements: [ARB-083]
    title: "`{text}` retries after the same fixed delay every time"
    severity: low
    confidence: medium
    dimension: quality
    cwe: [CWE-400]
    controls: [NIST-800-218:PW.5]
    tags: [retry, backoff, reliability, ai-code]
    # Retry scheduling with a constant: the wait is a value named as the
    # retry delay (`retryDelayMs`) used as is, in a file that caps attempts,
    # with no growth or jitter on it. retry-without-backoff is the no-delay case.
    query: |
      ((method_invocation object: (_) @o name: (identifier) @m
         arguments: (argument_list . [(identifier) (field_access)] @d .))
        (#match? @o "^(Thread|TimeUnit\\.\\w+)$") (#eq? @m "sleep")
        (#match? @d "(?i)(^|\\.)retry_?(delay|interval|wait|pause|sleep|backoff)(_?(ms|millis|seconds|secs))?$")) @hit
      ((method_invocation name: (identifier) @m
         arguments: (argument_list . (_) . [(identifier) (field_access)] @d . (_) .))
        (#match? @m "^(schedule|delayedExecutor)$")
        (#match? @d "(?i)(^|\\.)retry_?(delay|interval|wait|pause|backoff)(_?(ms|millis|seconds|secs))?$")) @hit
    requires_file: |
      ((identifier) @r (#match? @r "(?i)^_?max_?(retries|retry|attempts?|tries)$|^_?retry_?(count|limit)$|^MAX_(RETRIES|ATTEMPTS|TRIES)$"))
    unless_in_file: |
      ((identifier) @b (#match? @b "(?i)backoff|jitter"))
      ((binary_expression operator: ["*" "<<"]) @b (#match? @b "(?i)retry_?(delay|interval)"))
      ((assignment_expression left: (_) @l operator: ["*=" "<<="]) (#match? @l "(?i)retry_?(delay|interval)"))
    description: >-
      Every retry waits the same interval. When a dependency fails, every
      caller retries in lock-step on that interval, so the recovering
      service is hit by the whole backlog at once and each retry is as
      likely to fail as the last.
    remediation: "Grow the delay with the attempt (`base << attempt`, capped) and add jitter, or use a retry library (resilience4j, Failsafe) with exponential backoff."

  - id: ssrf-stored-callback
    requirements: [ARB-083]
    title: "`{text}` delivers to a stored callback URL with no internal-address block"
    severity: medium
    confidence: medium
    dimension: security
    cwe: [CWE-918]
    controls: [NIST-800-218:PW.5, NIST-800-53r5:SC-7]
    tags: [ssrf, webhook, ai-code]
    query: |
      ((method_invocation object: (_) @c name: (identifier) @m
         arguments: (argument_list . (identifier) . (_)))
        (#match? @m "^(send|sendAsync)$") (#match? @c "(?i)client$")) @hit
      ((method_invocation object: (_) @c name: (identifier) @m
         arguments: (argument_list . (_) . (_) .))
        (#match? @m "^(postForEntity|postForObject|exchange)$") (#match? @c "(?i)(rest)?template$")) @hit
    requires_file: |
      ((string_literal) @s (#match? @s "(?i)callback_?url|webhook_?url|notify_?url|hook_?url|callback_?uri|redirect_?hook"))
    unless_in_file: |
      ((identifier) @m (#match? @m "^(isSiteLocalAddress|isLoopbackAddress|isLinkLocalAddress|isAnyLocalAddress|isMulticastAddress)$"))
      ((identifier) @m (#match? @m "(?i)ssrf|private_?(ip|addr|net|range)|is_?internal|is_?public_?(host|addr|ip)|blocked_?(ip|addr|host)|allowed_?(host|ip)"))
    description: >-
      The URL was stored by a client (a merchant, a subscriber) and the server
      later sends a request to it. Nothing in the file refuses loopback,
      private, link-local or cloud-metadata addresses, so whoever can set
      the URL can make the server reach internal services
      (169.254.169.254, localhost admin ports) and learn from the delivery
      status whether they answered.
    remediation: "Resolve the host, refuse loopback, site-local, link-local and any-local addresses, and connect to the address you checked; or keep an allowlist of callback hosts."

  - id: image-decode-unbounded
    requirements: [ARB-083]
    title: "`{text}` decodes an image without checking its dimensions first"
    severity: high
    confidence: medium
    dimension: quality
    cwe: [CWE-409, CWE-400]
    controls: [NIST-800-218:PW.5]
    tags: [unbounded-memory, decompression-bomb, ai-code]
    # ImageIO.read allocates the full raster from the header. Reading the
    # size through an ImageReader (getWidth(0)/getHeight(0) before read)
    # anywhere in the file is taken as the check.
    query: |
      ((method_invocation object: (identifier) @o name: (identifier) @m)
        (#eq? @o "ImageIO") (#eq? @m "read")) @hit
    unless_in_file: |
      ((identifier) @i (#match? @i "^(ImageReader|getImageReaders|getImageReadersByFormatName|getImageReadersBySuffix)$"))
    description: >-
      A small PNG can declare 50000 x 50000 pixels; `ImageIO.read` then
      allocates a raster of gigabytes before anything checks the size, and
      one upload throws OutOfMemoryError for the whole JVM. An upload size
      limit does not help: the file is small, the image it declares is not.
    remediation: "Open an `ImageReader` on an `ImageInputStream`, check `getWidth(0)` and `getHeight(0)` against a limit, then `reader.read(0)`."

  - id: decompress-read-unbounded
    requirements: [ARB-083]
    title: "`{text}` reads a decompressed stream with no size limit"
    severity: medium
    confidence: medium
    dimension: quality
    cwe: [CWE-409, CWE-400]
    controls: [NIST-800-218:PW.5]
    tags: [unbounded-memory, decompression-bomb, ai-code]
    query: |
      ((method_invocation name: (identifier) @m arguments: (argument_list))
        (#match? @m "^(readAllBytes)$")) @hit
      ((method_invocation object: (identifier) @o name: (identifier) @m)
        (#match? @o "^(IOUtils|ByteStreams)$") (#match? @m "^(toByteArray|toString)$")) @hit
    requires_in_scope: |
      ((object_creation_expression type: (type_identifier) @t)
        (#match? @t "^(GZIPInputStream|InflaterInputStream|ZipInputStream|GzipCompressorInputStream|BZip2CompressorInputStream|XZCompressorInputStream|ZstdInputStream|BrotliInputStream|DeflateCompressorInputStream)$"))
    unless_in_scope: |
      ((identifier) @i (#match? @i "^(readNBytes|BoundedInputStream|LimitedInputStream|getSize|getCompressedSize)$"))
      ((identifier) @i (#match? @i "(?i)^max_?(size|bytes|len|length|uncompressed)|_?limit$"))
    description: >-
      Compressed input expands by up to ~1000x (deflate) or far more
      (nested archives). Reading the decompressing stream to the end keeps
      going until the output ends, so a 1 MB upload can become gigabytes of
      heap.
    remediation: "Read at most `max + 1` bytes (`in.readNBytes(max + 1)`) and refuse output longer than `max`; for zip entries check the running total, not the declared size."
