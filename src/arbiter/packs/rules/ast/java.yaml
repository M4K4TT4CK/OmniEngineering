# Java rules. Owner: the Java agent. Schema: src/arbiter/lang_rules.py.
#
# Corpus: fixtures/planted/java/{bad,good}. Every rule here has a planted
# defect and a correct twin there; tests/test_lang_java.py adds focused cases.
#
# Two query idioms this pack leans on, because a tree-sitter pattern cannot
# say "not" or "at any depth":
#
#   * `unless_in_scope` with a NEGATED predicate, e.g. a method whose name is
#     not `run`: the hit's enclosing function encloses itself, so capturing
#     "every function that is not a worker" skips every hit outside a worker.
#   * `requires_file` with a `#match?` on a whole class, using a regex
#     back-reference to tie a field's name to its later use, which no pattern
#     can do across nesting depths.
pack: java
languages: [java]
rules:
  # ---------------------------------------------------------------- races --
  - id: check-then-act-unsynchronized
    requirements: [ARB-061]
    title: "Check-then-act on a shared collection with no lock held: `{text}`"
    severity: high
    confidence: medium
    dimension: quality
    cwe: [CWE-362, CWE-366]
    controls: [NIST-800-218:PW.5]
    tags: [concurrency, race]
    query: |
      ; if (!map.containsKey(k)) map.put(k, v);   if (!list.isEmpty()) return list.remove(0);
      ; if (map.get(k) == null) { map.put(k, v); }  if (q.size() > MAX) q.clear();
      ; One regex over the whole statement, because the back-reference (\1) is
      ; what ties the checked collection to the changed one.
      ((if_statement) @hit
        (#match? @hit "^if\\s*\\(\\s*!?\\s*(\\w+)\\.(containsKey|contains|isEmpty|get|size)\\s*\\((?:[^()]|\\([^()]*\\))*\\)(?:\\s*(?:==|!=|<=|>=|<|>)\\s*[\\w.-]+)?\\s*\\)\\s*\\{?\\s*(?://[^\\n]*\\n\\s*)?(?:return\\s+|(?:final\\s+)?[\\w.<>\\[\\], ?]+\\s+\\w+\\s*=\\s*)?\\1\\.(put|add|remove|poll|pop|clear|addAll|putAll|removeFirst|removeLast|addFirst|addLast|offer|push)\\s*\\("))
    # A class that (a) runs on more than one thread and (b) declares a
    # collection field whose name is later checked in an `if`. The
    # back-reference ties the field to the check; a local or a parameter
    # with the same name is ruled out by `unless_in_scope` below.
    requires_file: |
      ((class_declaration) @c
        (#match? @c "(?s)\\b(Map|HashMap|LinkedHashMap|TreeMap|List|ArrayList|LinkedList|Set|HashSet|LinkedHashSet|TreeSet|Deque|ArrayDeque|Queue|PriorityQueue)<[^;=()]*>\\s+(\\w+)\\s*(=[^;]*)?;.*\\bif\\s*\\(\\s*!?\\s*\\2\\.(containsKey|contains|isEmpty|get|size)\\s*\\(")
        (#match? @c "\\b(Thread|Runnable|Callable|ExecutorService|Executors|ScheduledExecutorService|CompletableFuture|ForkJoinPool|TimerTask|parallelStream)\\b|@Async|@Scheduled"))
    # Test support the inventory files as source (src/jmh, src/testFixtures,
    # src/jsr166Test, ...): anything importing a test, benchmark or fuzz
    # framework. Reused by the source-only rules below.
    unless_in_file: &test_support |
      ((import_declaration) @i
        (#match? @i "\\b(org\\.junit|junit\\.framework|org\\.testng|org\\.assertj|org\\.hamcrest|org\\.mockito|com\\.google\\.common\\.truth|com\\.google\\.common\\.testing|org\\.openjdk\\.jmh|com\\.code_intelligence\\.jazzer)\\."))
    unless_inside: |
      (synchronized_statement) @s
      ((method_declaration (modifiers) @m) @d (#match? @m "\\bsynchronized\\b"))
      ; `if (m.get(k) == v) m.remove(k, v)`: the act is ConcurrentMap's own
      ; conditional remove, so the check is only an optimisation
      ((if_statement consequence: (block . (expression_statement (method_invocation
          name: (identifier) @n arguments: (argument_list (_) (_)))) .)) @i
        (#match? @n "^(remove|replace)$"))
      ((if_statement consequence: (expression_statement (method_invocation
          name: (identifier) @n arguments: (argument_list (_) (_))))) @i
        (#match? @n "^(remove|replace)$"))
    unless_in_scope: |
      ; a lock taken in this method
      (method_invocation name: (identifier) @n (#match? @n "^(lock|lockInterruptibly|tryLock|acquire|acquireUninterruptibly)$"))
      ; the collection is a local or a parameter here, not the shared field
      (local_variable_declaration type: (generic_type (type_identifier) @t
        (#match? @t "^(Map|HashMap|LinkedHashMap|TreeMap|List|ArrayList|LinkedList|Set|HashSet|LinkedHashSet|TreeSet|Deque|ArrayDeque|Queue|PriorityQueue|Collection)$")))
      (formal_parameter type: (generic_type (type_identifier) @t
        (#match? @t "^(Map|HashMap|LinkedHashMap|TreeMap|List|ArrayList|LinkedList|Set|HashSet|LinkedHashSet|TreeSet|Deque|ArrayDeque|Queue|PriorityQueue|Collection)$")))
    description: >
      Between the check and the change another thread can run, so two workers
      both see "absent" and both insert, or both see "not empty" and the
      second `remove(0)` throws or takes a different element. The single-
      threaded test passes. Even a ConcurrentHashMap only makes each call
      atomic, not the pair.
    remediation: >
      Make the pair one atomic step: `putIfAbsent`/`computeIfAbsent`, a
      `BlockingQueue.poll()`, or hold one lock (a `synchronized` block or a
      `ReentrantLock`) around both the check and the act.

  - id: unsynchronized-counter
    requirements: [ARB-061]
    title: "`{text}` on a shared field from worker code with no lock or atomic"
    severity: medium
    confidence: medium
    dimension: quality
    cwe: [CWE-362, CWE-366]
    controls: [NIST-800-218:PW.5]
    tags: [concurrency, race]
    query: |
      (update_expression (identifier)) @hit
      (assignment_expression left: (identifier) operator: ["+=" "-="]) @hit
    # A class that runs on more than one thread and has an integral field
    # whose name is later incremented.
    requires_file: |
      ((class_declaration) @c
        (#match? @c "(?s)\\b(int|long)\\s+(\\w+)\\s*(=[^;]*)?;.*\\b\\2\\s*(\\+\\+|--|\\+=|-=)")
        (#match? @c "\\b(Thread|Runnable|Callable|ExecutorService|Executors|ScheduledExecutorService|CompletableFuture|ForkJoinPool|TimerTask|parallelStream)\\b|@Async|@Scheduled"))
    unless_in_file: *test_support
    unless_inside: |
      (synchronized_statement) @s
      ((method_declaration (modifiers) @m) @d (#match? @m "\\bsynchronized\\b"))
      (for_statement update: (_) @u)
    unless_in_scope: |
      ; the hit is not in worker code: a method that is not run()/call(),
      ; or a lambda that is not handed to a thread or an executor
      ((method_declaration name: (identifier) @n (#not-match? @n "^(run|call)$")) @m)
      (constructor_declaration) @ctor
      (method_invocation name: (identifier) @n
        (#not-match? @n "^(submit|execute|runAsync|supplyAsync|schedule|scheduleAtFixedRate|scheduleWithFixedDelay|invokeAll|invokeAny|start|startVirtualThread|thenRunAsync|thenApplyAsync|thenAcceptAsync|thenComposeAsync|whenCompleteAsync)$")
        arguments: (argument_list (lambda_expression) @l))
      (object_creation_expression type: (_) @t (#not-match? @t "^Thread$")
        arguments: (argument_list (lambda_expression) @l))
      (local_variable_declaration type: (_) @t (#not-match? @t "^(Runnable|Callable|Thread)(<.*>)?$")
        declarator: (variable_declarator value: (lambda_expression) @l))
      (field_declaration type: (_) @t (#not-match? @t "^(Runnable|Callable)(<.*>)?$")
        declarator: (variable_declarator value: (lambda_expression) @l))
      (return_statement (lambda_expression) @l)
      ; a lock taken in this scope
      (method_invocation name: (identifier) @n (#match? @n "^(lock|lockInterruptibly|tryLock|acquire|acquireUninterruptibly)$"))
      ; the counter is a local of this scope, not the shared field
      ; (`var maxToRemove = n; ... maxToRemove--;` in HikariPool's housekeeper)
      ((method_declaration) @m
        (#match? @m "(?s)(?<!for \\()(?<!for\\()\\b(var|int|long|short|byte)\\s+(\\w+)\\s*(=[^;]*)?;.*\\b\\2\\s*(\\+\\+|--|\\+=|-=)"))
      ((lambda_expression) @m
        (#match? @m "(?s)(?<!for \\()(?<!for\\()\\b(var|int|long|short|byte)\\s+(\\w+)\\s*(=[^;]*)?;.*\\b\\2\\s*(\\+\\+|--|\\+=|-=)"))
    description: >
      `count++` is a read, an add and a write. Two threads that run it at
      once lose one increment, and `volatile` does not help: it makes the
      write visible, not the three steps atomic.
    remediation: >
      Use an `AtomicInteger`/`AtomicLong` (`incrementAndGet`, `addAndGet`),
      a `LongAdder`, or guard the update with the same lock every reader uses.

  # ------------------------------------------------------------- timeouts --
  - id: http-client-no-timeout
    requirements: [ARB-061]
    title: "`{text}` builds an HttpClient with no connect timeout"
    severity: medium
    confidence: medium
    dimension: quality
    cwe: [CWE-400]
    controls: [NIST-800-218:PW.5]
    tags: [timeout, http]
    query: |
      (method_invocation object: (identifier) @o name: (identifier) @n
        (#eq? @o "HttpClient") (#match? @n "^(newHttpClient|newBuilder)$")) @hit
    unless_in_scope: |
      (method_invocation name: (identifier) @n (#eq? @n "connectTimeout"))
    # Every request in this file carries its own timeout, which also bounds
    # the connect phase.
    unless_in_file: |
      (method_invocation name: (identifier) @n (#eq? @n "timeout"))
    description: >
      `java.net.http.HttpClient` has no default connect timeout. A peer that
      accepts the TCP handshake and then says nothing holds the calling
      thread forever; under load every worker ends up parked there.
    remediation: >
      `HttpClient.newBuilder().connectTimeout(Duration.ofSeconds(n))`, and
      `.timeout(...)` on each `HttpRequest`.

  - id: http-request-no-timeout
    requirements: [ARB-061]
    title: "`HttpRequest.newBuilder` with no `.timeout(...)`"
    severity: medium
    confidence: medium
    dimension: quality
    cwe: [CWE-400]
    controls: [NIST-800-218:PW.5]
    tags: [timeout, http]
    query: |
      (method_invocation object: (identifier) @o name: (identifier) @n
        (#eq? @o "HttpRequest") (#eq? @n "newBuilder")) @hit
    unless_in_scope: |
      (method_invocation name: (identifier) @n (#eq? @n "timeout"))
    description: >
      An `HttpRequest` without a timeout waits for the response for as long
      as the server cares to take. The client's connect timeout does not
      cover this phase.
    remediation: "Add `.timeout(Duration.ofSeconds(n))` to the request builder."

  - id: url-connection-no-timeout
    requirements: [ARB-061]
    title: "`openConnection()` with neither connect nor read timeout set"
    severity: medium
    confidence: medium
    dimension: quality
    cwe: [CWE-400]
    controls: [NIST-800-218:PW.5]
    tags: [timeout, http]
    query: |
      (method_invocation name: (identifier) @n (#eq? @n "openConnection")) @hit
    requires_file: |
      ((program) @p (#match? @p "\\bHttps?URLConnection\\b"))
    unless_in_scope: |
      (method_invocation name: (identifier) @n (#match? @n "^set(Connect|Read)Timeout$"))
    description: >
      `HttpURLConnection` defaults to an infinite connect and read timeout.
    remediation: >
      Call `setConnectTimeout(ms)` and `setReadTimeout(ms)` on the connection
      before reading from it.

  - id: rest-template-no-timeout
    requirements: [ARB-061]
    title: "`new RestTemplate()` uses a request factory with no timeouts"
    severity: medium
    confidence: medium
    dimension: quality
    cwe: [CWE-400]
    controls: [NIST-800-218:PW.5]
    tags: [timeout, http, spring]
    query: |
      (object_creation_expression type: (type_identifier) @t arguments: (argument_list) @a
        (#eq? @t "RestTemplate") (#match? @a "^\\(\\s*\\)$")) @hit
    unless_in_scope: |
      (method_invocation name: (identifier) @n
        (#match? @n "^(setConnectTimeout|setReadTimeout|setRequestFactory|connectTimeout|readTimeout)$"))
    description: >
      The no-argument constructor uses `SimpleClientHttpRequestFactory` with
      connect and read timeouts of zero, meaning none.
    remediation: >
      Build it from a request factory with timeouts, or from
      `RestTemplateBuilder.setConnectTimeout(...).setReadTimeout(...)`.

  # ------------------------------------------------------ retries & loops --
  - id: retry-without-backoff
    requirements: [ARB-061]
    title: "Retry loop with no backoff and no attempt cap"
    severity: medium
    confidence: medium
    dimension: quality
    cwe: [CWE-400, CWE-834]
    controls: [NIST-800-218:PW.5]
    tags: [retry, resilience]
    query: |
      ; while (true) { try { ...; return x; } catch (E e) { log } }
      (while_statement condition: (parenthesized_expression (true))
        body: (block (try_statement body: (block [(return_statement) (break_statement)]) (catch_clause)))) @hit
      (for_statement !condition
        body: (block (try_statement body: (block [(return_statement) (break_statement)]) (catch_clause)))) @hit
    unless_in_scope: |
      (method_invocation name: (identifier) @n
        (#match? @n "(?i)^(sleep|wait|await|backoff|delay|park\\w*|pause|retry\\w*|nextDelay|exponential\\w*|tryLock)$"))
      (method_invocation object: (_) @o (#match? @o "(?i)backoff|retry"))
      ; the loop re-enters a blocking wait (lock, Future.get) after an
      ; interrupt or a cancelled future: not a call that failed
      (catch_type (_) @ct (#match? @ct "^(InterruptedException|CancellationException)$"))
    unless_in_file: *test_support
    description: >
      The loop retries the moment the call fails, forever. Against a peer
      that is down it is a busy loop; against one that is overloaded it is a
      denial of service by the client.
    remediation: >
      Cap the attempts and sleep between them with exponential backoff and
      jitter, then fail with the last error.

  - id: worker-loop-no-stop
    requirements: [ARB-061]
    title: "`while (true)` worker loop with no stop signal"
    severity: medium
    confidence: medium
    dimension: quality
    cwe: [CWE-835]
    controls: [NIST-800-218:PW.5]
    tags: [concurrency, shutdown]
    query: |
      (while_statement condition: (parenthesized_expression (true))) @hit
    requires_file: |
      ((program) @p (#match? @p "\\b(Thread|Runnable|ExecutorService|Executors|CompletableFuture)\\b"))
    unless_in_scope: |
      ; a way out of the loop, or a check of the interrupt flag
      (return_statement) @r
      (break_statement) @b
      (throw_statement) @t
      (method_invocation name: (identifier) @n
        (#match? @n "^(isInterrupted|interrupted|isShutdown|isTerminated|exit|halt)$"))
      ; not worker code (see unsynchronized-counter)
      ((method_declaration name: (identifier) @n (#not-match? @n "^(run|call)$")) @m)
      (constructor_declaration) @ctor
      (method_invocation name: (identifier) @n
        (#not-match? @n "^(submit|execute|runAsync|supplyAsync|schedule|scheduleAtFixedRate|scheduleWithFixedDelay|invokeAll|invokeAny|start|startVirtualThread|thenRunAsync|thenApplyAsync|thenAcceptAsync|thenComposeAsync|whenCompleteAsync)$")
        arguments: (argument_list (lambda_expression) @l))
      (object_creation_expression type: (_) @t (#not-match? @t "^Thread$")
        arguments: (argument_list (lambda_expression) @l))
      (local_variable_declaration type: (_) @t (#not-match? @t "^(Runnable|Callable|Thread)(<.*>)?$")
        declarator: (variable_declarator value: (lambda_expression) @l))
      (field_declaration type: (_) @t (#not-match? @t "^(Runnable|Callable)(<.*>)?$")
        declarator: (variable_declarator value: (lambda_expression) @l))
      (return_statement (lambda_expression) @l)
    description: >
      Nothing in the worker checks a running flag or the interrupt status,
      and nothing breaks or returns, so `shutdown()` and `interrupt()` are
      ignored. The JVM cannot exit cleanly and the test suite hangs.
    remediation: >
      Loop on `while (running)` with a `volatile boolean`, or on
      `!Thread.currentThread().isInterrupted()`, and return from the
      `InterruptedException` handler after re-setting the flag.

  # ----------------------------------------------------------- exceptions --
  - id: swallowed-exception
    requirements: [ARB-061]
    title: "Empty `catch` swallows the error: `{text}`"
    severity: medium
    confidence: high
    dimension: quality
    cwe: [CWE-391, CWE-703]
    controls: [NIST-800-218:PW.5]
    tags: [error-handling]
    query: |
      ; catch (Exception e) {}  anywhere. A comment in the block is the
      ; author saying why (HikariCP, commons-lang): reported only in a
      ; worker-shaped while/do loop, below.
      (catch_clause (catch_formal_parameter (catch_type (type_identifier) @t) name: (identifier) @id)
        body: (block) @b
        (#match? @b "^\\{\\s*\\}$")
        (#match? @t "^(Exception|Throwable|RuntimeException|Error)$")
        (#not-match? @id "^(ignored?|expected|unused|_+)$")) @hit
      ; while (...) { try { ... } catch (Exception e) { // ignore } }
      (while_statement body: (block (try_statement
        (catch_clause (catch_formal_parameter (catch_type (type_identifier) @t) name: (identifier) @id)
          body: (block) @b
          (#match? @b "(?s)^\\{(\\s|//[^\\n]*|/\\*.*?\\*/)*\\}$")
          (#match? @t "^(Exception|Throwable|RuntimeException|Error)$")
          (#not-match? @id "^(ignored?|expected|unused|_+)$")) @hit)))
      ; any truly empty catch when the try sits directly in a loop body
      ; (one pattern per loop type: a predicate inside an alternation is
      ; evaluated on a partial match by the engine's captures())
      (while_statement body: (block (try_statement
        (catch_clause (catch_formal_parameter name: (identifier) @id) body: (block) @b
          (#match? @b "^\\{\\s*\\}$") (#not-match? @id "^(ignored?|expected|unused|_+)$")) @hit)))
      (for_statement body: (block (try_statement
        (catch_clause (catch_formal_parameter name: (identifier) @id) body: (block) @b
          (#match? @b "^\\{\\s*\\}$") (#not-match? @id "^(ignored?|expected|unused|_+)$")) @hit)))
      (enhanced_for_statement body: (block (try_statement
        (catch_clause (catch_formal_parameter name: (identifier) @id) body: (block) @b
          (#match? @b "^\\{\\s*\\}$") (#not-match? @id "^(ignored?|expected|unused|_+)$")) @hit)))
      (do_statement body: (block (try_statement
        (catch_clause (catch_formal_parameter name: (identifier) @id) body: (block) @b
          (#match? @b "^\\{\\s*\\}$") (#not-match? @id "^(ignored?|expected|unused|_+)$")) @hit)))
    description: >
      The failure is discarded with no log, no metric and no rethrow. The
      caller sees success; the operator sees nothing; in a loop the same
      error repeats silently on every iteration.
    remediation: >
      Log it with context and decide: rethrow, return a failure, or, if
      ignoring it is right, catch the specific type and say why in a comment.
      For `InterruptedException`, call `Thread.currentThread().interrupt()`.

  # ------------------------------------------------------------ injection --
  - id: sql-string-built
    requirements: [ARB-061]
    title: "SQL built from a string expression reaches `{text}`"
    severity: high
    confidence: medium
    dimension: security
    cwe: [CWE-89]
    controls: [NIST-800-218:PW.5]
    tags: [injection, sql]
    query: |
      ; executeQuery("... " + name + " ...")  /  executeQuery(String.format(...))
      ; A built string is one that splices in a lower-case name, field or
      ; call next to a `+`, or is a String.format, and that reads as SQL; literal +
      ; literal and CONSTANT + literal are not reported, and neither is a string
      ; whose only splices are identifiers (`" FROM " + tableName + " WHERE id = ?"`,
      ; `getTableName("REALM")`, keycloak and tomcat), which cannot be bound as `?`.
      ; Every sink has a receiver: Ant's inherited `execute(String)` is not JDBC.
      (method_invocation object: (_) name: (identifier) @n arguments: (argument_list . (binary_expression) @val)
        (#match? @val "^String\\.format\\s*\\(|\\+\\s*[a-z_][\\w.]*\\s*(\\(|\\[|\\+|$)|^\\s*[a-z_][\\w.]*\\s*\\+") (#match? @val "(?i)\\b(select|insert|update|delete|from|where|into|values|call|drop|create|alter|truncate|merge|join|order\\s+by|set|grant|revoke|schema|table)\\b") (#not-match? @val "^(?:\\s|\\+|\"(?:[^\"\\\\]|\\\\.)*\"|\\b(?:[A-Z]\\w*\\.)*[A-Z][A-Z0-9_]*\\b|(?:this\\.)?(?:[\\w.]*?[a-z0-9](?:Table|Column|Col|Schema|Catalog|Index|Identifier|Sequence)s?(?:Name|Names)?|(?:table|column|schema|catalog|sequence)(?:Name|Names))\\b|(?:[\\w.]*\\.)?(?:get|quote|escape)\\w*?(?:Table|Column|Schema|Identifier|Index)\\w*\\x28[^\\x28\\x29]*\\x29)+$")
        (#match? @n "^(executeQuery|executeUpdate|executeLargeUpdate|execute|addBatch|prepareStatement|prepareCall|createQuery|createNativeQuery|createSQLQuery|query|queryForObject|queryForList|queryForMap|queryForRowSet|queryForLong|queryForInt|queryForStream|batchUpdate|update|nativeQuery)$")) @hit
      (method_invocation object: (_) name: (identifier) @n
        arguments: (argument_list . (method_invocation object: (identifier) @so name: (identifier) @sf arguments: (argument_list) @fa))
        (#eq? @so "String") (#eq? @sf "format") (#match? @n "^(executeQuery|executeUpdate|executeLargeUpdate|execute|addBatch|prepareStatement|prepareCall|createQuery|createNativeQuery|createSQLQuery|query|queryForObject|queryForList|queryForMap|queryForRowSet|queryForLong|queryForInt|queryForStream|batchUpdate|update|nativeQuery)$")
        (#match? @fa "(?i)\\b(select|insert|update|delete|from|where|into|values|call|drop|create|alter|truncate|merge|join|order\\s+by|set|grant|revoke|schema|table)\\b") (#not-match? @fa "^\\x28(?:\\s|,|\\+|\"(?:[^\"\\\\]|\\\\.)*\"|\\b(?:[A-Z]\\w*\\.)*[A-Z][A-Z0-9_]*\\b|(?:this\\.)?(?:[\\w.]*?[a-z0-9](?:Table|Column|Col|Schema|Catalog|Index|Identifier|Sequence)s?(?:Name|Names)?|(?:table|column|schema|catalog|sequence)(?:Name|Names))\\b|(?:[\\w.]*\\.)?(?:get|quote|escape)\\w*?(?:Table|Column|Schema|Identifier|Index)\\w*\\x28[^\\x28\\x29]*\\x29)+\\x29$")) @hit
      ; String sql = "... " + name; ... executeQuery(sql), later in the same
      ; block, or inside a `try` / try-with-resources that follows it there
      ; (OWASP Benchmark declares the query and executes it inside `try { }`)
      (block
        (local_variable_declaration declarator: (variable_declarator name: (identifier) @v value: (_) @val))
        [
          (expression_statement (method_invocation object: (_) name: (identifier) @n arguments: (argument_list . (identifier) @a)) @hit)
          (expression_statement (assignment_expression right: (method_invocation object: (_) name: (identifier) @n arguments: (argument_list . (identifier) @a)) @hit))
          (local_variable_declaration declarator: (variable_declarator value: (method_invocation object: (_) name: (identifier) @n arguments: (argument_list . (identifier) @a)) @hit))
          (return_statement (method_invocation object: (_) name: (identifier) @n arguments: (argument_list . (identifier) @a)) @hit)
        ]
        (#eq? @v @a) (#match? @val "^String\\.format\\s*\\(|\\+\\s*[a-z_][\\w.]*\\s*(\\(|\\[|\\+|$)|^\\s*[a-z_][\\w.]*\\s*\\+") (#match? @val "(?i)\\b(select|insert|update|delete|from|where|into|values|call|drop|create|alter|truncate|merge|join|order\\s+by|set|grant|revoke|schema|table)\\b") (#not-match? @val "^(?:\\s|\\+|\"(?:[^\"\\\\]|\\\\.)*\"|\\b(?:[A-Z]\\w*\\.)*[A-Z][A-Z0-9_]*\\b|(?:this\\.)?(?:[\\w.]*?[a-z0-9](?:Table|Column|Col|Schema|Catalog|Index|Identifier|Sequence)s?(?:Name|Names)?|(?:table|column|schema|catalog|sequence)(?:Name|Names))\\b|(?:[\\w.]*\\.)?(?:get|quote|escape)\\w*?(?:Table|Column|Schema|Identifier|Index)\\w*\\x28[^\\x28\\x29]*\\x29)+$")
        (#match? @n "^(executeQuery|executeUpdate|executeLargeUpdate|execute|addBatch|prepareStatement|prepareCall|createQuery|createNativeQuery|createSQLQuery|query|queryForObject|queryForList|queryForMap|queryForRowSet|queryForLong|queryForInt|queryForStream|batchUpdate|update|nativeQuery)$"))
      (block
        (local_variable_declaration declarator: (variable_declarator name: (identifier) @v value: (_) @val))
        (try_statement body: (block [
            (expression_statement (method_invocation object: (_) name: (identifier) @n arguments: (argument_list . (identifier) @a)) @hit)
            (expression_statement (assignment_expression right: (method_invocation object: (_) name: (identifier) @n arguments: (argument_list . (identifier) @a)) @hit))
            (local_variable_declaration declarator: (variable_declarator value: (method_invocation object: (_) name: (identifier) @n arguments: (argument_list . (identifier) @a)) @hit))
            (return_statement (method_invocation object: (_) name: (identifier) @n arguments: (argument_list . (identifier) @a)) @hit)
          ]))
        (#eq? @v @a) (#match? @val "^String\\.format\\s*\\(|\\+\\s*[a-z_][\\w.]*\\s*(\\(|\\[|\\+|$)|^\\s*[a-z_][\\w.]*\\s*\\+") (#match? @val "(?i)\\b(select|insert|update|delete|from|where|into|values|call|drop|create|alter|truncate|merge|join|order\\s+by|set|grant|revoke|schema|table)\\b") (#not-match? @val "^(?:\\s|\\+|\"(?:[^\"\\\\]|\\\\.)*\"|\\b(?:[A-Z]\\w*\\.)*[A-Z][A-Z0-9_]*\\b|(?:this\\.)?(?:[\\w.]*?[a-z0-9](?:Table|Column|Col|Schema|Catalog|Index|Identifier|Sequence)s?(?:Name|Names)?|(?:table|column|schema|catalog|sequence)(?:Name|Names))\\b|(?:[\\w.]*\\.)?(?:get|quote|escape)\\w*?(?:Table|Column|Schema|Identifier|Index)\\w*\\x28[^\\x28\\x29]*\\x29)+$")
        (#match? @n "^(executeQuery|executeUpdate|executeLargeUpdate|execute|addBatch|prepareStatement|prepareCall|createQuery|createNativeQuery|createSQLQuery|query|queryForObject|queryForList|queryForMap|queryForRowSet|queryForLong|queryForInt|queryForStream|batchUpdate|update|nativeQuery)$"))
      (block
        (local_variable_declaration declarator: (variable_declarator name: (identifier) @v value: (_) @val))
        (try_with_resources_statement resources: (resource_specification (resource
            value: (method_invocation object: (_) name: (identifier) @n arguments: (argument_list . (identifier) @a)) @hit)))
        (#eq? @v @a) (#match? @val "^String\\.format\\s*\\(|\\+\\s*[a-z_][\\w.]*\\s*(\\(|\\[|\\+|$)|^\\s*[a-z_][\\w.]*\\s*\\+") (#match? @val "(?i)\\b(select|insert|update|delete|from|where|into|values|call|drop|create|alter|truncate|merge|join|order\\s+by|set|grant|revoke|schema|table)\\b") (#not-match? @val "^(?:\\s|\\+|\"(?:[^\"\\\\]|\\\\.)*\"|\\b(?:[A-Z]\\w*\\.)*[A-Z][A-Z0-9_]*\\b|(?:this\\.)?(?:[\\w.]*?[a-z0-9](?:Table|Column|Col|Schema|Catalog|Index|Identifier|Sequence)s?(?:Name|Names)?|(?:table|column|schema|catalog|sequence)(?:Name|Names))\\b|(?:[\\w.]*\\.)?(?:get|quote|escape)\\w*?(?:Table|Column|Schema|Identifier|Index)\\w*\\x28[^\\x28\\x29]*\\x29)+$")
        (#match? @n "^(executeQuery|executeUpdate|executeLargeUpdate|execute|addBatch|prepareStatement|prepareCall|createQuery|createNativeQuery|createSQLQuery|query|queryForObject|queryForList|queryForMap|queryForRowSet|queryForLong|queryForInt|queryForStream|batchUpdate|update|nativeQuery)$"))
      (block
        (local_variable_declaration declarator: (variable_declarator name: (identifier) @v value: (_) @val))
        (try_with_resources_statement body: (block [
            (expression_statement (method_invocation object: (_) name: (identifier) @n arguments: (argument_list . (identifier) @a)) @hit)
            (expression_statement (assignment_expression right: (method_invocation object: (_) name: (identifier) @n arguments: (argument_list . (identifier) @a)) @hit))
            (local_variable_declaration declarator: (variable_declarator value: (method_invocation object: (_) name: (identifier) @n arguments: (argument_list . (identifier) @a)) @hit))
            (return_statement (method_invocation object: (_) name: (identifier) @n arguments: (argument_list . (identifier) @a)) @hit)
          ]))
        (#eq? @v @a) (#match? @val "^String\\.format\\s*\\(|\\+\\s*[a-z_][\\w.]*\\s*(\\(|\\[|\\+|$)|^\\s*[a-z_][\\w.]*\\s*\\+") (#match? @val "(?i)\\b(select|insert|update|delete|from|where|into|values|call|drop|create|alter|truncate|merge|join|order\\s+by|set|grant|revoke|schema|table)\\b") (#not-match? @val "^(?:\\s|\\+|\"(?:[^\"\\\\]|\\\\.)*\"|\\b(?:[A-Z]\\w*\\.)*[A-Z][A-Z0-9_]*\\b|(?:this\\.)?(?:[\\w.]*?[a-z0-9](?:Table|Column|Col|Schema|Catalog|Index|Identifier|Sequence)s?(?:Name|Names)?|(?:table|column|schema|catalog|sequence)(?:Name|Names))\\b|(?:[\\w.]*\\.)?(?:get|quote|escape)\\w*?(?:Table|Column|Schema|Identifier|Index)\\w*\\x28[^\\x28\\x29]*\\x29)+$")
        (#match? @n "^(executeQuery|executeUpdate|executeLargeUpdate|execute|addBatch|prepareStatement|prepareCall|createQuery|createNativeQuery|createSQLQuery|query|queryForObject|queryForList|queryForMap|queryForRowSet|queryForLong|queryForInt|queryForStream|batchUpdate|update|nativeQuery)$"))
    description: >
      The statement text includes a value spliced in at run time, so whoever
      controls that value controls the query. Concatenating constants or
      literals is not reported; a lower-case name, field or call is.
    remediation: >
      Use a `PreparedStatement` (or JPA `setParameter`) with `?`/`:name`
      placeholders, and keep identifiers (table, column) to an allow-list.
    # One-hop data flow (Milestone 3). The built SQL (same test as the first
    # pattern above) reaches the call through a local or a same-file helper;
    # a hit whose spliced values are provably constant, or derived only from
    # constants in a method that reads request input (OWASP Benchmark's
    # tricks), is dropped.
    taint:
      sources: |
        ((binary_expression) @val
        (#match? @val "^String\\.format\\s*\\(|\\+\\s*[a-z_][\\w.]*\\s*(\\(|\\[|\\+|$)|^\\s*[a-z_][\\w.]*\\s*\\+") (#match? @val "(?i)\\b(select|insert|update|delete|from|where|into|values|call|drop|create|alter|truncate|merge|join|order\\s+by|set|grant|revoke|schema|table)\\b") (#not-match? @val "^(?:\\s|\\+|\"(?:[^\"\\\\]|\\\\.)*\"|\\b(?:[A-Z]\\w*\\.)*[A-Z][A-Z0-9_]*\\b|(?:this\\.)?(?:[\\w.]*?[a-z0-9](?:Table|Column|Col|Schema|Catalog|Index|Identifier|Sequence)s?(?:Name|Names)?|(?:table|column|schema|catalog|sequence)(?:Name|Names))\\b|(?:[\\w.]*\\.)?(?:get|quote|escape)\\w*?(?:Table|Column|Schema|Identifier|Index)\\w*\\x28[^\\x28\\x29]*\\x29)+$")) @source
        ((method_invocation object: (identifier) @so name: (identifier) @sf arguments: (argument_list) @fa)
         (#eq? @so "String") (#eq? @sf "format")
        (#match? @fa "(?i)\\b(select|insert|update|delete|from|where|into|values|call|drop|create|alter|truncate|merge|join|order\\s+by|set|grant|revoke|schema|table)\\b") (#not-match? @fa "^\\x28(?:\\s|,|\\+|\"(?:[^\"\\\\]|\\\\.)*\"|\\b(?:[A-Z]\\w*\\.)*[A-Z][A-Z0-9_]*\\b|(?:this\\.)?(?:[\\w.]*?[a-z0-9](?:Table|Column|Col|Schema|Catalog|Index|Identifier|Sequence)s?(?:Name|Names)?|(?:table|column|schema|catalog|sequence)(?:Name|Names))\\b|(?:[\\w.]*\\.)?(?:get|quote|escape)\\w*?(?:Table|Column|Schema|Identifier|Index)\\w*\\x28[^\\x28\\x29]*\\x29)+\\x29$")) @source
      # the identifier helpers the query above already trusts
      sanitizers: |
        ((method_invocation name: (identifier) @n) @sanitizer
         (#match? @n "^(get|quote|escape)\\w*?(Table|Column|Schema|Identifier|Index)\\w*$"))
      inputs: &java_request_inputs |
        ((method_invocation object: (identifier) @rq name: (identifier) @m) @input
         (#match? @m "^(getParameter|getParameterValues|getParameterMap|getParameterNames|getHeader|getHeaders|getHeaderNames|getQueryString|getCookies|getPathInfo|getRequestURI|getRequestURL|getInputStream|getReader|getPart|getParts)$"))
        ((formal_parameter (modifiers [(annotation name: (identifier) @a) (marker_annotation name: (identifier) @a)]) name: (identifier) @input)
         (#match? @a "^(RequestParam|PathVariable|RequestHeader|CookieValue|RequestBody|RequestPart|MatrixVariable|QueryParam|PathParam|FormParam|HeaderParam|CookieParam)$"))
      sinks: |
        ((method_invocation object: (_) name: (identifier) @n arguments: (argument_list . (_) @sink)) @hit
         (#match? @n "^(executeQuery|executeUpdate|executeLargeUpdate|execute|addBatch|prepareStatement|prepareCall|createQuery|createNativeQuery|createSQLQuery|query|queryForObject|queryForList|queryForMap|queryForRowSet|queryForLong|queryForInt|queryForStream|batchUpdate|update|nativeQuery)$"))
      types: &java_request_types
        rq: "^(javax\\.servlet\\.http\\.|jakarta\\.servlet\\.http\\.)?(Http)?Servlet(Request|RequestWrapper)$|^(HttpServletRequest|ServletRequest|ServerHttpRequest|WebRequest|NativeWebRequest|Request)$"
      value: [val, fa]
      kill: derived

  - id: command-injection
    requirements: [ARB-061]
    title: "Shell command built from a run-time value: `{text}`"
    severity: high
    confidence: medium
    dimension: security
    cwe: [CWE-78]
    controls: [NIST-800-218:PW.5]
    tags: [injection, command]
    query: |
      ; Runtime.getRuntime().exec(<anything but a literal, a CONSTANT or a literal array>)
      (method_invocation
        object: (method_invocation object: (identifier) @r name: (identifier) @g)
        name: (identifier) @x
        arguments: (argument_list . (_) @a)
        (#eq? @r "Runtime") (#eq? @g "getRuntime") (#eq? @x "exec")
        (#not-match? @a "(?s)^(\"([^\"\\\\]|\\\\.)*\"|[A-Z][A-Z0-9_]*|new\\s+String\\s*\\[\\s*\\]\\s*\\{\\s*(\"[^\"]*\"\\s*,?\\s*)*\\})$")) @hit
      ; Runtime r = Runtime.getRuntime(); ... r.exec(cmd + arg): the local or
      ; field is tied to the Runtime by requires_file below
      (method_invocation object: (identifier) @r name: (identifier) @x
        arguments: (argument_list . (_) @a)
        (#match? @r "^[a-z]\\w*$") (#eq? @x "exec")
        (#not-match? @a "(?s)^(\"([^\"\\\\]|\\\\.)*\"|[A-Z][A-Z0-9_]*|new\\s+String\\s*\\[\\s*\\]\\s*\\{\\s*(\"[^\"]*\"\\s*,?\\s*)*\\})$")) @hit
      ; new ProcessBuilder("sh", "-c", <non-literal>)  /  ("cmd", "/c", <non-literal>)
      (object_creation_expression type: (type_identifier) @t
        arguments: (argument_list (string_literal) @c . (_) @a)
        (#eq? @t "ProcessBuilder") (#match? @c "^\"(-c|/c|-e)\"$") (#not-match? @a "^\"")) @hit
      ; new ProcessBuilder(argList) / pb.command(argList), where the same method
      ; puts a shell's `-c` (or `/c`) into the list: see unless_inside
      (object_creation_expression type: (_) @t arguments: (argument_list . (identifier) .)
        (#match? @t "(^|\\.)ProcessBuilder$")) @hit
      (method_invocation object: (identifier) name: (identifier) @x arguments: (argument_list . (identifier) .)
        (#eq? @x "command")) @hit
    # One of: Runtime.getRuntime().exec, a variable bound to Runtime.getRuntime()
    # whose exec is called, or a ProcessBuilder.
    requires_file: |
      ((program) @p (#match? @p "(?s)getRuntime\\x28\\x29\\s*\\.\\s*exec\\b|\\bProcessBuilder\\b|\\bRuntime\\s+(\\w+)\\s*=\\s*(java\\.lang\\.)?Runtime\\.getRuntime\\x28\\x29.*\\b\\1\\.exec\\s*\\x28"))
    # A ProcessBuilder given a list in a method with no shell flag and no
    # exec runs a program with its own arguments: no shell parses them.
    unless_inside: |
      ((method_declaration) @m (#not-match? @m "\"(-c|/c|-e)\"|\\.exec\\s*\\x28"))
    description: >
      `Runtime.exec(String)` splits on whitespace and `sh -c` interprets
      metacharacters, so a value that reaches either from outside runs
      whatever it likes.
    remediation: >
      Pass the program and each argument as separate array elements with no
      shell, validate against an allow-list, and prefer a library call over
      a child process.
    # One-hop data flow (Milestone 3): a command whose every part is
    # provably constant, or derived only from constants (a helper given a
    # literal) in a method that reads request input, is dropped: OWASP
    # Benchmark's constant tricks.
    taint:
      inputs: *java_request_inputs
      types: *java_request_types
      value: [a]
      kill: derived

  # ------------------------------------------------------ deserialization --

  - id: object-input-stream
    requirements: [ARB-060]
    title: "`ObjectInputStream.readObject` deserializes untrusted bytes"
    severity: high
    confidence: medium
    dimension: security
    cwe: [CWE-502]
    controls: [NIST-800-218:PW.5]
    tags: [deserialization]
    query: |
      (method_invocation name: (identifier) @m (#eq? @m "readObject")) @hit
    requires_file: |
      (object_creation_expression
        type: (_) @t
        (#match? @t "(^|\\.)ObjectInputStream$")) @x
    unless_in_file: *test_support
    description: "Java deserialization runs constructors and gadgets chosen by whoever wrote the bytes."
    remediation: "Use a data format (JSON) with an explicit schema, or an ObjectInputFilter allow-list."

  - id: xml-decoder
    requirements: [ARB-061]
    title: "`XMLDecoder.readObject` instantiates whatever classes the XML names"
    severity: high
    confidence: medium
    dimension: security
    cwe: [CWE-502]
    controls: [NIST-800-218:PW.5]
    tags: [deserialization]
    query: |
      (method_invocation name: (identifier) @m (#eq? @m "readObject")) @hit
    requires_file: |
      (object_creation_expression
        type: (_) @t
        (#match? @t "(^|\\.)XMLDecoder$")) @x
    description: >
      `java.beans.XMLDecoder` is a scripting engine: the document can call
      any public constructor or method, including `ProcessBuilder.start`.
    remediation: "Parse the XML with a schema-bound binder (JAXB, Jackson XML) into known types."

  - id: jackson-default-typing
    requirements: [ARB-061]
    title: "Jackson default typing lets the JSON choose the class to instantiate"
    severity: high
    confidence: high
    dimension: security
    cwe: [CWE-502]
    controls: [NIST-800-218:PW.5]
    tags: [deserialization, jackson]
    query: |
      (method_invocation name: (identifier) @m (#eq? @m "enableDefaultTyping")) @hit
      (method_invocation name: (identifier) @m arguments: (argument_list) @a
        (#eq? @m "activateDefaultTyping") (#match? @a "LaissezFaire")) @hit
    description: >
      With default typing on, a `@class` property in the input picks the
      concrete type; with the laissez-faire validator every gadget class on
      the classpath is allowed.
    remediation: >
      Use `activateDefaultTyping` with a `BasicPolymorphicTypeValidator`
      that allows only your own base types, or `@JsonTypeInfo` with named
      subtypes.

  # ---------------------------------------------------------------- stubs --
  - id: stub-method
    requirements: [ARB-061]
    title: "Method body is a placeholder: `{text}`"
    severity: medium
    confidence: medium
    dimension: quality
    cwe: [CWE-1164]
    controls: [NIST-800-218:PW.5]
    tags: [stub, incomplete]
    query: |
      ; throw new UnsupportedOperationException("not implemented yet")
      (method_declaration body: (block . (throw_statement (object_creation_expression
        type: (type_identifier) @t arguments: (argument_list) @a)) @hit . (line_comment)? .)
        (#eq? @t "UnsupportedOperationException")
        (#match? @a "(?i)not (yet )?implemented|\\btodo\\b|fixme|\\bstub\\b|implement (me|this|later)"))
      ; a bare `throw new UnsupportedOperationException();` is the JDK idiom
      ; for an optional operation (Iterator.remove, Entry.setValue): only a
      ; plain public method that overrides nothing is a stub. Interface
      ; defaults and abstract-class hooks are excluded by unless_inside.
      (method_declaration (modifiers) @mods body: (block . (throw_statement (object_creation_expression
        type: (type_identifier) @t arguments: (argument_list) @a)) @hit . (line_comment)? .)
        (#eq? @t "UnsupportedOperationException")
        (#match? @a "^\\(\\s*\\)$")
        (#match? @mods "^public\\b")
        (#not-match? @mods "@Override|\\b(protected|abstract|default|static)\\b"))
      ; throw new RuntimeException("TODO ...") / IllegalStateException("not implemented")
      (method_declaration body: (block . (throw_statement (object_creation_expression
        type: (type_identifier) @t arguments: (argument_list) @a)) @hit . (line_comment)? .)
        (#match? @t "^(RuntimeException|IllegalStateException|Error|AssertionError)$")
        (#match? @a "(?i)not (yet )?implemented|todo|fixme|stub"))
      ; return null; // TODO
      (method_declaration body: (block . (return_statement (null_literal)) @hit . (line_comment) @c .)
        (#match? @c "(?i)todo|fixme|stub|implement"))
    unless_in_file: *test_support
    unless_inside: |
      (interface_declaration) @i
      ((class_declaration (modifiers) @m) @c (#match? @m "\\babstract\\b"))
    description: >
      The method compiles and the class wires up, but calling it fails or
      returns nothing. Generated scaffolds leave these behind and the caller
      only finds out in production.
    remediation: "Implement it, or remove the method so the gap fails at compile time."

  # ---------------------------------------------------------------- tests --
  - id: test-without-assertion
    requirements: [ARB-062, ARB-065]
    title: "`@Test {text}` asserts nothing"
    severity: low
    # low, not medium: on the gold set most hits are deliberate "does not
    # throw" tests (2026-10-21 triage), so the rule is a prompt to look, not a
    # claim. Chosen over raising its gold budget (tools/gold/budgets.json).
    confidence: low
    dimension: assurance
    cwe: [CWE-1164]
    controls: [NIST-800-218:PW.8]
    tags: [test, assurance]
    roles: [test]
    query: |
      (method_declaration (modifiers (marker_annotation name: (identifier) @a (#eq? @a "Test")))
        name: (identifier) @hit)
    unless_in_scope: |
      (method_invocation name: (identifier) @n
        (#match? @n "^(assert\\w*|verify\\w*|ensure\\w*|fail|expect\\w*|andExpect\\w*|should\\w*|then\\w*|check\\w*|validate\\w*|assume\\w*|is[A-Z]\\w*|has[A-Z]\\w*|contains\\w*|doesNotContain\\w*|isEqualTo|isNotEqualTo|matches|satisfies|inOrder|andDo|expectStatus|exchange)$"))
      (method_invocation object: (identifier) @o
        (#match? @o "^(Assertions|Assert|Mockito|BDDMockito|MatcherAssert|Truth|StepVerifier|Verify|Awaitility|SoftAssertions)$"))
      ; delegates to a helper of this class (`checkRoundTrip(x)`) or a
      ; tester (`npeTester.testAllPublicInstanceMethods`), which is where the
      ; assertion lives: seen across commons-lang, gson and caffeine
      (method_invocation !object name: (identifier) @n (#not-match? @n "^(println|print|printf)$"))
      (method_invocation name: (identifier) @n (#match? @n "^(test[A-Z]\\w*|await\\w*|run[A-Z]\\w*Test\\w*)$"))
      ; hands one of its own methods to a runner, where the assertions are:
      ; keycloak `runOnServer.run(UPConfigParserTest::validate)` and
      ; `testingClient.server().run(PolicyEvaluationTest::testX)`
      (method_invocation name: (identifier) @n arguments: (argument_list (method_reference))
        (#match? @n "^(run\\w*|execute|call|invoke)$"))
      ; `if (cause != null) throw cause;` fails the test on a condition
      ; (netty DefaultChannelPipelineTest): a hand-written assertion
      (method_declaration body: (block (if_statement consequence: (throw_statement)) @t))
      (method_declaration body: (block (if_statement consequence: (block (throw_statement))) @t))
      ; switched off: `@Disabled`/`@Ignore` is assurance.permanently-skipped-test's
      ; finding. An `@Override` test replaces an inherited one: empty, it
      ; switches the parent's test off (netty AbstractAdaptiveByteBufTest);
      ; otherwise it narrows the parent's check to what this subclass
      ; supports (tomcat's `testNoArgConstructor` overrides). The parent
      ; owns the assertion, so neither is reported.
      ((method_declaration (modifiers) @m) @d (#match? @m "@(Disabled|Ignore)\\b"))
      ; (anchored on the @Test method: an anonymous class's `@Override`
      ; inside the test body is not one)
      ((method_declaration (modifiers (marker_annotation name: (identifier) @t (#eq? @t "Test"))) @m) @d (#match? @m "@Override\\b"))
      ; a comment in the body says that not throwing is the check:
      ; `// no exception` (spring-security Issue50Tests)
      ((method_declaration (modifiers (marker_annotation name: (identifier) @t (#eq? @t "Test"))) body: (block (line_comment) @c)) @d
        (#match? @c "(?i)//\\s*(no exception|does(n't| not) throw|should(n't| not) (throw|fail))"))
      ; the name or @DisplayName says that not throwing is the check, the
      ; same as a "does not throw" title in the TypeScript rule
      ; (`buildWhenScopesIsNullThenDoesNotThrowAnyException`, `contextLoads`,
      ; spring-security's `...WhenRoleAdminThenPasses`)
      ; Also the outcome words for "the call completes": spring-security's
      ; `...ThenCreated`, `...AccessGranted`, `...ShouldAllow...` (an
      ; authorization test passes when AccessDeniedException is not thrown),
      ; `...ThenScopeNotRequired`, `...DoesNotCauseCircularReference`.
      ((method_declaration (modifiers (marker_annotation name: (identifier) @t (#eq? @t "Test"))) name: (identifier) @n) @d
        (#match? @n "(?i:(doesnt|dont|didnt|wont|cant|not|never|no)_?(throw|crash|fail|blow)|no_?(exception|error)s?(_?thrown)?$|none_?exception|no_?assert(ion)?_?error|exception_?not_?thrown|without_?(exception|error|throwing)|starts_?cleanly|(does|do)_?not_?cause|not_?required$|can_?(both_?)?be_?(instanced|instantiated|loaded|created)|is_?serializable$|compiles)|(Succeeds|Passes|Loads|Success|Successful|SuccessFul|Created|Granted|GrantsAccess|Wires|Autowires)$|(^allow|Allow)(s|ed)?([A-Z_]|$)"))
      ((method_declaration (modifiers (annotation name: (identifier) @a arguments: (annotation_argument_list) @s))) @d
        (#eq? @a "DisplayName")
        (#match? @s "(?i)(\\bnot|\\bnever|n't|\\bwithout|\\bno) (throw|exception|error|fail|crash|hang)"))
    # A performance harness measures time, not results: tomcat's
    # `Tester*Performance` classes (not run by its default test target) and
    # `Benchmarks`, JMH-style `*Benchmark` classes.
    unless_in_file: |
      (class_declaration name: (identifier) @c
        (#match? @c "(Performance|Benchmarks?|PerformanceTest|PerfTest)$")) @x
    description: >
      The test passes as long as nothing throws, which is not what it looks
      like it checks. A method that only calls the code under test proves
      the call does not crash on this input and nothing else. A test whose
      name, `@DisplayName` or a body comment says it checks that nothing
      throws (or that the call is allowed, created or completes), one that
      throws on a condition itself, one that delegates to an
      `assert*`/`verify*`/`check*`/`expect*`/`ensure*` helper, an
      `@Override` of an inherited test, one switched off with `@Disabled` or
      `@Ignore`, and a performance harness class are not reported.
    remediation: >
      Assert the outcome (`assertEquals`, `assertThat`, `verify(...)`), or
      name it `...DoesNotThrow` and wrap it in `assertDoesNotThrow`.

  # ------------------------------------------------------------------ TLS --
  - id: trust-all-certificates
    requirements: [ARB-061]
    title: "`checkServerTrusted` is empty: every certificate is accepted"
    severity: high
    confidence: high
    dimension: security
    cwe: [CWE-295]
    controls: [NIST-800-218:PW.5]
    tags: [tls, crypto]
    query: |
      (method_declaration name: (identifier) @hit body: (block) @b
        (#eq? @hit "checkServerTrusted")
        (#match? @b "(?s)^\\{(\\s|//[^\\n]*|/\\*.*?\\*/)*\\}$"))
    description: >
      A `TrustManager` that does not throw from `checkServerTrusted`
      accepts any certificate, including one minted by whoever sits between
      this process and the server; TLS then encrypts the traffic to the
      attacker.
    remediation: >
      Delete the custom trust manager and use the platform default. For a
      private CA, load it into a `KeyStore` and init a `TrustManagerFactory`
      from that.

  - id: hostname-verifier-disabled
    requirements: [ARB-061]
    title: "HostnameVerifier that always returns true"
    severity: high
    confidence: high
    dimension: security
    cwe: [CWE-295]
    controls: [NIST-800-218:PW.5]
    tags: [tls, crypto]
    query: |
      (method_invocation name: (identifier) @n
        (#match? @n "^(setDefaultHostnameVerifier|setHostnameVerifier|hostnameVerifier)$")
        arguments: (argument_list (lambda_expression body: (true)) @hit))
      (local_variable_declaration type: (type_identifier) @t (#eq? @t "HostnameVerifier")
        declarator: (variable_declarator value: (lambda_expression body: (true)) @hit))
      (field_declaration type: (type_identifier) @t (#eq? @t "HostnameVerifier")
        declarator: (variable_declarator value: (lambda_expression body: (true)) @hit))
      ; new HostnameVerifier() { public boolean verify(String h, SSLSession s) { return true; } }
      (object_creation_expression type: (type_identifier) @t (#eq? @t "HostnameVerifier")
        (class_body (method_declaration name: (identifier) @n (#eq? @n "verify")
          body: (block . (return_statement (true)) .)) @hit))
    description: >
      The certificate may be valid, but for some other host. Accepting every
      hostname lets any certificate holder impersonate this server.
    remediation: >
      Remove the verifier and use the default. If the certificate's name is
      wrong, fix the certificate.

  # ----------------------------------------------------------- randomness --
  - id: weak-random-for-secret
    requirements: [ARB-061]
    title: "`{text}` is not a cryptographic source, but this value is a secret"
    severity: medium
    confidence: medium
    dimension: security
    cwe: [CWE-338, CWE-330]
    controls: [NIST-800-218:PW.5]
    tags: [crypto, randomness]
    query: |
      (object_creation_expression type: (type_identifier) @t (#eq? @t "Random")) @hit
      (object_creation_expression type: (scoped_type_identifier) @t (#eq? @t "java.util.Random")) @hit
      (method_invocation object: (_) @o name: (identifier) @n
        (#match? @o "^(java\\.lang\\.)?Math$") (#eq? @n "random")) @hit
      ; RANDOM.nextLong() where RANDOM is a java.util.Random field of this file
      ((method_invocation object: (identifier) @o name: (identifier) @n
        (#match? @o "^[A-Z][A-Z0-9_]*$") (#not-match? @o "SECURE")
        (#match? @n "^next(Int|Long|Bytes|Double|Float|Boolean|Gaussian)$")) @hit
        (#match? @o "RAND|RNG"))
    requires_file: |
      (object_creation_expression type: (type_identifier) @t (#eq? @t "Random")) @x
      (object_creation_expression type: (scoped_type_identifier) @t (#eq? @t "java.util.Random")) @x
      (method_invocation object: (_) @o name: (identifier) @n
        (#match? @o "^(java\\.lang\\.)?Math$") (#eq? @n "random")) @x
    # Skip unless the enclosing method is about a secret: by its name, or
    # because the random value is assigned to a secret-shaped variable,
    # directly or through one local (`float rand = new Random().nextFloat();
    # String rememberMeKey = Float.toString(rand)`, or a buffer filled by
    # `nextBytes(bytes)` and then encoded), the way OWASP Benchmark's
    # remember-me cookies are made.
    unless_in_scope: |
      ((method_declaration name: (identifier) @n
         (#not-match? @n "(?i)token|secret|password|passwd|nonce|key|session|salt|otp|csrf|credential|verif|remember")) @m
        (#not-match? @m "(?s)(?i)\\w*(token|secret|password|passwd|nonce|salt|otp|session|api_?key|csrf|credential|remember\\w*|(reset|verif|invite|confirm|auth|activation|recovery|magic|unlock)\\w*(code|key|id|link))\\w*\\s*=[^;]*(Math\\.random|new\\s+(java\\.util\\.)?Random\\b|\\b[A-Z_]*(RAND|RNG)[A-Z_]*\\.next)|\\b(?P<v>\\w+)\\s*=[^;]*(Math\\.random|new\\s+(java\\.util\\.)?Random\\b|\\b[A-Z_]*(RAND|RNG)[A-Z_]*\\.next)[^;]*;.*\\b\\w*(token|secret|password|passwd|nonce|salt|otp|session|api_?key|csrf|credential|remember\\w*|(reset|verif|invite|confirm|auth|activation|recovery|magic|unlock)\\w*(code|key|id|link))\\w*\\s*=[^;]*\\b(?P=v)\\b|(Math\\.random|new\\s+(java\\.util\\.)?Random\\b|\\b[A-Z_]*(RAND|RNG)[A-Z_]*\\.next)[^;]*\\.nextBytes\\s*\\x28\\s*(?P<b>\\w+)\\s*\\x29.*\\b\\w*(token|secret|password|passwd|nonce|salt|otp|session|api_?key|csrf|credential|remember\\w*|(reset|verif|invite|confirm|auth|activation|recovery|magic|unlock)\\w*(code|key|id|link))\\w*\\s*=[^;]*\\b(?P=b)\\b"))
      ; a constructor or lambda is judged by what it assigns: the caffeine
      ; simulator seeds `this.random = new Random(seed)` in dozens of them
      ((constructor_declaration) @m
        (#not-match? @m "(?s)(?i)\\w*(token|secret|password|passwd|nonce|salt|otp|session|api_?key|csrf|credential|remember\\w*|(reset|verif|invite|confirm|auth|activation|recovery|magic|unlock)\\w*(code|key|id|link))\\w*\\s*=[^;]*(Math\\.random|new\\s+(java\\.util\\.)?Random\\b|\\b[A-Z_]*(RAND|RNG)[A-Z_]*\\.next)|\\b(?P<v>\\w+)\\s*=[^;]*(Math\\.random|new\\s+(java\\.util\\.)?Random\\b|\\b[A-Z_]*(RAND|RNG)[A-Z_]*\\.next)[^;]*;.*\\b\\w*(token|secret|password|passwd|nonce|salt|otp|session|api_?key|csrf|credential|remember\\w*|(reset|verif|invite|confirm|auth|activation|recovery|magic|unlock)\\w*(code|key|id|link))\\w*\\s*=[^;]*\\b(?P=v)\\b|(Math\\.random|new\\s+(java\\.util\\.)?Random\\b|\\b[A-Z_]*(RAND|RNG)[A-Z_]*\\.next)[^;]*\\.nextBytes\\s*\\x28\\s*(?P<b>\\w+)\\s*\\x29.*\\b\\w*(token|secret|password|passwd|nonce|salt|otp|session|api_?key|csrf|credential|remember\\w*|(reset|verif|invite|confirm|auth|activation|recovery|magic|unlock)\\w*(code|key|id|link))\\w*\\s*=[^;]*\\b(?P=b)\\b"))
      ((lambda_expression) @m
        (#not-match? @m "(?s)(?i)\\w*(token|secret|password|passwd|nonce|salt|otp|session|api_?key|csrf|credential|remember\\w*|(reset|verif|invite|confirm|auth|activation|recovery|magic|unlock)\\w*(code|key|id|link))\\w*\\s*=[^;]*(Math\\.random|new\\s+(java\\.util\\.)?Random\\b|\\b[A-Z_]*(RAND|RNG)[A-Z_]*\\.next)|\\b(?P<v>\\w+)\\s*=[^;]*(Math\\.random|new\\s+(java\\.util\\.)?Random\\b|\\b[A-Z_]*(RAND|RNG)[A-Z_]*\\.next)[^;]*;.*\\b\\w*(token|secret|password|passwd|nonce|salt|otp|session|api_?key|csrf|credential|remember\\w*|(reset|verif|invite|confirm|auth|activation|recovery|magic|unlock)\\w*(code|key|id|link))\\w*\\s*=[^;]*\\b(?P=v)\\b|(Math\\.random|new\\s+(java\\.util\\.)?Random\\b|\\b[A-Z_]*(RAND|RNG)[A-Z_]*\\.next)[^;]*\\.nextBytes\\s*\\x28\\s*(?P<b>\\w+)\\s*\\x29.*\\b\\w*(token|secret|password|passwd|nonce|salt|otp|session|api_?key|csrf|credential|remember\\w*|(reset|verif|invite|confirm|auth|activation|recovery|magic|unlock)\\w*(code|key|id|link))\\w*\\s*=[^;]*\\b(?P=b)\\b"))
    unless_in_file: *test_support
    description: >
      `java.util.Random` is a 48-bit linear congruential generator: a few
      outputs reveal its state and every future value. For a token, key,
      password or session id that means the next one can be predicted.
    remediation: "Use `SecureRandom` (and `UUID.randomUUID()` for ids)."

  # ------------------------------------------------- CWE Top 25, round 1 --
  # ARB-062: the Java rows of the ranked gap list in docs/cwe-top25.md.

  - id: jwt-unsigned-accepted
    requirements: [ARB-062]
    title: "`{text}` accepts a JWT that carries no signature"
    severity: high
    confidence: high
    dimension: security
    cwe: [CWE-287, CWE-347]
    controls: [NIST-800-218:PW.5]
    tags: [auth, jwt]
    query: |
      ; jjwt: parseClaimsJwt/parsePlaintextJwt (0.9-0.11) and
      ; parseUnsecuredClaims/parseUnsecuredContent (0.12) are the UNSIGNED
      ; variants; the signed ones end in Jws. `.unsecured()` on the parser
      ; builder lets `parse()` accept `alg: none`.
      (method_invocation name: (identifier) @hit
        (#match? @hit "^(parseClaimsJwt|parsePlaintextJwt|parseContentJwt|parseUnsecuredClaims|parseUnsecuredContent)$"))
      (method_invocation object: (_) @o name: (identifier) @hit arguments: (argument_list) @a
        (#eq? @hit "unsecured") (#match? @a "^\\(\\s*\\)$") (#match? @o "(?i)parser"))
    requires_file: |
      ((program) @p (#match? @p "\\bio\\.jsonwebtoken\\b"))
    unless_in_file: *test_support
    description: >
      These jjwt calls exist to read a token with no signature. Whoever sends
      the token chooses its claims, so `sub`, `roles` and `exp` read from it
      prove nothing about who the caller is.
    remediation: >
      Parse with a verifying parser: `Jwts.parser().verifyWith(key).build()
      .parseSignedClaims(token)` (0.12) or `parseClaimsJws` (0.11), and drop
      `.unsecured()`.

  - id: jwt-decode-without-verify
    requirements: [ARB-062]
    title: "`{text}` reads a JWT and nothing in this file verifies its signature"
    severity: high
    confidence: medium
    dimension: security
    cwe: [CWE-287, CWE-347]
    controls: [NIST-800-218:PW.5]
    tags: [auth, jwt]
    query: |
      ; auth0 java-jwt `JWT.decode(token)`; Nimbus `JWTParser.parse(token)`,
      ; `SignedJWT.parse(token)`, `PlainJWT.parse(token)`
      (method_invocation object: (identifier) @o name: (identifier) @n
        (#eq? @o "JWT") (#eq? @n "decode")) @hit
      (method_invocation object: (identifier) @o name: (identifier) @n
        (#match? @o "^(JWTParser|SignedJWT|PlainJWT|EncryptedJWT)$") (#eq? @n "parse")) @hit
    requires_file: |
      ((program) @p (#match? @p "\\bcom\\.auth0\\.jwt\\b|\\bcom\\.nimbusds\\.jwt\\b"))
    # Decoding first to read `kid`, `iss` or `alg` and choose the key is the
    # normal way to verify; so is decoding a token this file verifies
    # elsewhere. Either way a verifier is in the file.
    unless_in_file: |
      (method_invocation name: (identifier) @n (#match? @n "^(verify|require)$"))
      (method_invocation object: (_) @o name: (identifier) @n
        (#eq? @n "process") (#match? @o "(?i)processor"))
      ((import_declaration) @i
        (#match? @i "\\b(org\\.junit|junit\\.framework|org\\.testng|org\\.assertj|org\\.hamcrest|org\\.mockito|com\\.google\\.common\\.truth|com\\.google\\.common\\.testing|org\\.openjdk\\.jmh|com\\.code_intelligence\\.jazzer)\\."))
    # A peek at the issuer or key id to route the token to the right
    # verifier (spring-security's JwtIssuerAuthenticationManagerResolver and
    # its reactive twin, `JWTParser.parse(token.getToken()).getJWTClaimsSet()
    # .getIssuer()`).
    unless_inside: |
      ((method_invocation) @m
        (#match? @m "^(JWT\\.decode|JWTParser\\.parse|SignedJWT\\.parse)\\((?:[^()]|\\([^()]*\\))*\\)(\\.get(JWTClaimsSet|Header)\\(\\))?\\.get(Issuer|KeyId|KeyID|Algorithm|Type|ContentType)\\(\\)$"))
    description: >
      `JWT.decode` and Nimbus' `parse` split the token and base64-decode it;
      they do not check the signature, the expiry or the issuer. A caller
      can write any subject or role into a token and it is believed.
    remediation: >
      Verify before reading claims: `JWT.require(Algorithm.HMAC256(secret))
      .withIssuer(...).build().verify(token)` (auth0), or a
      `DefaultJWTProcessor` / `SignedJWT.verify(JWSVerifier)` (Nimbus).

  - id: hardcoded-signing-key
    requirements: [ARB-062]
    title: "`{text}` is given a key written in the source"
    severity: high
    confidence: high
    dimension: security
    cwe: [CWE-798, CWE-321]
    controls: [NIST-800-218:PW.5]
    tags: [secret, crypto, jwt]
    # @hit is the API name, never the literal, so the key itself does not
    # end up in the report or its fingerprint.
    query: |
      ; Algorithm.HMAC256("s3cret")  Algorithm.HMAC512("k".getBytes())
      ((method_invocation object: (identifier) @o name: (identifier) @hit
        arguments: (argument_list . [
          (string_literal) @lit
          (method_invocation object: (string_literal) @lit name: (identifier) @gb (#match? @gb "^(getBytes|toCharArray)$"))
          (method_invocation name: (identifier) @d arguments: (argument_list . (string_literal) @lit .) (#match? @d "^(decode|parseBase64Binary|decodeBase64)$"))
        ] .))
        (#eq? @o "Algorithm") (#match? @hit "^HMAC(256|384|512)$")
        (#not-match? @lit "(?i)^\"(|\\s*|x{3,}|\\*{3,}|\\.{3,}|change[-_ ]?me|todo|none|null|dummy|your[-_\\w]*|<[^>]*>|\\$\\{[^}]*\\}|[-_\\w]*(here|placeholder|example|redacted|notreal)[-_\\w]*)\"$"))
      ; Keys.hmacShaKeyFor("…".getBytes())  Keys.hmacShaKeyFor(Decoders.BASE64.decode("…"))
      ((method_invocation object: (identifier) @o name: (identifier) @hit
        arguments: (argument_list . [
          (method_invocation object: (string_literal) @lit name: (identifier) @gb (#match? @gb "^getBytes$"))
          (method_invocation name: (identifier) @d arguments: (argument_list . (string_literal) @lit .) (#match? @d "^(decode|parseBase64Binary|decodeBase64)$"))
        ] .))
        (#eq? @o "Keys") (#eq? @hit "hmacShaKeyFor")
        (#not-match? @lit "(?i)^\"(|\\s*|x{3,}|\\*{3,}|\\.{3,}|change[-_ ]?me|todo|none|null|dummy|your[-_\\w]*|<[^>]*>|\\$\\{[^}]*\\}|[-_\\w]*(here|placeholder|example|redacted|notreal)[-_\\w]*)\"$"))
      ; jjwt 0.9-0.11: .signWith(SignatureAlgorithm.HS256, "secret"), .setSigningKey("secret")
      ((method_invocation name: (identifier) @hit
        arguments: (argument_list [
          (string_literal) @lit
          (method_invocation object: (string_literal) @lit name: (identifier) @gb (#match? @gb "^getBytes$"))
        ]))
        (#match? @hit "^(signWith|setSigningKey)$")
        (#not-match? @lit "(?i)^\"(|\\s*|x{3,}|\\*{3,}|\\.{3,}|change[-_ ]?me|todo|none|null|dummy|your[-_\\w]*|<[^>]*>|\\$\\{[^}]*\\}|[-_\\w]*(here|placeholder|example|redacted|notreal)[-_\\w]*)\"$"))
      ; new SecretKeySpec("…".getBytes(), "HmacSHA256")
      ((object_creation_expression type: (type_identifier) @hit
        arguments: (argument_list . [
          (method_invocation object: (string_literal) @lit name: (identifier) @gb (#match? @gb "^getBytes$"))
          (method_invocation name: (identifier) @d arguments: (argument_list . (string_literal) @lit .) (#match? @d "^(decode|parseBase64Binary|decodeBase64)$"))
        ]))
        (#eq? @hit "SecretKeySpec")
        (#not-match? @lit "(?i)^\"(|\\s*|x{3,}|\\*{3,}|\\.{3,}|change[-_ ]?me|todo|none|null|dummy|your[-_\\w]*|<[^>]*>|\\$\\{[^}]*\\}|[-_\\w]*(here|placeholder|example|redacted|notreal)[-_\\w]*)\"$"))
    # Test code is skipped, as the secrets probe skips a test credential that
    # does not look generated: `roles` defaults to source, and test support
    # outside src/test is recognised by its imports.
    unless_in_file: *test_support
    description: >
      The key that signs tokens or MACs is in the source, so everyone with
      the repository, a build artifact or a decompiler can mint a token any
      service that trusts this key will accept. Rotating it means a release.
    remediation: >
      Load the key at runtime from a secret manager or the environment
      (`System.getenv("JWT_SECRET")`, a Spring `@Value` bound to a vault),
      and rotate the one that was committed.

  - id: hardcoded-db-password
    requirements: [ARB-062]
