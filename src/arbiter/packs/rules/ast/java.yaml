        (#eq? @a "ExceptionHandler")
        (#match? @t "^(java\\.lang\\.)?(Exception|RuntimeException|Throwable|Error|IOException|SQLException|\\w*SQL\\w*Exception|\\w*DataAccessException|NullPointerException|PersistenceException|HibernateException|NamingException|ReflectiveOperationException)$")
        (#match? @hit "\\b\\w+\\.(getMessage|getLocalizedMessage|toString)\\s*\\(\\s*\\)")
