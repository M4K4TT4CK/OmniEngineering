        (#match? @hit "\\b\\w+\\.(getMessage|getLocalizedMessage|toString)\\s*\\(\\s*\\)")
        (#not-match? @hit "\\b(getString|getMessage)\\s*\\(\\s*\""))
      ((catch_clause (catch_formal_parameter (catch_type) @t)
         body: (block (if_statement consequence: (block [(expression_statement [(method_invocation) (object_creation_expression)] @hit)
