# 2024 CWE Top 25, per IDE language. Generated from the matrix in
# docs/cwe-top25.md, and held to it by tests/test_controls_cwe_top25.py: edit
# both together.
#
# Unlike the framework packs, each control here carries `languages:`, one
# cell per language pack, because whether a weakness can occur at all, and
# whether a single-file check can see it, depends on the language:
#
#   status: applies         the native rules tagged with the control's `cwe`
#                           ids (and `satisfied_by`) assess it; none = a gap
#   status: not_applicable  cannot occur in this language (`reason` says why)
#   status: out_of_reach    applies, but no single-file check can establish it
#   measured:               the cell's mark in docs/cwe-top25.md (N native,
#                           S semgrep, B bandit, gap, OOR, n/a)
#
# Checks are not listed per cell: a cell is assessed by every rule in its
# language pack whose `cwe:` includes one of the control's ids, so a new rule
# tagged CWE-22 assesses CWE-22 the day it lands. Only the native checks count;
# semgrep and bandit cells (S, B) read as gaps here, because the pack says what
# Arbiter itself establishes.
framework:
  id: CWE-Top25-2024
  title: 2024 CWE Top 25 Most Dangerous Software Weaknesses, per language
  version: "2024"
  authority: https://cwe.mitre.org/top25/archive/2024/2024_top25_list.html
  baseline: All 25 weaknesses, assessed per IDE language
  declared_controls: 25
  declared_source: >-
    MITRE 2024 CWE Top 25 Most Dangerous Software Weaknesses (25 entries).
  notes: >-
    A weakness is reported per language as assessed (a native check ran),
    a gap (it applies and no native check covers it), out of reach (it
    applies and needs more than one file to establish), or not applicable
    (it cannot occur in that language). A control is not_applicable only
    when every language of the scanned codebase is n/a for it.

