name = "bandit"
dimensions = ["security"]
checks = 35
# Declared, not inherited. No measurement has established that this tool
# returns the same findings from a file subset, so a partial scan records
# it as not assessed rather than running it and believing the answer.
scope = "repo"
selects = { stacks = ["python"] }

[requires]
binaries = ["bandit"]
network = false
# The real fix for the timeout below is the -x exclusion in [invoke]: bandit
# was walking a full vendored .venv (one real system measured 129,379 raw
# findings, 669s of a 900s budget, almost all of it aws_cdk's own bundled
# Python) because `-r {workdir}` is bandit's own traversal, separate from
# inventory.SKIP_DIRS, which only governs Arbiter's native probes. This
# timeout stays generous as a backstop for a repository that is legitimately
# all first-party Python, not as the primary defense.
timeout = 900

[invoke]
# The exclude list mirrors inventory.SKIP_DIRS. Bandit's own defaults
# (.svn,CVS,.bzr,.hg,.git,__pycache__,.tox,.eggs,*.egg) do not cover
# .venv/node_modules/site-packages, and -x is additive, not a replacement, so
# repeating the ones it already covers costs nothing. Bare names do not
# match a nested directory (`-x .venv` misses `sub/.venv`); glob patterns do,
# confirmed against a synthetic tree with .venv nested at two depths.
#
# cdk.out* is excluded here even though inventory.SKIP_DIRS deliberately does
# NOT skip it (the synthesized template is ground truth Arbiter's own probes
# want) -- that reasoning does not carry over to bandit specifically. Bandit
# only ever reads Python, a CDK template is JSON, and everything else under
# cdk.out* is a Lambda asset bundle's vendored third-party dependencies,
# never this repository's own code. `*` after `cdk.out` because CDK_OUTDIR
# lets a project redirect synth output to a renamed directory (`cdk.out.chk`,
# seen on a real system).
argv = ["bandit", "-r", "{workdir}", "-f", "json", "-q", "-x", """\
*/.git/*,*/.hg/*,*/.svn/*,*/node_modules/*,*/.venv/*,*/venv/*,\
*/__pycache__/*,*/.mypy_cache/*,*/.pytest_cache/*,*/.ruff_cache/*,\
*/.terraform/*,*/.tox/*,*/site-packages/*,*/.next/*,*/.nuxt/*,\
*/.gradle/*,*/.idea/*,*/.vscode/*,*/vendor/*,*/target/*,*/.arbiter/*,\
*/cdk.out*/*\
"""]
version_argv = ["bandit", "--version"]
parse = "json"
ok_exit = [0, 1]

[map]
findings = "$.results[*]"
rule_id = "test_id"
title = "issue_text"
path = "filename"
line = "line_number"
severity = "issue_severity"
severity_default = "medium"
dimension = "security"
remediation = "more_info"
remediation_default = "Review Bandit check {rule_id}'s trigger at this line and apply the standard fix for that class of issue (bandit.readthedocs.io, plugin listing) -- no specific fix text is catalogued for this check id yet."

[map.severity_table]
high = "high"
medium = "medium"
low = "low"

# A specific rule id has one well-known mitigation; a link to "go read the
# docs" is not that. This is Bandit's fixed, documented plugin catalog, so
# it does not drift the way a heuristic mapping would.
[map.remediation_table]
B101 = "Don't rely on `assert` for a runtime check -- `python -O` strips it. Raise an explicit exception (e.g. `ValueError`) instead."
B102 = "Avoid `exec`; restructure the code to call a specific function instead of executing a string."
B103 = "Use a stricter file mode (e.g. 0o600/0o640) instead of one that is world- or group-writable."
B104 = "Bind to a specific interface/address instead of 0.0.0.0, or gate the bind address behind config so it defaults safely."
B105 = "Move this credential to a secret manager or environment variable and load it at runtime; don't leave it as a literal."
B106 = "Load this credential from a secret manager or environment variable instead of passing it as a literal argument."
B107 = "Remove the hardcoded default; require the credential to be supplied via config or a secret manager, with no fallback value."
B108 = "Use `tempfile.mkstemp()` or `tempfile.NamedTemporaryFile()` instead of a fixed path under /tmp, which another local user can pre-create or symlink."
B110 = "Log or handle the exception instead of silently passing; a bare `except: pass` hides real failures."
B112 = "Log the exception before continuing the loop, or narrow the except clause so it doesn't swallow unrelated errors."
B113 = "Pass an explicit `timeout=` to this request so a hung remote host can't block the process indefinitely."
B201 = "Set `debug=False` (or drive it from an environment variable that is False in production); Flask's debugger allows remote code execution."
B202 = "Validate each member's path before extracting (or use `tarfile.data_filter`) to prevent path traversal on extract."
B301 = "Don't unpickle untrusted data; use `json` or a schema-validated format instead."
B302 = "Don't unmarshal untrusted data; use `json` instead."
B303 = "Use `hashlib.sha256` or better (or add `usedforsecurity=False` if this hash is genuinely not security-relevant)."
B304 = "Use an authenticated, modern cipher mode (e.g. AES-GCM) instead of this weak cipher."
B305 = "Use an authenticated, modern cipher mode (e.g. AES-GCM) instead of ECB/CBC without a MAC."
B306 = "Use `tempfile.mkstemp()` instead of the racy `tempfile.mktemp()`."
B307 = "Avoid `eval`; use `ast.literal_eval` for data, or a proper parser for anything else."
B308 = "Avoid `mark_safe` on untrusted input; let Django's autoescaping handle it, or sanitize first."
