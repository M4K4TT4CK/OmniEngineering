framework:
  id: PCI-DSS-v4
  title: PCI DSS v4.0 — Payment Card Industry Data Security Standard
  version: "4.0"
  authority: https://www.pcisecuritystandards.org/
  baseline: All 12 principal requirements
  # 12 principal requirements, each broken into numbered requirement sections
  # at the x.y level (1.1 through 12.10). There are 63 of those sections, and
  # the section is the unit of this pack. Beneath them sit the individual
  # x.y.z requirements, which number in the hundreds; a scanner cannot resolve
  # most of them and this pack does not pretend to count them. Following the
  # convention of the government packs, the denominator is the framework's
  # real size at the chosen unit, not the number of controls listed below.
  declared_controls: 63
  declared_source: >-
    PCI DSS v4.0 — 12 principal requirements, 63 numbered requirement
    sections at the x.y level (1.1–1.5, 2.1–2.3, 3.1–3.7, 4.1–4.2, 5.1–5.4,
    6.1–6.5, 7.1–7.3, 8.1–8.6, 9.1–9.5, 10.1–10.7, 11.1–11.6, 12.1–12.10).
    This pack enumerates the scanner-relevant subset and a representative set
    of the rest; everything not listed resolves to "not enumerated".
  notes: >-
    An INDEPENDENT pack. PCI DSS is an ASSESSED standard: a requirement is in
    place when a Qualified Security Assessor (or a self-assessing merchant
    under the applicable SAQ) accepts evidence for it, against the published
    testing procedures, within a defined and validated cardholder data
    environment. A clean scan of a repository is not compliance with any
    requirement in this pack. It is one piece of evidence an assessor may
    consider, and for most requirements it is a small piece.

    Two things a reader should know before quoting a figure from this pack.
    First, PCI DSS applies to the cardholder data environment, and a scanner
    has no idea where that boundary is; a finding in a repository that never
    touches account data is out of scope, and a clean repository that is in
    scope proves nothing about the rest of the CDE. Second, several
    requirements fix parameters a scanner cannot see — Requirement 3.5.1 is
    not satisfied by disk encryption alone, 10.5 fixes a twelve-month log
    retention, 11.3 requires scans by an Approved Scanning Vendor. Every such
    control is "partial" below, and the residual says which parameter is out
    of reach.

    Requirement identifiers and titles were transcribed from the public
    PCI DSS v4.0 document and its summary of changes. PCI DSS is a licensed
    document; verify every identifier and title against the licensed text
    before any of this appears in a Report on Compliance or SAQ.

controls:
  # ---- Requirement 1 — Install and Maintain Network Security Controls ----
  - id: "1.2"
    title: Network security controls (NSCs) are configured and maintained
    family: "Requirement 1 — Network Security Controls"
    automatable: partial
    machine_scope: >-
      Ingress rules admitting any address, and workloads sharing the host
      network namespace, as declared in infrastructure code.
    residual: >-
      The ruleset review every six months (1.2.7), the change-approval record
      for every NSC change (1.2.2), and the network diagrams (1.2.3, 1.2.4).
      A rule being present says nothing about whether it was approved.
    satisfied_by:
      - arbiter/resource.unrestricted-ingress
      - arbiter/resource.host-network
      - arbiter/resource.k8s-host-namespace

  - id: "1.3"
    title: Network access to and from the cardholder data environment is restricted
    family: "Requirement 1 — Network Security Controls"
    automatable: partial
    machine_scope: >-
      Storage and databases declared publicly reachable, and ingress rules
      open to the world.
    residual: >-
      Where the CDE boundary is. A scanner cannot tell a public bucket of
      marketing assets from a public bucket of PAN; the assessor's scoping
      exercise can, and that is the whole requirement.
    satisfied_by:
      - arbiter/resource.unrestricted-ingress
      - arbiter/resource.database-publicly-accessible
      - arbiter/resource.public-object-store

  - id: "1.4"
    title: Network connections between trusted and untrusted networks are controlled
    family: "Requirement 1 — Network Security Controls"
    automatable: partial
    machine_scope: >-
      Databases declared reachable from the internet, and security groups
      admitting any address.
    residual: >-
      Anti-spoofing measures (1.4.3), outbound traffic restriction (1.4.4),
      and disclosure of internal addresses (1.4.5). All of these are enforced
      on devices no repository declares.
    satisfied_by:
      - arbiter/resource.database-publicly-accessible
      - arbiter/resource.unrestricted-ingress
      - checkov/CKV_AWS_382

  # ---- Requirement 2 — Apply Secure Configurations --------------------------
  - id: "2.2"
    title: System components are configured and managed securely
    family: "Requirement 2 — Secure Configurations"
    automatable: partial
    machine_scope: >-
      Declared workload settings measured against this build's rules: security
      contexts, root, privilege escalation, capabilities, writable root
      filesystems, privileged containers; plus non-console administrative
      access declared without TLS (2.2.7).
    residual: >-
      The configuration standard itself (2.2.1), which must follow an
      industry-accepted hardening guide that Arbiter's rules are not; vendor
      default accounts changed or removed (2.2.2); one primary function per
      server (2.2.3); unnecessary services removed (2.2.4). A pass here is
      not a benchmark pass.
    satisfied_by:
      - arbiter/resource.k8s-no-security-context
      - arbiter/resource.k8s-runs-as-root
      - arbiter/resource.k8s-not-run-as-non-root
      - arbiter/resource.k8s-privilege-escalation
      - arbiter/resource.k8s-privilege-escalation-not-disabled
      - arbiter/resource.k8s-capabilities-not-dropped
      - arbiter/resource.k8s-dangerous-capabilities
      - arbiter/resource.k8s-writable-root-filesystem
      - arbiter/resource.privileged-container
      - arbiter/resource.plaintext-listener
      - arbiter/resource.weak-tls-version

  # ---- Requirement 3 — Protect Stored Account Data --------------------------
  - id: "3.3"
    title: Sensitive authentication data (SAD) is not stored after authorization
    family: "Requirement 3 — Stored Account Data"
    automatable: none
    residual: >-
      Examination of data stores, logs and debugging output for track data,
      card verification codes and PINs. A scanner cannot recognise SAD in a
      database it never reads.
    satisfied_by: []

  - id: "3.5"
    title: Primary account number (PAN) is secured wherever it is stored
    family: "Requirement 3 — Stored Account Data"
    automatable: partial
    machine_scope: >-
      Encryption at rest requested on declared storage resources.
    residual: >-
      Requirement 3.5.1 requires PAN rendered unreadable by one-way hashing,
      truncation, index tokens, or strong cryptography with associated key
      management. Disk- or partition-level encryption on non-removable media
      does not on its own satisfy it (3.5.1.2). So a storage resource with
      encryption switched on is NOT this requirement met, and this is the
      control most often over-claimed from a scan result. The assessor also
      needs to know which stores hold PAN at all.
    satisfied_by:
      - arbiter/resource.unencrypted-database
      - arbiter/resource.unencrypted-object-store
      - arbiter/resource.unencrypted-volume
      - arbiter/resource.unencrypted-queue
      - checkov/CKV_AWS_16
      - checkov/CKV_AWS_19

  - id: "3.6"
    title: Cryptographic keys used to protect stored account data are secured
    family: "Requirement 3 — Stored Account Data"
    automatable: partial
    machine_scope: >-
      Private key material and credentials committed to version control,
      which is the opposite of the fewest possible locations.
    residual: >-
      Key-encrypting keys, key storage in the fewest locations (3.6.1.2,
      3.6.1.3), custodian acknowledgements, and the fact that no key found in
      source is not evidence that the keys in use are secured.
    satisfied_by:
      - arbiter/secrets.private-key
      - arbiter/secrets.assigned-credential
      - checkov/CKV_AWS_7
      - checkov/CKV_AWS_33

  - id: "3.7"
    title: Key management processes cover the full key lifecycle
    family: "Requirement 3 — Stored Account Data"
    automatable: none
    residual: >-
      Generation, distribution, storage, rotation, retirement and custodian
      procedures, documented and followed. A process, not a configuration.
    satisfied_by: []

  # ---- Requirement 4 — Strong Cryptography in Transmission ------------------
  - id: "4.2"
    title: PAN is protected with strong cryptography during transmission
    family: "Requirement 4 — Transmission Over Open, Public Networks"
    automatable: partial
    machine_scope: >-
      Listeners declared without TLS, TLS policies that admit 1.0 or 1.1,
      HTTP endpoints that do not redirect, databases that accept plaintext
      connections, and code that disables certificate verification or pins
      withdrawn protocol versions.
    residual: >-
      The inventory of trusted keys and certificates (4.2.1.1), certificate
      validity and expiry, which transmissions carry PAN at all, and
      end-user messaging technologies (4.2.2). TLS on is necessary; it is not
      "strong cryptography" until the cipher policy has been read.
    satisfied_by:
      - arbiter/resource.plaintext-listener
      - arbiter/resource.weak-tls-version
      - arbiter/resource.no-https-redirect
      - arbiter/resource.database-allows-plaintext-connections
      - checkov/CKV_AWS_2
      - checkov/CKV_AWS_103
      - bandit/B501
      - bandit/B502
      - bandit/B503

  # ---- Requirement 5 — Malicious Software -----------------------------------
  - id: "5.2"
    title: Malicious software is prevented, or detected and addressed
    family: "Requirement 5 — Malicious Software"
    automatable: none
    residual: >-
      Anti-malware deployed on in-scope components, kept current, with
      periodic scans. A repository scanner is not an anti-malware solution
      and should not be presented as one.
    satisfied_by: []

  # ---- Requirement 6 — Develop and Maintain Secure Systems and Software ----
  - id: "6.2"
    title: Bespoke and custom software are developed securely
    family: "Requirement 6 — Secure Systems and Software"
    automatable: partial
    machine_scope: >-
      Patterns static analysis recognises in first-party code: hardcoded
      credentials, string-built SQL, weak hashes, and whatever the semgrep
      ruleset in this build covers.
    residual: >-
      Developer training at least annually (6.2.2); code review before
      release by someone other than the author (6.2.3); and the full list of
      attack classes 6.2.4 names, most of which no rule here covers. A clean
      result is weak evidence and should be reported as weak.
    satisfied_by:
      - bandit/B105
      - bandit/B608
      - bandit/B303
      - semgrep/rules
      - arbiter/secrets.assigned-credential

  - id: "6.3"
    title: Security vulnerabilities are identified and addressed
    family: "Requirement 6 — Secure Systems and Software"
    automatable: partial
    machine_scope: >-
      That static analysis ran, with its coverage recorded; whether
      third-party components are pinned to known versions, which is the
      precondition for the component inventory 6.3.2 asks for; whether
      managed services and image registries are set to take patches and
      scan images.
    residual: >-
      Industry vulnerability sources monitored and risk-ranked (6.3.1), the
      inventory itself (6.3.2), and critical patches applied within one month
      of release (6.3.3). Remediation evidence lives in a ticketing system,
      not a repository.
    satisfied_by:
      - checkov/CKV_AWS_1
      - bandit/B105
      - arbiter/supply.unpinned-python-dep
      - arbiter/supply.unpinned-npm-dep
      - checkov/CKV_AWS_226
      - checkov/CKV_AWS_163

  - id: "6.4"
    title: Public-facing web applications are protected against attacks
    family: "Requirement 6 — Secure Systems and Software"
    automatable: none
    residual: >-
      A web application firewall in blocking mode or an application
      vulnerability assessment at least annually and after changes (6.4.1,
      6.4.2), and the payment-page script inventory and integrity mechanism
      (6.4.3). All runtime; none declared in source.
    satisfied_by: []

  - id: "6.5"
    title: Changes to all system components are managed securely
    family: "Requirement 6 — Secure Systems and Software"
    automatable: partial
    machine_scope: >-
      Whether what deploys is pinned to what was reviewed — CI actions and
      container images on mutable references — and CI workflows that execute
      untrusted code with access to secrets.
    residual: >-
      Documented reason, approval, security impact and back-out for every
      change (6.5.1); production and pre-production separation (6.5.3, 6.5.4);
      live PANs kept out of pre-production (6.5.5); test data removed before
      go-live (6.5.6).
    satisfied_by:
      - arbiter/supply.unpinned-action
      - arbiter/resource.k8s-mutable-image-tag
      - arbiter/supply.pull-request-target

  # ---- Requirement 7 — Restrict Access by Business Need to Know -------------
  - id: "7.2"
    title: Access to system components and data is appropriately defined and assigned
    family: "Requirement 7 — Access by Need to Know"
    automatable: partial
    machine_scope: >-
      IAM grants that nothing in the system uses, and policies attached
      directly to users rather than roles or groups.
    residual: >-
      Access assigned by job classification and function (7.2.1, 7.2.2),
      documented approval (7.2.3), user account reviews at least every six
      months (7.2.4), and least privilege for application and system
      accounts (7.2.5). The review record is the evidence; a tidy policy
      is not.
    satisfied_by:
      - arbiter/interface.permission-unused
      - checkov/CKV_AWS_1
      - checkov/CKV_AWS_62
      - checkov/CKV_AWS_63

  - id: "7.3"
    title: Access to system components and data is managed via an access control system
    family: "Requirement 7 — Access by Need to Know"
    automatable: partial
    machine_scope: >-
      Storage and databases declared publicly reachable, which is a default
      of "allow all" where 7.3.3 requires "deny all".
    residual: >-
      Whether the access control system covers all system components and
      enforces at the user level, which no declared resource shows.
    satisfied_by:
      - arbiter/resource.public-object-store
      - arbiter/resource.database-publicly-accessible
      - checkov/CKV_AWS_20
      - checkov/CKV_AWS_57

  # ---- Requirement 8 — Identify Users and Authenticate Access ---------------
  - id: "8.2"
    title: User identification and related accounts are strictly managed
    family: "Requirement 8 — Identification and Authentication"
    automatable: none
    residual: >-
      Unique IDs, no shared accounts, terminated users removed, inactive
      accounts disabled after 90 days. All properties of the identity
      provider and the joiners-and-leavers process.
    satisfied_by: []

  - id: "8.3"
    title: Strong authentication for users and administrators is established and managed
    family: "Requirement 8 — Identification and Authentication"
    automatable: partial
    machine_scope: >-
      Authentication factors stored unprotected in version control — keys,
      tokens, credentialed URLs — which is storage where 8.3.2 requires them
      rendered unreadable.
    residual: >-
      Lockout after ten attempts (8.3.4), minimum length twelve (8.3.6),
      change every ninety days or dynamic analysis (8.3.9), and the
      transmission side of 8.3.2. No secret found in source evidences none
      of these.
    satisfied_by:
      - arbiter/secrets.private-key
      - arbiter/secrets.aws-access-key
      - arbiter/secrets.gh-token
      - arbiter/secrets.pg-url
      - arbiter/secrets.jwt

  - id: "8.4"
    title: Multi-factor authentication (MFA) is implemented to secure access into the CDE
    family: "Requirement 8 — Identification and Authentication"
    automatable: none
    residual: >-
      MFA for all non-console administrative access and all access into the
      CDE. A property of the identity provider and the network edge.
    satisfied_by: []

  - id: "8.6"
    title: Use of application and system accounts and associated authentication factors is strictly managed
    family: "Requirement 8 — Identification and Authentication"
    automatable: partial
    machine_scope: >-
      Passwords and keys for application and system accounts hard-coded in
      scripts, configuration files and source, which 8.6.2 names directly.
      This is the requirement a secrets scan speaks to most exactly.
    residual: >-
      Interactive login for system accounts limited and logged (8.6.1), and
      rotation of system account passwords at a frequency set by the
      entity's risk analysis (8.6.3). Finding nothing in the tree is not
      evidence that secrets injected at runtime are handled well.
    satisfied_by:
      - arbiter/secrets.assigned-credential
      - arbiter/secrets.private-key
      - arbiter/secrets.aws-access-key
      - arbiter/secrets.gh-token
      - arbiter/secrets.slack-token
      - arbiter/secrets.slack-webhook
      - arbiter/secrets.pg-url
      - arbiter/secrets.stripe-key
      - arbiter/secrets.google-api-key
      - arbiter/secrets.gitlab-token
      - arbiter/secrets.npm-token
      - arbiter/secrets.sendgrid-key
      - arbiter/secrets.pypi-token
      - arbiter/secrets.openai-key
      - arbiter/secrets.anthropic-key
      - bandit/B105

  # ---- Requirement 9 — Restrict Physical Access -----------------------------
  - id: "9.2"
    title: Physical access controls manage entry into facilities and systems containing cardholder data
    family: "Requirement 9 — Physical Access"
    automatable: none
    residual: >-
      Badges, visitor logs, camera retention and a site walk. Usually
      inherited from a hosting provider's own attestation, which the assessor
      reads; a customer scan cannot evidence it either way.
    satisfied_by: []

  # ---- Requirement 10 — Log and Monitor All Access --------------------------
  - id: "10.2"
    title: Audit logs are implemented to support detection and forensic analysis
    family: "Requirement 10 — Logging and Monitoring"
    automatable: partial
    machine_scope: >-
      Access logging declared on object stores, a multi-region trail declared
      for the cloud control plane, and logging on the trail's own bucket.
    residual: >-
      The event set 10.2.1 enumerates (every access to cardholder data, every
      administrative action, every authentication failure, and more) and the
      record details 10.2.2 fixes. Logging being on is not logging the right
      things.
    satisfied_by:
      - arbiter/resource.no-object-store-logging
      - checkov/CKV_AWS_18
      - checkov/CKV_AWS_67
      - checkov/CKV_AWS_35

  - id: "10.3"
    title: Audit logs are protected from destruction and unauthorized modifications
    family: "Requirement 10 — Logging and Monitoring"
    automatable: partial
    machine_scope: >-
      Log file integrity validation declared on the cloud audit trail.
    residual: >-
      Read access limited to need (10.3.1), prompt backup to a separate
      system (10.3.3), and file integrity monitoring or change detection on
      every log, not only the cloud trail (10.3.4).
    satisfied_by:
      - checkov/CKV_AWS_36
      - checkov/CKV_AWS_35

  - id: "10.4"
    title: Audit logs are reviewed to identify anomalies or suspicious activity
    family: "Requirement 10 — Logging and Monitoring"
    automatable: none
    residual: >-
      Daily review of security event logs, with the review and its follow-up
      recorded. A human and organizational process.
    satisfied_by: []

  - id: "10.5"
    title: Audit log history is retained and available for analysis
    family: "Requirement 10 — Logging and Monitoring"
    automatable: partial
    machine_scope: Whether a retention period is set on declared log groups at all.
    residual: >-
      PCI DSS fixes the period — at least twelve months, with the most recent
      three immediately available (10.5.1). A check that sees "a period is
      set" cannot tell whether it meets that, and must not be read as if it
      could.
    satisfied_by:
      - arbiter/resource.no-log-retention

  - id: "10.6"
    title: Time-synchronization mechanisms support consistent time settings across all systems
    family: "Requirement 10 — Logging and Monitoring"
    automatable: none
    residual: >-
      NTP configuration on hosts and the designated time sources. Host
      configuration, not repository content.
    satisfied_by: []

  # ---- Requirement 11 — Test Security Regularly -----------------------------
  - id: "11.3"
    title: External and internal vulnerabilities are regularly identified, prioritized and addressed
    family: "Requirement 11 — Security Testing"
    automatable: partial
    machine_scope: >-
      That static and infrastructure analysis ran, with coverage recorded,
      and that container images are scanned on push.
    residual: >-
      Internal scans at least every three months with authenticated scanning
      (11.3.1), external scans by a PCI SSC Approved Scanning Vendor
      (11.3.2), rescans until passing, and remediation records. A SAST run is
      not an ASV scan and no assessor will accept it as one.
    satisfied_by:
      - checkov/CKV_AWS_1
      - bandit/B105
      - checkov/CKV_AWS_163

  - id: "11.4"
    title: External and internal penetration testing is regularly performed
    family: "Requirement 11 — Security Testing"
    automatable: none
    residual: >-
      A penetration test at least annually and after significant change, by
      a qualified tester, with a report. Not a scan of any kind.
    satisfied_by: []

  - id: "11.6"
    title: Unauthorized changes on payment pages are detected and responded to
    family: "Requirement 11 — Security Testing"
    automatable: none
    residual: >-
      A change- and tamper-detection mechanism on the payment page as
      received by the consumer browser, evaluated at least weekly. Runtime,
      client-side, and outside any source tree.
    satisfied_by: []

  # ---- Requirement 12 — Organizational Policies and Programs ----------------
  - id: "12.1"
    title: A comprehensive information security policy is known and current
    family: "Requirement 12 — Policies and Programs"
    automatable: none
    residual: A policy, reviewed annually, acknowledged by personnel.
    satisfied_by: []

  - id: "12.5"
    title: PCI DSS scope is documented and validated
    family: "Requirement 12 — Policies and Programs"
    automatable: none
    residual: >-
      The scoping exercise, at least annually, that decides what every other
      requirement applies to. A scanner cannot see scope; it only sees files.
    satisfied_by: []

  - id: "12.10"
    title: Suspected and confirmed security incidents are responded to immediately
    family: "Requirement 12 — Policies and Programs"
    automatable: none
    residual: An incident response plan, tested at least annually, with trained responders.
    satisfied_by: []
