    reason: "OmniEngineering tooling, maintained upstream; see .ai/omni-version.json"
    expires: 2099-01-01
  - rule: "semgrep/*"
    path: "omni_mcp.py"
    reason: "OmniEngineering tooling, maintained upstream; see .ai/omni-version.json"
    expires: 2099-01-01
  - rule: "bandit/*"
