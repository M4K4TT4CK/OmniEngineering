<svg width="1200" height="520" viewBox="0 0 1200 520" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">OmniContext architecture diagram</title>
  <desc id="desc">A central .ai source-of-truth directory routes shared project context to Claude Code, Cursor, and GitHub Copilot.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="520" gradientUnits="userSpaceOnUse">
      <stop stop-color="#102033"/>
      <stop offset="0.58" stop-color="#123B43"/>
      <stop offset="1" stop-color="#2F4B2E"/>
    </linearGradient>
    <linearGradient id="hub" x1="408" y1="94" x2="792" y2="426" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F5F0DC"/>
      <stop offset="1" stop-color="#9FD8CB"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FFFFFF" stop-opacity="0.19"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.08"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#020817" flood-opacity="0.32"/>
    </filter>
  </defs>

  <rect width="1200" height="520" rx="28" fill="url(#bg)"/>
  <path d="M110 420C213 306 317 267 470 302C639 340 692 228 851 177C947 146 1032 159 1090 198" stroke="#F5F0DC" stroke-opacity="0.22" stroke-width="2"/>
  <path d="M92 139C220 222 319 232 456 181C583 134 697 84 850 118C960 142 1043 207 1110 295" stroke="#9FD8CB" stroke-opacity="0.18" stroke-width="2"/>

  <g filter="url(#shadow)">
    <rect x="382" y="83" width="436" height="354" rx="26" fill="url(#hub)"/>
    <rect x="404" y="105" width="392" height="310" rx="18" fill="#102033" fill-opacity="0.9"/>
    <text x="600" y="164" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="44" font-weight="800" fill="#F8FAFC">.ai/</text>
    <text x="600" y="198" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="600" fill="#9FD8CB">single source of truth</text>

    <rect x="445" y="236" width="310" height="38" rx="8" fill="#F5F0DC" fill-opacity="0.12"/>
    <text x="466" y="261" font-family="Inter, Arial, sans-serif" font-size="16" fill="#F8FAFC">core-context.md</text>
    <text x="704" y="261" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="13" fill="#9FD8CB">global rules</text>

    <rect x="445" y="286" width="310" height="38" rx="8" fill="#F5F0DC" fill-opacity="0.12"/>
    <text x="466" y="311" font-family="Inter, Arial, sans-serif" font-size="16" fill="#F8FAFC">rules/</text>
    <text x="704" y="311" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="13" fill="#9FD8CB">domain constraints</text>

    <rect x="445" y="336" width="310" height="38" rx="8" fill="#F5F0DC" fill-opacity="0.12"/>
    <text x="466" y="361" font-family="Inter, Arial, sans-serif" font-size="16" fill="#F8FAFC">project-configuration.md</text>
    <text x="704" y="361" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="13" fill="#9FD8CB">local settings</text>
  </g>

  <g stroke="#F5F0DC" stroke-width="3" stroke-linecap="round" stroke-opacity="0.78">
    <path d="M382 179H273"/>
    <path d="M382 260H273"/>
    <path d="M382 341H273"/>
    <path d="M818 179H927"/>
    <path d="M818 260H927"/>
    <path d="M818 341H927"/>
  </g>
  <g fill="#F5F0DC" fill-opacity="0.78">
    <path d="M275 179L291 170V188L275 179Z"/>
    <path d="M275 260L291 251V269L275 260Z"/>
    <path d="M275 341L291 332V350L275 341Z"/>
    <path d="M925 179L909 170V188L925 179Z"/>
    <path d="M925 260L909 251V269L925 260Z"/>
    <path d="M925 341L909 332V350L925 341Z"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="76" y="137" width="196" height="84" rx="16" fill="url(#card)" stroke="#F5F0DC" stroke-opacity="0.28"/>
    <text x="174" y="174" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#F8FAFC">CLAUDE.md</text>
    <text x="174" y="200" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" fill="#9FD8CB">Claude Code</text>

    <rect x="76" y="218" width="196" height="84" rx="16" fill="url(#card)" stroke="#F5F0DC" stroke-opacity="0.28"/>
    <text x="174" y="255" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#F8FAFC">.cursorrules</text>
    <text x="174" y="281" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" fill="#9FD8CB">Cursor</text>

    <rect x="76" y="299" width="196" height="84" rx="16" fill="url(#card)" stroke="#F5F0DC" stroke-opacity="0.28"/>
    <text x="174" y="334" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#F8FAFC">copilot</text>
    <text x="174" y="357" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" fill="#9FD8CB">GitHub Copilot</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="928" y="137" width="196" height="84" rx="16" fill="url(#card)" stroke="#9FD8CB" stroke-opacity="0.32"/>
    <text x="1026" y="174" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="700" fill="#F8FAFC">requirements</text>
    <text x="1026" y="200" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" fill="#9FD8CB">REQ traceability</text>

    <rect x="928" y="218" width="196" height="84" rx="16" fill="url(#card)" stroke="#9FD8CB" stroke-opacity="0.32"/>
    <text x="1026" y="255" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="700" fill="#F8FAFC">validation</text>
    <text x="1026" y="281" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" fill="#9FD8CB">test, lint, build</text>

    <rect x="928" y="299" width="196" height="84" rx="16" fill="url(#card)" stroke="#9FD8CB" stroke-opacity="0.32"/>
    <text x="1026" y="334" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="700" fill="#F8FAFC">handoff</text>
    <text x="1026" y="357" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" fill="#9FD8CB">docs, changelog, PR</text>
  </g>

  <text x="600" y="46" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="800" fill="#F8FAFC">OmniContext</text>
  <text x="600" y="482" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" fill="#DCE9E2">One workspace brain. Many AI coding assistants. Same rules every time.</text>
</svg>
