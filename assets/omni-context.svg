<svg width="1200" height="520" viewBox="0 0 1200 520" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">OmniEngineering workspace architecture</title>
  <desc id="desc">A repo-local engineering workspace connects requirements, rules, knowledge, delivery workflow, assistant context, and validation.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="520" gradientUnits="userSpaceOnUse">
      <stop stop-color="#171614"/>
      <stop offset="0.52" stop-color="#252829"/>
      <stop offset="1" stop-color="#2D312A"/>
    </linearGradient>
    <linearGradient id="core" x1="412" y1="92" x2="788" y2="432" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F4EFE4"/>
      <stop offset="0.48" stop-color="#D88C2D"/>
      <stop offset="1" stop-color="#18A999"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.06"/>
    </linearGradient>
    <filter id="shadow" x="-18%" y="-22%" width="136%" height="144%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#050505" flood-opacity="0.38"/>
    </filter>
  </defs>

  <rect width="1200" height="520" rx="26" fill="url(#bg)"/>
  <path d="M86 118H1114" stroke="#F4EFE4" stroke-opacity="0.08" stroke-width="1"/>
  <path d="M86 260H1114" stroke="#F4EFE4" stroke-opacity="0.08" stroke-width="1"/>
  <path d="M86 402H1114" stroke="#F4EFE4" stroke-opacity="0.08" stroke-width="1"/>
  <path d="M194 74V446" stroke="#F4EFE4" stroke-opacity="0.07" stroke-width="1"/>
  <path d="M600 74V446" stroke="#F4EFE4" stroke-opacity="0.07" stroke-width="1"/>
  <path d="M1006 74V446" stroke="#F4EFE4" stroke-opacity="0.07" stroke-width="1"/>

  <text x="600" y="48" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="800" letter-spacing="0" fill="#F4EFE4">OmniEngineering</text>
  <text x="600" y="78" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600" letter-spacing="0" fill="#B9C5BE">Repo-local engineering workspace for AI-assisted delivery</text>

  <g filter="url(#shadow)">
    <rect x="398" y="112" width="404" height="292" rx="24" fill="url(#core)"/>
    <rect x="418" y="132" width="364" height="252" rx="16" fill="#171614" fill-opacity="0.94"/>
    <text x="600" y="184" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="850" letter-spacing="0" fill="#F4EFE4">.ai/</text>
    <text x="600" y="215" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="0" fill="#18A999">workspace source of truth</text>

    <rect x="456" y="246" width="288" height="34" rx="7" fill="#F4EFE4" fill-opacity="0.1"/>
    <text x="476" y="268" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#F4EFE4">rules + requirements</text>
    <text x="724" y="268" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#D88C2D">control</text>

    <rect x="456" y="294" width="288" height="34" rx="7" fill="#F4EFE4" fill-opacity="0.1"/>
    <text x="476" y="316" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#F4EFE4">playbooks + knowledge</text>
    <text x="724" y="316" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#18A999">method</text>

    <rect x="456" y="342" width="288" height="34" rx="7" fill="#F4EFE4" fill-opacity="0.1"/>
    <text x="476" y="364" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#F4EFE4">validation + handoff</text>
    <text x="724" y="364" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#7FB069">delivery</text>
  </g>

  <g stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M398 184H286" stroke="#D88C2D" stroke-opacity="0.82"/>
    <path d="M398 258H286" stroke="#18A999" stroke-opacity="0.82"/>
    <path d="M398 332H286" stroke="#7FB069" stroke-opacity="0.82"/>
    <path d="M802 184H914" stroke="#18A999" stroke-opacity="0.82"/>
    <path d="M802 258H914" stroke="#D88C2D" stroke-opacity="0.82"/>
    <path d="M802 332H914" stroke="#7FB069" stroke-opacity="0.82"/>
  </g>
  <g>
    <path d="M290 184L304 176V192L290 184Z" fill="#D88C2D"/>
    <path d="M290 258L304 250V266L290 258Z" fill="#18A999"/>
    <path d="M290 332L304 324V340L290 332Z" fill="#7FB069"/>
    <path d="M910 184L896 176V192L910 184Z" fill="#18A999"/>
    <path d="M910 258L896 250V266L910 258Z" fill="#D88C2D"/>
    <path d="M910 332L896 324V340L910 332Z" fill="#7FB069"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="78" y="140" width="208" height="88" rx="14" fill="url(#panel)" stroke="#D88C2D" stroke-opacity="0.38"/>
    <text x="182" y="174" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800" fill="#F4EFE4">Requirements</text>
    <text x="182" y="200" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#C5C0B6">REQ traceability</text>

    <rect x="78" y="214" width="208" height="88" rx="14" fill="url(#panel)" stroke="#18A999" stroke-opacity="0.36"/>
    <text x="182" y="248" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800" fill="#F4EFE4">Context</text>
    <text x="182" y="274" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#C5C0B6">models and assistants</text>

    <rect x="78" y="288" width="208" height="88" rx="14" fill="url(#panel)" stroke="#7FB069" stroke-opacity="0.36"/>
    <text x="182" y="322" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800" fill="#F4EFE4">Knowledge</text>
    <text x="182" y="348" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#C5C0B6">SWEBOK-aligned</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="914" y="140" width="208" height="88" rx="14" fill="url(#panel)" stroke="#18A999" stroke-opacity="0.36"/>
    <text x="1018" y="174" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800" fill="#F4EFE4">Assistants</text>
    <text x="1018" y="200" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#C5C0B6">Codex, Claude, Cursor</text>

    <rect x="914" y="214" width="208" height="88" rx="14" fill="url(#panel)" stroke="#D88C2D" stroke-opacity="0.38"/>
    <text x="1018" y="248" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800" fill="#F4EFE4">Delivery</text>
    <text x="1018" y="274" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#C5C0B6">small controlled work</text>

    <rect x="914" y="288" width="208" height="88" rx="14" fill="url(#panel)" stroke="#7FB069" stroke-opacity="0.36"/>
    <text x="1018" y="322" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800" fill="#F4EFE4">Validation</text>
    <text x="1018" y="348" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#C5C0B6">doctor, tests, handoff</text>
  </g>

  <text x="600" y="462" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#F4EFE4">One workspace for requirements, context, method, validation, and AI-assisted engineering.</text>
  <text x="600" y="489" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#B9C5BE">Copper = engineering control. Cyan = model/context flow. Green = validated delivery.</text>
</svg>
