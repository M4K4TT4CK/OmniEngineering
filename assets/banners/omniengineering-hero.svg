<svg width="1600" height="520" viewBox="0 0 1600 520" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">OmniEngineering repository banner</title>
  <desc id="desc">Repository banner for OmniEngineering showing the workspace layers for requirements, context, method, and validation.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="520" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0E0D0B"/>
      <stop offset="0.5" stop-color="#202426"/>
      <stop offset="1" stop-color="#293021"/>
    </linearGradient>
    <linearGradient id="signal" x1="128" y1="96" x2="1480" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#D88C2D"/>
      <stop offset="0.5" stop-color="#18A999"/>
      <stop offset="1" stop-color="#7FB069"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#050505" flood-opacity="0.42"/>
    </filter>
  </defs>

  <rect width="1600" height="520" rx="32" fill="url(#bg)"/>
  <path d="M90 114H1510M90 260H1510M90 406H1510" stroke="#F4EFE4" stroke-opacity="0.08" stroke-width="1"/>
  <path d="M194 70V450M800 70V450M1406 70V450" stroke="#F4EFE4" stroke-opacity="0.08" stroke-width="1"/>
  <path d="M116 392C278 288 454 286 626 342C798 398 947 160 1168 200C1308 225 1408 312 1490 390" stroke="url(#signal)" stroke-width="5" stroke-linecap="round" stroke-opacity="0.58"/>

  <g filter="url(#shadow)">
    <rect x="112" y="116" width="230" height="230" rx="44" fill="#151413" stroke="#F4EFE4" stroke-opacity="0.12"/>
    <path d="M178 166C142 166 120 190 120 230C120 270 142 294 178 294H212C248 294 270 270 270 230C270 190 248 166 212 166H178Z" stroke="#F4EFE4" stroke-width="18"/>
    <path d="M212 178H316" stroke="url(#signal)" stroke-width="18" stroke-linecap="round"/>
    <path d="M212 230H302" stroke="url(#signal)" stroke-width="18" stroke-linecap="round"/>
    <path d="M212 282H316" stroke="url(#signal)" stroke-width="18" stroke-linecap="round"/>
    <path d="M270 230L324 176" stroke="#18A999" stroke-width="8" stroke-linecap="round"/>
    <path d="M270 230L324 284" stroke="#7FB069" stroke-width="8" stroke-linecap="round"/>
  </g>

  <text x="402" y="190" font-family="Inter, Arial, sans-serif" font-size="74" font-weight="850" letter-spacing="0" fill="#F4EFE4">OmniEngineering</text>
  <text x="408" y="244" font-family="Inter, Arial, sans-serif" font-size="27" font-weight="650" letter-spacing="0" fill="#B9C5BE">Requirements. Context. Method. Validation. One repo-local workspace.</text>

  <g font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800">
    <rect x="410" y="306" width="162" height="46" rx="10" fill="#D88C2D" fill-opacity="0.16" stroke="#D88C2D" stroke-opacity="0.65"/>
    <text x="491" y="335" text-anchor="middle" fill="#F4EFE4">CONTROL</text>
    <rect x="596" y="306" width="162" height="46" rx="10" fill="#18A999" fill-opacity="0.15" stroke="#18A999" stroke-opacity="0.65"/>
    <text x="677" y="335" text-anchor="middle" fill="#F4EFE4">CONTEXT</text>
    <rect x="782" y="306" width="162" height="46" rx="10" fill="#7FB069" fill-opacity="0.15" stroke="#7FB069" stroke-opacity="0.65"/>
    <text x="863" y="335" text-anchor="middle" fill="#F4EFE4">DELIVERY</text>
  </g>

  <text x="408" y="412" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="650" fill="#B9C5BE">Built for Codex, Claude Code, Cursor, GitHub Copilot, Kiro, local models, DeepSeek, and routed model gateways.</text>
</svg>
