<svg width="280" height="52" viewBox="0 0 280 52" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="OmniEngineering">
  <!-- Panel frame (the workspace) -->
  <rect x="3" y="2" width="32" height="38" rx="3" fill="none" stroke="#e0475c" stroke-width="1.5"/>
  <circle cx="3" cy="2" r="1.5" fill="#e0475c"/>
  <circle cx="35" cy="2" r="1.5" fill="#e0475c"/>
  <circle cx="3" cy="40" r="1.5" fill="#e0475c"/>
  <circle cx="35" cy="40" r="1.5" fill="#e0475c"/>
  <!-- One control plane, fanned out to many assistant adapters -->
  <line x1="19" y1="19" x2="10" y2="9"  stroke="#e0475c" stroke-width="1" opacity="0.55"/>
  <line x1="19" y1="19" x2="28" y2="8"  stroke="#e0475c" stroke-width="1" opacity="0.45"/>
  <line x1="19" y1="19" x2="9"  y2="26" stroke="#e0475c" stroke-width="1" opacity="0.35"/>
  <line x1="19" y1="19" x2="29" y2="27" stroke="#e0475c" stroke-width="1" opacity="0.5"/>
  <line x1="19" y1="19" x2="19" y2="33" stroke="#e0475c" stroke-width="1" opacity="0.3"/>
  <circle cx="10" cy="9"  r="1.4" fill="#e0475c" opacity="0.8"/>
  <circle cx="28" cy="8"  r="1.4" fill="#e0475c" opacity="0.7"/>
  <circle cx="9"  cy="26" r="1.4" fill="#e0475c" opacity="0.6"/>
  <circle cx="29" cy="27" r="1.4" fill="#e0475c" opacity="0.75"/>
  <circle cx="19" cy="33" r="1.4" fill="#e0475c" opacity="0.55"/>
  <!-- Hub -->
  <circle cx="19" cy="19" r="7" fill="none" stroke="#e0475c" stroke-width="0.75" opacity="0.3"/>
  <circle cx="19" cy="19" r="3.5" fill="#e0475c" opacity="0.9"/>
  <!-- Beacon -->
  <circle cx="41" cy="40" r="7" fill="#e0475c"/>
  <circle cx="41" cy="40" r="3" fill="#0f0f12"/>
  <!-- Separator -->
  <line x1="56" y1="6" x2="56" y2="46" stroke="#e0475c" stroke-width="0.75" opacity="0.2"/>
  <!-- Wordmark text -->
  <text x="64" y="34" font-family="'Share Tech Mono','JetBrains Mono','Courier New',monospace" font-size="26" font-weight="700" fill="#e8e8e8" letter-spacing="-0.5">omni</text>
</svg>
