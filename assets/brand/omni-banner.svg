<svg width="820" height="180" viewBox="0 0 820 180" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="omni — Repo-local engineering workspace for AI-assisted delivery">
  <defs>
    <pattern id="om-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#e0475c" stroke-width="0.2" opacity="0.12"/>
    </pattern>
    <linearGradient id="om-fade-l" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#0f0f12" stop-opacity="1"/>
      <stop offset="100%" stop-color="#0f0f12" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="om-fade-r" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#0f0f12" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0f0f12" stop-opacity="1"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="820" height="180" fill="#0f0f12"/>
  <rect width="820" height="180" fill="url(#om-grid)"/>
  <rect width="60"  height="180" fill="url(#om-fade-l)"/>
  <rect x="760" width="60" height="180" fill="url(#om-fade-r)"/>

  <!-- ── MARK (one control plane, fanned out to many assistant adapters) ── -->
  <rect x="44" y="26" width="87" height="112" rx="7" fill="none" stroke="#e0475c" stroke-width="1.5"/>
  <circle cx="44"  cy="26"  r="2.5" fill="#e0475c"/>
  <circle cx="131" cy="26"  r="2.5" fill="#e0475c"/>
  <circle cx="44"  cy="138" r="2.5" fill="#e0475c"/>
  <circle cx="131" cy="138" r="2.5" fill="#e0475c"/>
  <!-- spokes: hub -> adapters -->
  <line x1="87" y1="82" x2="62"  y2="54"  stroke="#e0475c" stroke-width="1.3" opacity="0.55"/>
  <line x1="87" y1="82" x2="115" y2="51"  stroke="#e0475c" stroke-width="1.3" opacity="0.45"/>
  <line x1="87" y1="82" x2="59"  y2="103" stroke="#e0475c" stroke-width="1.3" opacity="0.35"/>
  <line x1="87" y1="82" x2="117" y2="105" stroke="#e0475c" stroke-width="1.3" opacity="0.5"/>
  <line x1="87" y1="82" x2="87"  y2="126" stroke="#e0475c" stroke-width="1.3" opacity="0.3"/>
  <circle cx="62"  cy="54"  r="3" fill="#e0475c" opacity="0.8"/>
  <circle cx="115" cy="51"  r="3" fill="#e0475c" opacity="0.7"/>
  <circle cx="59"  cy="103" r="3" fill="#e0475c" opacity="0.6"/>
  <circle cx="117" cy="105" r="3" fill="#e0475c" opacity="0.75"/>
  <circle cx="87"  cy="126" r="3" fill="#e0475c" opacity="0.55"/>
  <!-- hub, double ring -->
  <circle cx="87" cy="82" r="22" fill="none" stroke="#e0475c" stroke-width="0.6" opacity="0.18"/>
  <circle cx="87" cy="82" r="16" fill="none" stroke="#e0475c" stroke-width="0.9" opacity="0.32"/>
  <circle cx="87" cy="82" r="8"  fill="#e0475c" opacity="0.9"/>
  <!-- Beacon -->
  <circle cx="151" cy="150" r="20" fill="#e0475c"/>
  <circle cx="151" cy="150" r="8.5" fill="#0f0f12"/>
  <!-- Connector dashed line: mark right-edge -> wordmark -->
  <line x1="158" y1="90" x2="184" y2="90" stroke="#e0475c" stroke-width="0.75" opacity="0.25" stroke-dasharray="3,4"/>

  <!-- ── WORDMARK ─────────────────────────────────────────────────────── -->
  <text x="190" y="107"
        font-family="'Share Tech Mono','JetBrains Mono','Courier New',monospace"
        font-size="56" font-weight="700"
        fill="#e8e8e8" letter-spacing="-1">omni</text>
  <text x="192" y="132"
        font-family="'Share Tech Mono','JetBrains Mono','Courier New',monospace"
        font-size="11.5" fill="#606060" letter-spacing="3">REPO-LOCAL ENGINEERING WORKSPACE FOR AI-ASSISTED DELIVERY</text>
  <!-- Accent underline -->
  <line x1="192" y1="144" x2="700" y2="144" stroke="#e0475c" stroke-width="1" opacity="0.3"/>

  <!-- ── RIGHT-SIDE MESH ─────────────────────────────────────────────── -->
  <circle cx="630" cy="52"  r="3.5" fill="#e0475c" opacity="0.70"/>
  <circle cx="712" cy="34"  r="3.5" fill="#e0475c" opacity="0.50"/>
  <circle cx="782" cy="66"  r="3.5" fill="#e0475c" opacity="0.70"/>
  <circle cx="800" cy="118" r="3.5" fill="#e0475c" opacity="0.50"/>
  <circle cx="742" cy="148" r="3.5" fill="#e0475c" opacity="0.70"/>
  <circle cx="658" cy="142" r="3.5" fill="#e0475c" opacity="0.50"/>
  <circle cx="612" cy="108" r="3.5" fill="#e0475c" opacity="0.60"/>
  <circle cx="706" cy="90"  r="2"   fill="#e0475c" opacity="0.35"/>
  <circle cx="766" cy="108" r="2"   fill="#e0475c" opacity="0.30"/>
  <circle cx="680" cy="56"  r="2"   fill="#e0475c" opacity="0.25"/>
  <line x1="630"  y1="52"  x2="712"  y2="34"  stroke="#e0475c" stroke-width="0.75" opacity="0.28"/>
  <line x1="712"  y1="34"  x2="782"  y2="66"  stroke="#e0475c" stroke-width="0.75" opacity="0.28"/>
  <line x1="782"  y1="66"  x2="800"  y2="118" stroke="#e0475c" stroke-width="0.75" opacity="0.28"/>
  <line x1="800"  y1="118" x2="742"  y2="148" stroke="#e0475c" stroke-width="0.75" opacity="0.28"/>
  <line x1="742"  y1="148" x2="658"  y2="142" stroke="#e0475c" stroke-width="0.75" opacity="0.28"/>
  <line x1="658"  y1="142" x2="612"  y2="108" stroke="#e0475c" stroke-width="0.75" opacity="0.28"/>
  <line x1="612"  y1="108" x2="630"  y2="52"  stroke="#e0475c" stroke-width="0.75" opacity="0.28"/>
  <line x1="630"  y1="52"  x2="742"  y2="148" stroke="#e0475c" stroke-width="0.5" opacity="0.12" stroke-dasharray="3,5"/>
  <line x1="712"  y1="34"  x2="658"  y2="142" stroke="#e0475c" stroke-width="0.5" opacity="0.12" stroke-dasharray="3,5"/>
  <line x1="782"  y1="66"  x2="612"  y2="108" stroke="#e0475c" stroke-width="0.5" opacity="0.10" stroke-dasharray="3,5"/>
  <line x1="630"  y1="52"  x2="800"  y2="118" stroke="#e0475c" stroke-width="0.4" opacity="0.08" stroke-dasharray="3,6"/>
  <line x1="706"  y1="90"  x2="630"  y2="52"  stroke="#e0475c" stroke-width="0.4" opacity="0.18"/>
  <line x1="706"  y1="90"  x2="782"  y2="66"  stroke="#e0475c" stroke-width="0.4" opacity="0.18"/>
  <line x1="706"  y1="90"  x2="742"  y2="148" stroke="#e0475c" stroke-width="0.4" opacity="0.18"/>
  <line x1="706"  y1="90"  x2="658"  y2="142" stroke="#e0475c" stroke-width="0.4" opacity="0.18"/>
  <line x1="766"  y1="108" x2="800"  y2="118" stroke="#e0475c" stroke-width="0.4" opacity="0.18"/>
  <line x1="766"  y1="108" x2="782"  y2="66"  stroke="#e0475c" stroke-width="0.4" opacity="0.18"/>

  <!-- Scan line -->
  <line x1="0" y1="168" x2="820" y2="168" stroke="#e0475c" stroke-width="0.5" opacity="0.12"/>

  <!-- Signature -->
  <text x="816" y="177" text-anchor="end"
        font-family="'Share Tech Mono',monospace"
        font-size="8" fill="#252525" letter-spacing="1">OMNI·v1</text>
</svg>
