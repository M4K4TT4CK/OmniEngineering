# Arbiter policy for this repository. See docs/configuration.md in the
# arbiter checkout for every key; this is the minimum `omni gate` relies on.
version: 1
profile: offline

gate:
  fail_on:
    severity: critical
    new: high
  gate_on_inferred: false

suppress:
  # arbiter/ is a vendored workspace with its own arbiter.yaml, its own gate
  # and a fixture corpus of planted defects. This repository's scan keeps
  # those findings visible and attributed, but they are the subtree's to act
  # on, not the workspace's.
  - rule: "*"
    path: "arbiter/**"
    reason: "vendored Arbiter subtree; gated by its own arbiter.yaml (cd arbiter && arbiter gate .)"
    expires: 2099-01-01
  # The adopt-loop CI job and its test plant a request call with TLS
  # verification switched off into a throwaway repository on purpose, to
  # prove that `omni gate` fails on it and passes once it is fixed. The text
  # sits in a shell heredoc and a test literal; neither file makes a request.
  # Reported as existing since the baseline, but code scanning reads the
  # uploaded SARIF without the baseline and failed the first upstream pull
  # request on this one error-level alert. (This comment deliberately does
  # not spell the planted text: the scanner reads this file too.)
  - rule: "arbiter/authored.security-check-disabled"
    path: ".github/workflows/ci.yml"
    reason: "the adopt-loop job plants a TLS-verification-off request as text to prove the gate catches it; the workflow makes no request"
    expires: 2099-01-01
  - rule: "arbiter/authored.security-check-disabled"
    path: "tests/test_adopt_loop.py"
    reason: "the adopt-loop test plants a TLS-verification-off request as text to prove the gate catches it; the test makes no request"
    expires: 2099-01-01
  # Arbiter's Phase 1 python.command-injection rule flags the one shell=True
  # call in make_ai.py: `omni test` and the gate run the suite commands the
  # project registered in .ai/test-suites.json and its rulesets, with a shell
  # so pipes and env assignments work. The command never comes from untrusted
  # input. Same suppression as Arbiter's own arbiter.yaml.
  - rule: "arbiter/python.command-injection"
    path: "make_ai.py"
    reason: "by design: omni test / gate run the suite command the project registered, with shell=True so pipes and env assignments work; never from untrusted input"
    expires: 2027-10-21
